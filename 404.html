<!DOCTYPE html>
<html lang="en" data-section="site">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
/* full-screen app only: hold the top and bottom insets and the screen height steady (dn-pin, 18 Oct 2026).
   On every page load Android briefly brings its bars back, which changed these and made the page jump.
   A value is taken up only once it has held for 0.7 s, and remembered per orientation for the next page. */
(function(){try{
  if(!window.__dnPinTest&&(!window.matchMedia||!matchMedia('(display-mode: fullscreen)').matches))return;   // __dnPinTest: tools/tests
  var r=document.documentElement,K='dn-pin',saved={},cur=null,t=0;
  var p=document.createElement('div');
  p.style.cssText='position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;height:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
  r.appendChild(p);
  try{saved=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(e){}
  function key(){return innerWidth>innerHeight?'l':'p';}
  function now(){var s=getComputedStyle(p);return {t:Math.round(parseFloat(s.height)||0),b:Math.round(parseFloat(s.paddingBottom)||0),h:innerHeight,w:innerWidth};}
  function apply(v){r.style.setProperty('--dn-top',v.t+'px');r.style.setProperty('--dn-bot',v.b+'px');r.style.setProperty('--dn-vh',v.h+'px');}
  var s0=saved[key()];cur=(s0&&s0.w===innerWidth)?s0:now();apply(cur);
  function check(){clearTimeout(t);t=setTimeout(function(){var v=now();
    if(v.t!==cur.t||v.b!==cur.b||v.h!==cur.h||v.w!==cur.w){cur=v;apply(v);}
    saved[key()]=v;try{localStorage.setItem(K,JSON.stringify(saved));}catch(e){}},700);}
  addEventListener('resize',check);if(window.visualViewport)visualViewport.addEventListener('resize',check);check();
  setInterval(function(){if(document.hidden)return;var v=now();if(v.t!==cur.t||v.b!==cur.b||v.h!==cur.h||v.w!==cur.w)check();},1000);   // an inset can change without a resize
}catch(e){}})();
</script>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#FCFCFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131A" media="(prefers-color-scheme: dark)">
<title>Page not found — The Daily Noodle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Served by GitHub Pages for any address that doesn't exist, at any depth,
  so every link here is absolute (/...).
-->
<link rel="stylesheet" href="/front.css">
<style>
  .lost{padding:40px 0 24px}
  .lost h1{font-family:var(--display, inherit);font-size:28px;line-height:1.2;margin:0 0 10px}
  .lost p{margin:0 0 18px;color:var(--muted)}
  .lost .go{display:flex;flex-wrap:wrap;gap:10px}
  .lost .go a{border:1px solid currentColor;border-radius:999px;padding:8px 16px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mono" aria-hidden="true">DN</div>
    <div class="word">Daily<b>Noodle</b></div>
  </header>
  <main class="lost">
    <h1 id="lostH">That page isn't here</h1>
    <p id="lostP">The link may be mistyped, or the page may have moved. Today's news, puzzles and games are a tap away.</p>
    <nav class="go" aria-label="Sections">
      <a href="/">News</a>
      <a href="/puzzles.html">Puzzles</a>
      <a href="/games.html">Games</a>
    </nav>
  </main>
</div>
<script>
/* A dated piece or puzzle that isn't out yet (19 Oct 2026). The site only
   serves a file once its London day has come and the nightly build has run,
   which can be an hour or two after midnight, so a link to today's (or a
   later) puzzle can land here first. Say so, rather than "isn't here". */
(function(){try{
  var m=location.pathname.match(/\/reports\/(\d{4})-(\d{2})-(\d{2})-[^\/]+\.html$/);if(!m)return;
  var day=m[1]+'-'+m[2]+'-'+m[3],today;
  try{today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}catch(e){today=new Date().toISOString().slice(0,10);}
  if(day<today)return;
  var h=document.getElementById('lostH'),p=document.getElementById('lostP');
  var tt=document.title;document.title='Not out yet — The Daily Noodle';
  if(day===today){
    var h0=h.textContent,p0=p.textContent,t0=tt;
    h.textContent='Nearly ready';p.textContent='Today’s set is still being published. It usually appears within a couple of hours of midnight, so try again shortly.';
    // once today's build has run, a missing file for today really is missing
    fetch('/puzzles-today.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(j&&j.today===today){h.textContent=h0;p.textContent=p0;document.title=t0;}
    }).catch(function(){});
  }
  else{var d=new Date(day+'T12:00:00Z');h.textContent='Not out yet';p.textContent='This one comes out on '+d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})+'.';}
}catch(e){}})();
</script>
</body>
</html>
