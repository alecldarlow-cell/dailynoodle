  Private leagues, one daily leaderboard per puzzle. Uses the shared front
  styles (front.css) in the Puzzles colours; the data and league logic is in
  dn-board.js. Reached from the Board pill on puzzles.html, the "See today's

<style>
  .mast .home{display:flex;align-items:center;gap:11px;flex:none}
  .mast .home .mono{display:grid}
  .lgslot{position:relative;margin-left:auto;min-width:0;text-align:right;line-height:1.25}
  .lgk{display:block;font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .lgn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--display);font-weight:700;font-size:14.5px;color:var(--ink)}
  .lgn .car{color:var(--accent);font-size:11px;margin-left:4px}
  .lgslot select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  .pillbar{padding:6px 0 8px}

  .daybtn{flex:none;width:40px;height:40px;display:grid;place-content:center;border:1px solid var(--hair);
    background:var(--paper);color:var(--ink);border-radius:999px;font-size:18px;cursor:pointer}
  .daybtn:disabled{opacity:.3;cursor:default}
  .daylabel{position:relative;flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;
    padding:8px 0;border-radius:8px;cursor:pointer}
  .daylabel small{display:block;font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}

  .play{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;padding:12px 14px;

  .rows{list-style:none;margin-top:10px;border-top:1px solid var(--hair)}

  .row .res small{display:block;font:500 12px var(--body);color:var(--faint)}
  .row.me{background:var(--accent-soft)}
  .row.dim .res,.row.dim .who{color:var(--muted)}
  .sub{margin-top:18px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .notyet{margin-top:6px;font-size:14.5px;color:var(--muted)}
  .nobody{padding:28px 0 10px;text-align:center;color:var(--muted);font-size:15px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 16px;
    border-radius:999px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);
    font:600 14px var(--body);cursor:pointer}
  .btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.alt{background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent)}
  .btn svg{width:17px;height:17px;flex:none}
  .acts.main .btn{flex:1 1 150px}
  .btn.warn{color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .bcard{margin-top:18px;padding:18px 16px;background:var(--paper);border:1px solid var(--hair);border-radius:12px}

  .bcard p{margin-top:8px;font-size:15px;color:var(--muted);line-height:1.5}

  .plist button{font:600 13px var(--body);color:var(--bad);background:none;border:0;cursor:pointer;padding:6px}
  .inline{display:flex;gap:8px;margin-top:6px}
  .inline input{flex:1;min-width:0;font:500 15px var(--body);padding:8px 10px;border:1px solid var(--hair);border-radius:8px}
  .loading{padding:40px 0;text-align:center;color:var(--faint);font-size:14px}
  /* your leagues somewhere else (21 Oct 2026) */
  .bcard p.tip{padding:10px 12px;background:var(--accent-soft);border-radius:10px;color:var(--ink);font-size:14.5px}
  .set .grp p.fine{font-size:12.5px;color:var(--faint)}
  .bcard p.also{margin-top:14px;text-align:center}
  .lnk{font:600 14.5px var(--body);color:var(--accent);background:none;border:0;padding:6px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .plist button.ok{color:var(--accent)}
  .field select{width:100%;font:500 16px var(--body);padding:10px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--paper);color:var(--ink)}
  .bnote{margin-top:6px;font-size:14.5px;color:var(--muted)}
  .bnote.how{margin-top:14px;font-size:13px;color:var(--faint)}
  .set .grp p.fine,.grp p.fine{font-size:12.5px;color:var(--faint);margin-top:6px}
  /* records and honours (25 Oct 2026) */
  .nk{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline dotted var(--hair);text-underline-offset:4px}
  .crown{margin-left:4px}
  .reline{margin-top:10px;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;font-size:14px;color:var(--muted)}
  .reline b{color:var(--ink)}
  .row.rec{grid-template-columns:34px 1fr auto}
  .row.rec .rk{font-size:20px}
  .row .who .st b{font-weight:700;color:var(--muted)}
  .hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .hgrid div{padding:12px;border:1px solid var(--hair);border-radius:10px;background:var(--paper);min-width:0}
  .hgrid b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
  .hgrid span{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
  .back{margin-top:14px}
  [hidden]{display:none!important}
</style>

<script>
(function () {
  var NB = window.noodleBoard, TYPES = NB.TYPES;
  var $app = document.getElementById('app'), $pills = document.getElementById('pills');
  var Q = new URLSearchParams(location.search);
  var S = {
    type: (NB.BY_ID[Q.get('p')] || Q.get('p') === 'all' || Q.get('p') === 'records') ? Q.get('p') : (NB.lastType() || 'all'),
    date: /^\d{4}-\d{2}-\d{2}$/.test(Q.get('d') || '') ? Q.get('d') : NB.today(),
    join: (Q.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12),
    from: Q.get('from') || (Q.get('join') ? 'join' : 'direct'),
    feed: null, data: null, rec: null, card: ''
  };
  if (S.date > NB.today()) S.date = NB.today();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  /* dn-track.js loads deferred, after this script: events from the first run (board_open,
     board_key) wait for it. Until 21 Oct 2026 they were dropped, so board_open never recorded. */
  var early = [];
  function track(e, p) {
    if (!window.digi) { if (early) early.push([e, p]); return; }
    try { window.digi.track(e, p); window.digi.flush(); } catch (x) {}
  }
  document.addEventListener('DOMContentLoaded', function () {
    var q = early; early = null;
    if (window.digi) q.forEach(function (a) { track(a[0], a[1]); });
  });
  function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dayName(iso) {
    var d = new Date(iso + 'T12:00:00Z');
    var s = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
    return iso === NB.today() ? 'Today' : iso === addDays(NB.today(), -1) ? 'Yesterday' : s;
  }
  function longDay(iso) {
    return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  }
  function mmss(s) { if (s == null) return ''; s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
  function result(t, r) {
    if (t === 'tangle' || t === 'borders' || t === 'reckon') return { big: (r.score == null ? '–' : r.score) + ' pts', small: r.secs ? mmss(r.secs) : '' };
    if (r.outcome === 'failed') return { big: t === 'link' ? 'Out of guesses' : 'Didn’t finish', small: '' };
    if (r.outcome === 'revealed') return { big: 'Revealed', small: '' };
    var small = t === 'link' ? (r.mistakes === 1 ? '1 mistake' : (r.mistakes || 0) + ' mistakes') : '';
    return { big: mmss(r.secs), small: small };
  }
  var MEDAL = { 1: '🥇', 2: '🥈', 3: '🥉' };
  // v= is the link-preview version. WhatsApp keeps the preview it first made for a link,
  // so bump it when the share image changes (assets/share-card.png; see SITE.md).
  var PREVIEW_V = '2';
  function link(code) { return 'https://dailynoodle.co.uk/board.html?join=' + encodeURIComponent(code) + '&v=' + PREVIEW_V; }
  function share(text, url, btn) {
    if (navigator.share) return navigator.share({ text: text, url: url }).catch(function () {});
    var all = text + '\n' + url;
    (navigator.clipboard ? navigator.clipboard.writeText(all) : Promise.reject()).then(function () {
      if (btn) { var o = btn.textContent; btn.textContent = 'Copied — paste into WhatsApp'; setTimeout(function () { btn.textContent = o; }, 2500); }
    }, function () { window.prompt('Copy this:', all); });
  }
  function syncUrl() {
    var u = new URL(location.href);
    u.searchParams.set('p', S.type); u.searchParams.set('d', S.date);
    u.searchParams.delete('join'); u.searchParams.delete('from'); u.searchParams.delete('v');
    try { history.replaceState(null, '', u.pathname + u.search); } catch (e) {}
  }

  /* ---------- puzzle pills ---------- */
  var PILLS = [{ id: 'all', emoji: '🏆', name: 'All puzzles' }, { id: 'records', emoji: '🏅', name: 'Records' }].concat(TYPES);   // All: the 24 Oct 2026 table across the eight; Records: 25 Oct 2026
  function renderPills() {
    $pills.innerHTML = PILLS.map(function (t) {
      return '<button class="chip" type="button" data-p="' + t.id + '" aria-pressed="' + (t.id === S.type) + '">' +
        t.emoji + ' ' + t.name + '</button>';
    }).join('');
    document.getElementById('pillbar').hidden = !NB.inAny();
    var on = $pills.querySelector('[aria-pressed="true"]');
    if (on && on.scrollIntoView) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  $pills.addEventListener('click', function (e) {
    var b = e.target.closest('[data-p]'); if (!b) return;
    S.type = b.getAttribute('data-p'); S.card = ''; NB.setLastType(S.type); renderPills(); loadBoard();
  });

  /* ---------- feed (puzzle numbers and links) ---------- */
  function puzzleItem(type, date) {
    if (!S.feed) return null;
    for (var i = 0; i < S.feed.length; i++) {
      var it = S.feed[i], t = NB.typeOfPath(it.path);
      if (it.kind === 'puzzle' && t && t.id === type && it.date === date) return it;
    }
    return null;
  }

  /* ---------- screens ---------- */
  function intro() {
    document.getElementById('pillbar').hidden = true;
    $app.innerHTML =
      '<div class="bcard"><div class="ico" aria-hidden="true">🏆</div><h2>Daily leaderboards for your group</h2>' +
      '<p>See how your family or friends did on each day’s puzzles. No sign-up, just a nickname.</p>' +
      '<ol class="steps"><li>Start a league and give it a name.</li><li>Share its link in your group chat.</li>' +
      '<li>Everyone’s results appear on a board for each puzzle, every day.</li></ol>' +
      '<div class="acts"><button class="btn go" data-go="start">Start a league</button>' +
      '<button class="btn" data-go="code">Join with a code</button></div>' +
      '<p class="also"><button class="lnk" type="button" data-go="claim">Already in a league on another browser or app?</button></p></div>';
  }
  /* ---------- your leagues somewhere else (21 Oct 2026; see dn-board.js moveLink) ---------- */
  var IOS = NB.isIOS();
  var KEY_TEXT = 'My Daily Noodle link. Open it where I play to bring my leagues, results and streaks there. (It’s my key: not for sharing.)';
  function keyGroup() {
    return '<div class="grp" id="keygrp"><h3>Play somewhere else too?</h3><p>Your leagues are kept in this browser. ' +
      (IOS ? 'On an iPhone, Safari, the home-screen app and links opened inside WhatsApp each keep their own. ' : '') +
      'Where else you play, open the league’s invite link, tap <b>Already in this league?</b>, pick your nickname and enter your PIN.</p>' +
      '<p class="fine">Or send yourself your personal link, which also brings your streaks. It’s your key, so don’t post it in a group.</p>' +
      '<div class="acts"><button class="btn" data-act="key">Send me my link</button>' +
      '<button class="btn" data-go="paste">Paste a link</button></div></div>';
  }
  /* ---------- PINs (24 Oct 2026; see dn-board.js claim) ---------- */
  var PIN_FIELD = function (label, hint) {
    return '<label class="field"><span>' + label + '</span><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" ' +
      'autocomplete="off" placeholder="4 numbers"><small>' + hint + '</small></label>';
  };
  var PIN_HINT = 'Lets you join as yourself from another phone or app later. Optional, and you can set it later.';
  function pinOk(v) { return /^[0-9]{4}$/.test(v); }
  function afterJoinPin(f) {   // the optional PIN on the start and join forms; a failure here never undoes the join
    var v = (f.elements.pin && f.elements.pin.value || '').trim();
    if (!v) return Promise.resolve();
    if (!pinOk(v)) return Promise.resolve();
    return NB.setPin(v).then(function () { track('board_pin', { act: 'set', from: 'join' }); }, function () {});
  }
  function pinLater() { try { return localStorage.getItem('noodle-board-pinlater') === NB.today(); } catch (e) { return false; } }
  function claimForm(info) {
    document.getElementById('pillbar').hidden = true;
    var known = !!(info && info.code);
    var names = known && info.players && info.players.length;

  function cur() {

  function loadBoard() {
    var L = cur(); if (!L) { renderLeague(null); return intro(); }

        .then(function () { S.filled = true; S.filling = false; loadBoard(); });

  }

  }
  function R0() { return S.rec && S.rec.code === (cur() || {}).code ? S.rec.d : null; }
  function recOf(t) { var r = R0(); return r && r.records && r.records[t] || null; }
  function isRecord(t, n) { var x = recOf(t); return !!x && x.nick === n && x.date === S.date; }
  function crowned(n) { var r = R0(); return !!r && (r.crown || []).indexOf(n) >= 0; }
  function nick(n, plain) {   // plain: no 👑 (in lists of names, where it would repeat)
    return '<button type="button" class="nk" data-nick="' + esc(n) + '">' + esc(n) + '</button>' +
      (!plain && crowned(n) ? '<span class="crown" title="Last week’s champion" aria-label="last week’s champion">👑</span>' : '');
  }
  function shortDay(iso) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }); }
  var HONOURS = [
    { k: 'longest', e: '🔥', name: 'Longest streak', unit: function (n) { return n + (n === 1 ? ' day' : ' days'); } },
    { k: 'current', e: '🔥', name: 'Current streak', unit: function (n) { return n + (n === 1 ? ' day' : ' days'); } },
    { k: 'wins', e: '🥇', name: 'Daily wins', unit: String },
    { k: 'titles', e: '👑', name: 'Weekly titles', unit: String },
    { k: 'perfect', e: '⭐', name: 'Perfect days', unit: String },
    { k: 'sweeps', e: '🧹', name: 'Clean sweeps', unit: String },
    { k: 'completed', e: '📚', name: 'Puzzles finished', unit: String }
  ];
  function renderRecords(L, d) {
    var h = topCard(L), any = false;
    h += '<p class="sub">League records</p><ol class="rows">';
    TYPES.forEach(function (T) {
      var r = d.records && d.records[T.id]; if (!r) return; any = true;
      var res = result(T.id, r);
      h += '<li class="row rec' + (r.me ? ' me' : '') + '"><span class="rk" aria-hidden="true">' + T.emoji + '</span>' +
        '<span class="who">' + esc(T.name) + '<span class="st">' + nick(r.nick, true) + ' · ' + esc(shortDay(r.date)) +
        (r.date === d.today ? ' · 🏆 today' : '') + '</span></span>' +
        '<span class="res">' + esc(res.big) + (res.small ? '<small>' + esc(res.small) + '</small>' : '') + '</span></li>';
    });
    h += '</ol>';
    if (!any) h += '<p class="bnote">No records yet: finish a puzzle to set the first.</p>';
    h += '<p class="sub">Honours</p><ol class="rows">';
    HONOURS.forEach(function (H) {
      var top = 0; (d.players || []).forEach(function (p) { top = Math.max(top, p[H.k] || 0); });
      var who = (d.players || []).filter(function (p) { return top > 0 && p[H.k] === top; });
      h += '<li class="row rec"><span class="rk" aria-hidden="true">' + H.e + '</span><span class="who">' + esc(H.name) +
        '<span class="st">' + (who.length ? who.map(function (p) { return nick(p.nick, true); }).join(', ') : 'Nobody yet') + '</span></span>' +
        '<span class="res">' + (top ? esc(H.unit(top)) : '–') + '</span></li>';
    });
    h += '</ol>';
    h += '<p class="sub">Players</p><ol class="rows">' + (d.players || []).slice().sort(function (a, b) { return b.completed - a.completed; }).map(function (p) {
      return '<li class="row' + (p.me ? ' me' : '') + '"><span class="rk">' + (p.titles ? '👑' : p.wins ? '🥇' : '·') + '</span>' +
        '<span class="who">' + nick(p.nick) + (p.me ? '<span class="you">you</span>' : '') +
        '<span class="st">' + p.wins + (p.wins === 1 ? ' win' : ' wins') + ' · ' + p.titles + (p.titles === 1 ? ' title' : ' titles') + ' · best streak ' + p.longest + '</span></span>' +
        '<span class="res">' + p.completed + '<small>finished</small></span></li>'; }).join('') + '</ol>';
    h += '<p class="bnote how">Records count finished puzzles only; on a tie, whoever set it first keeps it. A daily win needs at least one ' +
         'other player to have finished that puzzle, and a weekly title (the All puzzles week) at least two players. A perfect day is every ' +
         'puzzle that day finished; a clean sweep is a perfect day winning all of them. A streak is days in a row with a puzzle finished. ' +
         '👑 marks last week’s champion. Tap a name to see their card.</p>';
    h += '<div class="acts main"><button class="btn go" data-act="invite">' + INVITE_ICON + 'Invite people</button></div>';
    h += settings(L, S.data);
    $app.innerHTML = h;
  }
  function renderCard(L, n) {
    var d = R0(), p = d && (d.players || []).filter(function (x) { return x.nick === n; })[0];
    if (!p) { S.card = ''; return loadBoard(); }
    var h = '<div class="bcard"><h2>' + esc(p.nick) + (crowned(p.nick) ? ' 👑' : '') + (p.me ? ' <span class="lgk" style="display:inline">you</span>' : '') + '</h2>' +
      (crowned(p.nick) ? '<p>Last week’s champion.</p>' : '') +
      '<div class="hgrid">' + HONOURS.map(function (H) {
        return '<div><b>' + String(p[H.k] || 0) + '</b><span>' + H.e + ' ' + esc(H.name) +
          (H.k === 'longest' || H.k === 'current' ? ' (days)' : '') + '</span></div>'; }).join('') + '</div>' +
      '<p class="sub">Bests</p><ol class="rows">' + TYPES.map(function (T) {
        var b = p.bests && p.bests[T.id], st = p.streaks && p.streaks[T.id] || 0;
        var res = b ? result(T.id, b) : null, rec = recOf(T.id), holds = rec && rec.nick === p.nick;
        return '<li class="row rec"><span class="rk" aria-hidden="true">' + T.emoji + '</span><span class="who">' + esc(T.name) +
          '<span class="st">' + (b ? esc(shortDay(b.date)) + (holds ? ' · 🏅 league record' : '') : 'Not finished yet') +
          (st > 1 ? ' · best streak ' + st : '') + '</span></span>' +
          '<span class="res">' + (res ? esc(res.big) + (res.small ? '<small>' + esc(res.small) + '</small>' : '') : '–') + '</span></li>'; }).join('') + '</ol>' +
      '<div class="acts back"><button class="btn" data-act="cardback">← Back</button></div></div>';
    $app.innerHTML = h;
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  $app.addEventListener('click', function (e) {
    var b = e.target.closest('.nk'); if (!b) return;
    var L = cur(); if (!L || !R0()) return;
    S.card = b.getAttribute('data-nick'); renderCard(L, S.card);
    track('board_card', { type: S.type });
  });
  function settings(L, d) {
    var h = '<details class="set"><summary>League settings</summary>' +
      '<div class="grp"><h3>Invite</h3><p>Code <span class="code">' + esc(L.code) + '</span> · ' + d.members + (d.members === 1 ? ' player' : ' players') + '</p></div>' +
      '<div class="grp"><h3>Another group?</h3><p>Start a separate league for friends, work or another chat. You can be in more than one.</p>' +
      '<div class="acts"><button class="btn" data-go="start" data-from="settings">Start another league</button></div></div>' +
      '<div class="grp"><h3>You</h3><p>Playing as <b>' + esc(L.nick) + '</b> · PIN ' + (NB.hasPin() ? 'set' : 'not set') + '</p>' +
      '<div class="acts"><button class="btn" data-go="pin">' + (NB.hasPin() ? 'Change PIN' : 'Set a PIN') + '</button>' +
      '<button class="btn warn" data-act="leave">Leave league</button></div></div>' + keyGroup();
    if (L.owner) {
      h += '<div class="grp"><h3>League name</h3><div class="inline"><input id="rn" maxlength="30" value="' + esc(L.name) + '">' +
           '<button class="btn" data-act="rename">Save</button></div></div>' +
           '<div class="grp"><h3>Players</h3><ul class="plist">' + (d.players || []).map(function (p) {
             return '<li><span>' + esc(p) + (p === L.nick ? ' (you)' : '') + '</span>' +
               (p === L.nick ? '' : '<span><button class="ok" data-act="letback" data-nick="' + esc(p) + '">Let back in</button>' +
                 '<button data-act="remove" data-nick="' + esc(p) + '">Remove</button></span>') + '</li>'; }).join('') + '</ul>' +
             '<p class="fine">Let back in: for a day, that player can join as themselves from another phone or app without their PIN, then sets a new one.</p></div>' +
           '<div class="grp"><h3>Join code</h3><p>A new code stops the old link and code working; everyone already in stays in.</p>' +
           '<div class="acts"><button class="btn" data-act="newcode">New join code</button></div></div>' +
           '<div class="grp"><h3>Close league</h3><p>Takes the league off everyone’s boards.</p>' +
           '<div class="acts"><button class="btn warn" data-act="close">Close league</button></div></div>';
    }
    return h + '<p class="msg" id="sm"></p></details>';
  }
  $app.addEventListener('change', function (e) {
    if (e.target.id === 'pick' && e.target.value) { S.date = e.target.value > NB.today() ? NB.today() : e.target.value; loadBoard(); }
  });
  $app.addEventListener('click', function (e) {
    var d = e.target.closest('[data-day]');
    if (d && !d.disabled) { S.date = addDays(S.date, +d.getAttribute('data-day')); loadBoard(); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    var L = cur(), act = a.getAttribute('data-act'), sm = document.getElementById('sm');
    function fail(err) { if (sm) { sm.className = 'msg'; sm.textContent = err.message; } }
    function done(msg) { return NB.refresh().then(function () { loadBoard(); }); }
    if (act === 'cardback') { S.card = ''; loadBoard(); return; }
    if (act === 'share') {
      var T = NB.BY_ID[S.type], it = puzzleItem(S.type, S.date), D = S.data;
      var lines = ['🏆 ' + T.emoji + ' ' + (it ? it.headline : T.name) + ' · ' + longDay(S.date)];
      D.ranked.slice(0, 5).forEach(function (r) {
        var res = result(T.id, r);
        lines.push((MEDAL[r.rank] || r.rank + '.') + ' ' + r.nick + ' ' + res.big + (res.small ? ' (' + res.small + ')' : ''));
      });
      if (D.ranked.length > 5) lines.push('+' + (D.ranked.length - 5) + ' more');
      lines.push(L.name + ' leaderboard:');
      share(lines.join('\n'), link(L.code) + '&p=' + S.type + '&d=' + S.date, a);
      track('board_share', { type: S.type });
    } else if (act === 'shareall') {
      var D2 = S.data, ln = ['🏆 All puzzles · ' + longDay(S.date)];
      D2.day.slice(0, 5).forEach(function (r) { ln.push((MEDAL[r.rank] || r.rank + '.') + ' ' + r.nick + ' ' + pts(r.points) + ' (' + r.completed + '/8)'); });
      if (D2.day.length > 5) ln.push('+' + (D2.day.length - 5) + ' more');
      ln.push(L.name + ' leaderboard:');
      share(ln.join('\n'), link(L.code) + '&p=all&d=' + S.date, a);
      track('board_share', { type: 'all' });
    } else if (act === 'letback') {
      var w2 = a.getAttribute('data-nick');
      NB.owner('let_back', L.code, { p_nick: w2 }).then(function (ok) {
        if (sm) { sm.className = 'msg ok'; sm.textContent = ok ? w2 + ' can join from another phone or app without a PIN for the next day: ask them to open the league link and tap “Already in this league?”.' : 'Couldn’t find ' + w2 + '.'; }
        track('board_pin', { act: 'letback' });
      }, fail);
    } else if (act === 'key') {
      share(KEY_TEXT, NB.moveLink(), a);
      track('board_key', { act: 'send' });
    } else if (act === 'invite') {
      share('Join ' + L.name + ' on Noodle Puzzles: tap the link, pick a nickname, and your results go on our daily leaderboards.', link(L.code), a);
      track('board_invite', {});
    } else if (act === 'leave') {
      if (!confirm('Leave ' + L.name + '? You’ll come off its boards. You can rejoin with the link.')) return;
      NB.leave(L.code).then(function () { S.data = null; NB.setCurrent(''); loadBoard(); }, fail);
    } else if (act === 'remove') {
      var who = a.getAttribute('data-nick');
      if (!confirm('Remove ' + who + ' from ' + L.name + '? They come off its boards. They could rejoin with the link unless you make a new join code.')) return;
      NB.owner('remove', L.code, { p_nick: who }).then(done, fail);
    } else if (act === 'close') {
      if (!confirm('Close ' + L.name + ' for everyone? It comes off all its players’ boards.')) return;
      NB.owner('close', L.code).then(function () { NB.setCurrent(''); S.data = null; return done(); }, fail);
    } else if (act === 'rename') {
      NB.owner('rename', L.code, { p_name: document.getElementById('rn').value.trim() }).then(done, fail);
    } else if (act === 'newcode') {
      if (!confirm('Make a new join code? The old link and code stop working; people already in the league stay in.')) return;
      NB.owner('new_code', L.code).then(function (r) { NB.setCurrent(r.code); return done(); }, fail);
    }
  });

  /* ---------- start ---------- */
  // Opened with someone's own link: dn-track.js unpacks it and reloads this page, so don't start yet.
  if (location.hash.indexOf('#dnmove=') === 0) return;
  var arrived = NB.moved(); if (arrived) { S.moved = arrived; track('board_key', { act: 'open' }); }
  track('board_open', { from: S.from });
  var feed = fetch('feed.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
    .then(function (j) { S.feed = j.items || []; }, function () { S.feed = []; });
  var mine = NB.refresh().catch(function () { return NB.leagues(); });
  Promise.all([feed, mine]).then(function () {
    var pend = NB.pending(); if (pend) return pendForm(pend);
    if (S.join) {
      var have = NB.leagues().filter(function (l) { return l.code === S.join; })[0];
      if (have) { NB.setCurrent(have.code); S.join = ''; return loadBoard(); }
      return NB.peek(S.join).then(joinForm, function () {
        S.join = '';
        $app.innerHTML = '<div class="bcard"><h2>That link has expired</h2><p>The league may have closed or changed its code. ' +
          'Ask for a new link.</p></div>';
      });
    }
    NB.inAny() ? loadBoard() : intro();
  });

  // Notifications are switched off; ?push=test loads the hidden test panel (dn-push.js).
  if (/[?&]push=test\b/.test(location.search)) {
    var ps = document.createElement('script'); ps.src = 'dn-push.js'; ps.defer = true; document.body.appendChild(ps);
  }
})();
</script>
<script src="dn-track.js" defer></script>
</body>
</html>
