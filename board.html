<!--
  NOODLE PUZZLES — LEADERBOARD  (board.html)
  Private leagues, one daily leaderboard per puzzle. Uses the shared front
  styles (front.css) in the Puzzles colours; the data and league logic is in
  dn-board.js. Reached from the Board pill on puzzles.html, the "See today's
  board" link in each puzzle's result box, and league join links.

<link rel="stylesheet" href="front.css">
<style>
  .mast .home{display:flex;align-items:center;gap:11px;flex:none}
  .mast .home .mono{display:grid}
  .lgslot{position:relative;margin-left:auto;min-width:0;text-align:right;line-height:1.25}
  .lgk{display:block;font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .lgn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--display);font-weight:700;font-size:14.5px;color:var(--ink)}
  /* the league as the masthead's kicker, "NOODLERS ▾", opening the league menu (7 Nov 2026, as the app) */
  .lgbtn{position:relative;display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:44px;padding:0;margin:-7px 0;
    background:none;border:0;cursor:pointer;color:var(--ink);font:inherit}
  .lgbtn .lgn{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
  .lgbtn .car{flex:none;display:block;color:var(--ink)}
  .lgmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:230px;max-width:min(320px,calc(100vw - 32px));text-align:left;
    background:var(--paper);border:1px solid var(--hair);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);overflow:hidden}
  .lgmenu button{display:flex;align-items:center;width:100%;min-height:48px;padding:0 16px;border:0;border-top:1px solid var(--hair);
    background:none;color:var(--ink);font:600 15px var(--body);text-align:left;cursor:pointer}
  .lgmenu button:first-child{border-top:0}
  .lgmenu button[aria-checked="true"]{background:var(--accent-soft);font-weight:700}
  .lgmenu button.acc{color:var(--accent)}
  .lgmenu button:hover,.lgmenu button:focus-visible{background:var(--accent-soft)}
  /* the puzzle pager: ‹ [tile] Mini 119 / Today · Sat 7 Nov ▾ ›, a dot for each stop (7 Nov 2026, as the app) */
  .pager{padding:14px 0 0}
  .pg{display:flex;align-items:center;gap:6px}
  .pg-arrow{flex:none;width:44px;height:44px;display:grid;place-content:center;border:0;border-radius:999px;background:none;
    color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
  .pg-arrow:hover:not(:disabled){background:var(--accent-soft)}
  .pg-arrow:disabled{opacity:.3;cursor:default}
  .pg-mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:12px}
  .pg-ico{flex:none;width:48px;height:48px;display:grid;place-content:center}
  .pg-ico img{width:48px;height:48px;display:block}
  .pg-ico.mono{border-radius:8px}
  .pg-txt{min-width:0}
  .pg-title{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pg-day{position:relative;display:inline-flex;align-items:center;gap:5px;font:500 13.5px var(--body);color:var(--muted);
    background:none;border:0;padding:0;cursor:pointer}
  button.pg-day::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:44px;transform:translateY(-50%)}
  span.pg-day{cursor:default}
  .chev{display:block;flex:none}
  .dots{display:flex;justify-content:center;flex-wrap:wrap;margin:2px 0 0}
  .dot{width:24px;height:32px;display:grid;place-content:center;border:0;background:none;padding:0;cursor:pointer}
  .dot i{display:block;width:6px;height:6px;border-radius:3px;background:var(--hair)}
  .dot[aria-pressed="true"] i{width:16px;background:var(--accent)}
  .dot:hover i{background:var(--muted)}
  .dot[aria-pressed="true"]:hover i{background:var(--accent)}
  .notes{margin-top:12px;font-size:13.5px;color:var(--muted)}
  .acts.share{justify-content:flex-start;margin:24px 0 32px}
  .btn.quiet{min-height:48px;padding:8px 20px;background:var(--accent-soft);border-color:transparent;color:var(--accent);font:700 15px var(--display)}   /* the app's tonal Button */

  .toast{position:fixed;left:50%;bottom:calc(84px + var(--dn-bot,env(safe-area-inset-bottom,0px)));transform:translateX(-50%);z-index:60;

  .row .rk img.tile{width:26px;height:26px;display:block;margin:0 auto}

  .daybtn{position:relative;flex:none;width:32px;height:32px;display:grid;place-content:center;border:1px solid var(--hair);
    background:var(--paper);color:var(--ink);border-radius:999px;font-size:16px;cursor:pointer}
  .daybtn::after{content:"";position:absolute;inset:-6px}
  .daybtn:disabled{opacity:.3;cursor:default}
  .daylabel{position:relative;flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:15px;
    padding:6px 0;min-height:44px;display:grid;place-content:center;border-radius:8px;cursor:pointer}
  .daylabel small{display:block;font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .daylabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .play{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;padding:12px 14px;
    background:var(--accent-soft);border-radius:10px;font-size:14.5px}
  .play a{font-weight:700;color:var(--accent);white-space:nowrap}
  .rows{list-style:none;margin-top:10px;border-top:1px solid var(--hair)}
  /* one rule between the masthead and the table (7 Nov 2026, as the app): the first table has no top rule */
  #app > ol.rows:first-of-type{border-top:0}

    border-bottom:1px solid var(--hair)}
  .row .rk{font-family:var(--display);font-weight:800;font-size:16px;text-align:center;color:var(--muted)}

  .row .who .you{font:700 10.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-left:6px}
  .row .who .st{display:block;font-weight:500;font-size:12.5px;color:var(--faint)}
  .row .res{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;text-align:right}
  .row .res small{display:block;font:500 12px var(--body);color:var(--faint)}
  .row.me{background:var(--accent-soft)}
  /* podium discs and your row's tint (7 Nov 2026, as the app's PlaceMedal: gold, silver, bronze with a darker rim and a highlight) */
  .disc{position:relative;display:grid;place-content:center;width:28px;height:28px;margin:0 auto;border-radius:50%;border:2px solid;
    overflow:hidden;font:800 14px/1 var(--display);font-style:normal}
  .disc::before{content:"";position:absolute;top:3px;left:5px;width:9px;height:5px;border-radius:3px;opacity:.85;transform:rotate(-30deg)}
  .disc.d1{background:#E8B931;border-color:#B88A12;color:#5A4300} .disc.d1::before{background:#FFF1B8}
  .disc.d2{background:#C3CAD6;border-color:#8C95A6;color:#2B3140} .disc.d2::before{background:#F4F6FA}
  .disc.d3{background:#C9874A;border-color:#94592A;color:#3D2310} .disc.d3::before{background:#F2C9A0}
  .row.me.p1{background:#E8B93122} .row.me.p2{background:#C3CAD622} .row.me.p3{background:#C9874A22}
  .row.dim .res,.row.dim .who{color:var(--muted)}
  .sub{margin-top:18px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .notyet{margin-top:6px;font-size:14.5px;color:var(--muted)}
  .nobody{padding:28px 0 10px;text-align:center;color:var(--muted);font-size:15px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 16px;
    border-radius:999px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);
    font:600 14px var(--body);cursor:pointer}
  .btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.alt{background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent)}
  .btn svg{width:17px;height:17px;flex:none}
  .acts.main .btn{flex:1 1 150px}
  .btn.warn{color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .bcard{margin-top:18px;padding:18px 16px;background:var(--paper);border:1px solid var(--hair);border-radius:12px}
  .bcard h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.25}
  .bcard p{margin-top:8px;font-size:15px;color:var(--muted);line-height:1.5}
  .bcard .acts .btn{flex:1 1 140px}
  .bcard .ico{font-size:30px;line-height:1;margin-bottom:10px}
  .steps{list-style:none;margin:16px 0 4px;counter-reset:s}
  .steps li{position:relative;padding:0 0 10px 34px;font-size:15px;line-height:1.45;color:var(--ink)}
  .steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:23px;height:23px;
    border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 12.5px/23px var(--body);text-align:center}
  .field{display:block;margin-top:14px}
  .field span{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .field input{width:100%;font:500 16px var(--body);padding:10px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--paper);color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field small{display:block;margin-top:5px;font-size:12.5px;color:var(--faint)}
  .msg{margin-top:10px;font-size:14px;color:var(--bad);min-height:1em}
  .msg.ok{color:var(--accent)}
  /* the sign-in card moved to account.html (7 Nov 2026); dn-sync.js still runs here to forward sign-in links and sync */
  .lnk{font:inherit;font-size:14px;background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer}
  .lnk.warn{color:var(--bad)}
  details.set{margin-top:26px;border-top:1px solid var(--hair);padding-top:12px}
  details.set summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted);list-style:none}
  details.set summary::-webkit-details-marker{display:none}
  details.set summary::before{content:"⚙︎ "}
  .set .grp{margin-top:14px}
  .set .grp h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .set .grp p{font-size:14.5px;margin-top:4px}
  .code{font-family:var(--display);font-weight:800;letter-spacing:.12em}
  .plist{list-style:none;margin-top:6px}
  .plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--hair);font-size:15px}
  .plist button{font:600 13px var(--body);color:var(--bad);background:none;border:0;cursor:pointer;padding:6px}
  .inline{display:flex;gap:8px;margin-top:6px}
  /* league rules, Report and Hide (8 Nov 2026, Google Play's user-generated content policy) */
  .rules{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.4}
  .rules input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)}
  .rules a{color:var(--accent)}
  .plist button.quiet{color:var(--faint)}
  .inline input{flex:1;min-width:0;font:500 15px var(--body);padding:8px 10px;border:1px solid var(--hair);border-radius:8px}
  .loading{padding:40px 0;text-align:center;color:var(--faint);font-size:14px}
  /* your leagues somewhere else (21 Oct 2026) */
  .bcard p.tip{padding:10px 12px;background:var(--accent-soft);border-radius:10px;color:var(--ink);font-size:14.5px}
  .set .grp p.fine{font-size:12.5px;color:var(--faint)}
  .bcard p.also{margin-top:14px;text-align:center}
  .lnk{font:600 14.5px var(--body);color:var(--accent);background:none;border:0;padding:6px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .plist button.ok{color:var(--accent)}
  .field select{width:100%;font:500 16px var(--body);padding:10px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--paper);color:var(--ink)}
  .bnote{margin-top:6px;font-size:14.5px;color:var(--muted)}
  .bnote.how{margin-top:14px;font-size:13px;color:var(--faint)}
  .set .grp p.fine,.grp p.fine{font-size:12.5px;color:var(--faint);margin-top:6px}
  /* records and honours (25 Oct 2026) */
  .nk{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
  .row.rec{grid-template-columns:34px 1fr auto}
  .row.rec .rk{font-size:20px}
  .row .who .st b{font-weight:700;color:var(--muted)}
  .hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .hgrid div{padding:12px;border:1px solid var(--hair);border-radius:10px;background:var(--paper);min-width:0}
  .hgrid b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
  .hgrid span{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
  .back{margin-top:14px}
  [hidden]{display:none!important}
</style>

      '<button class="btn warn" data-act="leave">Leave league</button></div></div>' + keyGroup();
    var others = (d.players || []).filter(function (p) { return p !== L.nick; }), hid = hidden(L.code);
    if (!L.owner && others.length) {
      h += '<div class="grp"><h3>Players</h3><ul class="plist">' + others.map(function (p) {
             var off = hid.indexOf(p) >= 0;
             return '<li><span>' + esc(p) + (off ? ' (hidden)' : '') + '</span><span>' +
               '<button class="quiet" data-act="hide" data-nick="' + esc(p) + '" data-on="' + (off ? '0' : '1') + '">' + (off ? 'Show' : 'Hide') + '</button>' +
               '<a class="lnk" href="' + esc(reportUrl(L, p)) + '" data-report="1">Report</a></span></li>'; }).join('') + '</ul>' +
           '<p class="fine">Hide takes a player off your boards in this browser only. Report emails us; we read every report.</p></div>';
    }
    h += '<div class="grp"><h3>Something not right?</h3><p>A rude name or league name? <a class="lnk" href="' + esc(reportUrl(L, '')) + '" data-report="1">Report it to us</a>' +
         (L.owner ? ', or remove the player below.' : '.') + '</p></div>';
    if (L.owner) {
      h += '<div class="grp"><h3>League name</h3><div class="inline"><input id="rn" maxlength="30" value="' + esc(L.name) + '">' +
           '<button class="btn" data-act="rename">Save</button></div></div>' +
           '<div class="grp"><h3>Players</h3><ul class="plist">' + (d.players || []).map(function (p) {
             return '<li><span>' + esc(p) + (p === L.nick ? ' (you)' : '') + '</span>' +
               (p === L.nick ? '' : '<span><button class="ok" data-act="letback" data-nick="' + esc(p) + '">Let back in</button>' +
                 '<button data-act="remove" data-nick="' + esc(p) + '">Remove</button></span>') + '</li>'; }).join('') + '</ul>' +
             '<p class="fine">Let back in: for a day, that player can join as themselves from another phone or app without a PIN.</p></div>' +
           '<div class="grp"><h3>Join code</h3><p>A new code stops the old link and code working; everyone already in stays in.</p>' +
           '<div class="acts"><button class="btn" data-act="newcode">New join code</button></div></div>' +
           '<div class="grp"><h3>Close league</h3><p>Takes the league off everyone’s boards.</p>' +
           '<div class="acts"><button class="btn warn" data-act="close">Close league</button></div></div>';
    }
    return h + '<p class="msg" id="sm"></p><div class="acts done"><button class="btn go" data-act="setdone">Done</button></div></section>';
  }
  $app.addEventListener('change', function (e) {
    if (e.target.id === 'pick' && e.target.value) { S.date = e.target.value > NB.today() ? NB.today() : e.target.value; loadBoard(); }
  });
  $app.addEventListener('click', function (e) {
    var d = e.target.closest('[data-day]');
    if (d && !d.disabled) { S.date = addDays(S.date, +d.getAttribute('data-day')); loadBoard(); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    var L = cur(), act = a.getAttribute('data-act'), sm = document.getElementById('sm');
    function fail(err) { if (sm) { sm.className = 'msg'; sm.textContent = err.message; } }
    function done(msg) { return NB.refresh().then(function () { loadBoard(); }); }
    if (act === 'cardback') { S.card = ''; loadBoard(); return; }
    if (act === 'setdone') { S.settings = false; loadBoard(); return; }
    if (act === 'hide') {
      var hn = a.getAttribute('data-nick'), on = a.getAttribute('data-on') === '1';
      setHidden(L.code, hn, on); track('board_hide', { on: on ? 1 : 0 });
      S.data = null; loadBoard(); return;
    }
    if (act === 'share') {
      var T = NB.BY_ID[S.type], it = puzzleItem(S.type, S.date), D = S.data;
      var lines = ['🏆 ' + T.emoji + ' ' + (it ? it.headline : T.name) + ' · ' + longDay(S.date)];
      D.ranked.slice(0, 5).forEach(function (r) {
        var res = result(T.id, r);
        lines.push((MEDAL[r.rank] || r.rank + '.') + ' ' + r.nick + ' ' + res.big + (res.small ? ' (' + res.small + ')' : ''));
      });
      if (D.ranked.length > 5) lines.push('+' + (D.ranked.length - 5) + ' more');
      lines.push(L.name + ' leaderboard:');
      share(lines.join('\n'), link(L.code) + '&p=' + S.type + '&d=' + S.date, a);
      track('board_share', { type: S.type });
    } else if (act === 'shareall') {
      var D2 = S.data, ln = ['🏆 All puzzles · ' + longDay(S.date)];
      D2.day.slice(0, 5).forEach(function (r) { ln.push((MEDAL[r.rank] || r.rank + '.') + ' ' + r.nick + ' ' + pts(r.points) + ' (' + r.completed + '/' + dayCount(S.date) + ')'); });
      if (D2.day.length > 5) ln.push('+' + (D2.day.length - 5) + ' more');
      ln.push(L.name + ' leaderboard:');
      share(ln.join('\n'), link(L.code) + '&p=all&d=' + S.date, a);
      track('board_share', { type: 'all' });
    } else if (act === 'letback') {
      var w2 = a.getAttribute('data-nick');
      NB.owner('let_back', L.code, { p_nick: w2 }).then(function (ok) {
        if (sm) { sm.className = 'msg ok'; sm.textContent = ok ? w2 + ' can join from another phone or app without a PIN for the next day: ask them to open the league link and tap “Already in this league?”.' : 'Couldn’t find ' + w2 + '.'; }
        track('board_pin', { act: 'letback' });
      }, fail);
    } else if (act === 'key') {
      share(KEY_TEXT, NB.moveLink(), a);
      track('board_key', { act: 'send' });
    } else if (act === 'invite') {
      share(inviteText(L), link(L.code), a);
      track('board_invite', {});
    } else if (act === 'leave') {
      if (!confirm('Leave ' + L.name + '? You’ll come off its boards. You can rejoin with the link.')) return;
      NB.leave(L.code).then(function () { S.data = null; S.settings = false; NB.setCurrent(''); loadBoard(); }, fail);
    } else if (act === 'remove') {
      var who = a.getAttribute('data-nick');
      if (!confirm('Remove ' + who + ' from ' + L.name + '? They come off its boards. They could rejoin with the link unless you make a new join code.')) return;
      NB.owner('remove', L.code, { p_nick: who }).then(done, fail);
    } else if (act === 'close') {
      if (!confirm('Close ' + L.name + ' for everyone? It comes off all its players’ boards.')) return;
      NB.owner('close', L.code).then(function () { NB.setCurrent(''); S.data = null; S.settings = false; return done(); }, fail);
    } else if (act === 'rename') {
      NB.owner('rename', L.code, { p_name: document.getElementById('rn').value.trim() }).then(done, fail);
    } else if (act === 'newcode') {
      if (!confirm('Make a new join code? The old link and code stop working; people already in the league stay in.')) return;
      NB.owner('new_code', L.code).then(function (r) { NB.setCurrent(r.code); return done(); }, fail);
    }
  });

  /* ---------- start ---------- */
  // Opened with someone's own link: dn-track.js unpacks it and reloads this page, so don't start yet.
  if (location.hash.indexOf('#dnmove=') === 0) return;
  var arrived = NB.moved(); if (arrived) { S.moved = arrived; track('board_key', { act: 'open' }); }
  track('board_open', { from: S.from });
  var feed = fetch('feed.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
    .then(function (j) { S.feed = j.items || []; }, function () { S.feed = []; });
  var mine = NB.refresh().catch(function () { return NB.leagues(); });
  Promise.all([feed, mine]).then(function () {
    var pend = NB.pending(); if (pend) return pendForm(pend);
    if (S.join) {
      var have = NB.leagues().filter(function (l) { return l.code === S.join; })[0];
      if (have) { NB.setCurrent(have.code); S.join = ''; return loadBoard(); }
      return NB.peek(S.join).then(joinForm, function () {
        S.join = '';
        $app.innerHTML = '<div class="bcard"><h2>That link has expired</h2><p>The league may have closed or changed its code. ' +
          'Ask for a new link.</p></div>';
      });
    }
    NB.inAny() ? loadBoard() : intro();
  });

  /* Boards keep themselves fresh (7 Nov 2026, as the app; no pull-to-refresh): again when the page comes back into
     view, and every minute while it is showing. Only a board is redrawn: never a form, a player card, League
     settings (it has a text box) or the league menu while open. */
  function quietRefresh() {
    if (document.hidden || $pager.hidden || S.card || S.settings || S.filling || !cur()) return;
    var m = document.getElementById('lgmenu'); if (m && !m.hidden) return;
    if (document.activeElement && $app.contains(document.activeElement) && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    S.rec = null; loadBoard();
  }
  setInterval(quietRefresh, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) quietRefresh(); });

  // Notifications are switched off; ?push=test loads the hidden test panel (dn-push.js).
  if (/[?&]push=test\b/.test(location.search)) {
    var ps = document.createElement('script'); ps.src = 'dn-push.js'; ps.defer = true; document.body.appendChild(ps);
  }
})();
</script>
<script src="dn-nav.js" defer></script>
<script src="dn-track.js" defer></script>
</body>
</html>
