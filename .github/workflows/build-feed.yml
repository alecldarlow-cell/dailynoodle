name: Build feed

on:
  # Every push to main: since Pages publishes what this workflow deploys
  # (Settings → Pages → Source: GitHub Actions), any change to the site has
  # to come through here.
  push:
    branches: [main]
  schedule:
    # Nightly, so forward-dated pieces publish on their own day without a push.
    # History: a single '0 2 * * *' slot was routinely queued by GitHub until
    # 06:45-08:15 UTC (07:45-09:15 London). Top-of-the-hour slots are the most
    # congested, so we use odd minutes and several slots straddling London
    # midnight (00:00 UTC in GMT, 23:00 UTC in BST). build-feed.js computes
    # "today" in Europe/London at run time and this job only commits when
    # feed.json changes, so a slot that fires before London midnight is a
    # harmless no-op and the next one publishes. Later slots are backstops.
    # 19 Oct 2026: over the previous fortnight every slot fired 2-3 h late,
    # and the first run of the night landed between 02:01 and 04:33 London.
    # The three extra slots below are more independent chances of an early
    # run, aiming for today's puzzles reliably live by 4-5 am London.
    - cron: '13 23 * * *'   # BST 00:13 | GMT 23:13 (no-op)
    - cron: '31 23 * * *'   # BST 00:31 | GMT 23:31 (no-op)
    - cron: '49 23 * * *'   # BST 00:49 | GMT 23:49 (no-op)
    - cron: '13 0 * * *'    # BST 01:13 | GMT 00:13
    - cron: '43 0 * * *'    # BST 01:43 | GMT 00:43
    - cron: '29 1 * * *'    # BST 02:29 | GMT 01:29
    - cron: '27 2 * * *'    # backstop
    - cron: '41 4 * * *'    # backstop
  workflow_dispatch:

permissions:
  contents: write   # commit feed.json and patched pieces
  pages: write      # deploy the site
  id-token: write   # required by deploy-pages

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Commit identity for generated content
        run: |
          git config user.name "dailynoodle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare, test and commit the exact release
        run: node tools/release.js
      - name: Failures as annotations
        if: failure()
        run: node tools/tests/ci-annotate.js Release test-results/*/playwright.json test-results/*.log
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy tested artifact to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Read-only live health check
        run: npm run test:live
