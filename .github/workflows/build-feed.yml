name: Build feed

on:
  # Every push to main: since Pages publishes what this workflow deploys
  # (Settings → Pages → Source: GitHub Actions), any change to the site has
  # to come through here.
  push:
    branches: [main]
  schedule:
    # Nightly, so forward-dated pieces publish on their own day without a push.
    # History: a single '0 2 * * *' slot was routinely queued by GitHub until
    # 06:45-08:15 UTC (07:45-09:15 London). Top-of-the-hour slots are the most
    # congested, so we use odd minutes and several slots straddling London
    # midnight (00:00 UTC in GMT, 23:00 UTC in BST). build-feed.js computes
    # "today" in Europe/London at run time and this job only commits when
    # feed.json changes, so a slot that fires before London midnight is a
    # harmless no-op and the next one publishes. Later slots are backstops.
    - cron: '13 23 * * *'   # BST 00:13 | GMT 23:13 (no-op)
    - cron: '13 0 * * *'    # BST 01:13 | GMT 00:13
    - cron: '43 0 * * *'    # BST 01:43 | GMT 00:43
    - cron: '27 2 * * *'    # backstop
    - cron: '41 4 * * *'    # backstop
  workflow_dispatch:

permissions:
  contents: write   # commit feed.json and patched pieces
  pages: write      # deploy the site
  id-token: write   # required by deploy-pages

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so a push retry can rebase cleanly

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add reader-activity script to new pieces
        run: node tools/inject-tracker.js

      # New puzzles uploaded from an older template still get the one-line
      # emoji share text. A file it can't patch is reported, not fatal.
      - name: One-line share text on new puzzles
        run: node tools/share-v2.js || echo "::warning::share-v2 refused some files (see log)"

      # Puzzles whose player matches a shared engine become thin pages that
      # load engines/<type>.js. Anything else is left self-contained.
      - name: Move new puzzles onto the shared engines
        run: for t in mini doku sweep link path tangle borders; do node tools/engine-shells.js $t || echo "::warning::engine-shells $t failed (see log)"; done

      # Link-preview (Open Graph) tags from each file's dn:* metas, so a
      # pasted link shows a card. Rewrites a file only when its tags change.
      - name: Link-preview tags
        run: node tools/og-tags.js

      # Share button (share sheet / copy, WhatsApp-ready text) on every news
      # piece. Rewrites a file only when its block changes.
      - name: Share button on news pieces
        run: node tools/news-share.js

      # A way back to the site from every news piece: a "← News" link above
      # the masthead and the masthead itself linking to News. Idempotent.
      - name: Back-to-News link on news pieces
        run: node tools/news-nav.js

      # Dark mode on every news piece (follows the phone, like the front
      # pages and puzzles): one marked block in <head>, idempotent.
      - name: News dark mode
        run: node tools/news-dark.js

      - name: Build feed.json
        run: node tools/build-feed.js

      - name: Commit if changed
        run: |
          git config user.name  "dailynoodle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json puzzles-today.json reports
          if git diff --staged --quiet; then
            echo "nothing changed — nothing to commit"
            exit 0
          fi
          git commit -m "chore: rebuild feed.json, add tracker to new pieces [skip ci]"
          # A scheduled task may have pushed while this ran: rebase onto it
          # and retry rather than failing and losing tonight's feed.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing onto origin/main"
            sleep $((i * 5))
            git pull --rebase origin main
          done
          echo "::error::could not push after 3 attempts"; exit 1

      # Publish only what's released: forward-dated files (the same ones the
      # feed holds back) and the non-site folders stay out of the deployed
      # site. build-site.js fails rather than publish a held file.
      - name: Assemble the site
        run: |
          DN_HELD_OUT="$RUNNER_TEMP/held.txt" node tools/build-feed.js
          node tools/build-site.js "$RUNNER_TEMP/held.txt" _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Runs after the feed is committed, so a batch missing the player-save
      # patch fails this run (and alerts) without holding back publishing.
      # Fix: node tools/add-done-state.js, then push.
      - name: Check puzzle saves (reopen finished, Share result)
        run: node tools/add-done-state.js --check
