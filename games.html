  One of three section pages (index.html, puzzles.html, games.html). Layout,

<body>
<div class="wrap">

  <header class="mast">
    <div class="mono" aria-hidden="true">DG</div>
    <div class="word">Noodle<b>Games</b></div>
    <div class="kick">The games room<span class="k2">Quick to learn · built to replay</span></div>

  <nav class="controls" aria-label="Sections and filters">
