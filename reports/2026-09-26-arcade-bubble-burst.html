<style>
:root{
  --ink:#1E2340; --ink-2:#474E72; --glass:rgba(255,255,255,.66); --glass-hi:rgba(255,255,255,.88);
  --edge:rgba(255,255,255,.92); --lift:0 6px 18px rgba(38,48,110,.14); --rose-a:#FFB0C8; --rose-b:#FF8AAE;
  --warn:#A8204A; --focus:#4B34B8; --sky-a:#BFE9D6; --sky-b:#FFF6E0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;overscroll-behavior:none;background:linear-gradient(180deg,var(--sky-a),var(--sky-b)) fixed;transition:background .6s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;height:100vh;height:100dvh;overflow:hidden;--gut:max(12px,calc(50% - 268px))}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.chip,.back,.iconbtn,.press,.toast,.tip,.card{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);
  border:1px solid var(--edge);box-shadow:var(--lift)}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) var(--gut) 0;z-index:6;pointer-events:none}
.top>*{pointer-events:auto}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 11px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:800;font-size:14px;white-space:nowrap}
.back svg{width:16px;height:16px}
.sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn .off{display:none}
.iconbtn[aria-pressed="false"] .on{display:none}
.iconbtn[aria-pressed="false"] .off{display:block}
.hud{position:absolute;top:calc(62px + env(safe-area-inset-top));left:var(--gut);right:var(--gut);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:3;pointer-events:none}
.chip{border-radius:16px;padding:5px 8px 6px;text-align:center;min-width:0}
.lab{font-size:10px;line-height:1.3;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-family:'Fredoka',system-ui,sans-serif;font-size:18px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.press{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;pointer-events:none;
  display:flex;align-items:baseline;gap:8px;padding:5px 14px 6px;border-radius:999px;white-space:nowrap}
.press .lab{font-size:10.5px}
.press .val{font-size:17px}
.press.warn .val,.press.warn .lab{color:var(--warn)}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,6px);color:var(--ink);z-index:4;padding:8px 16px;border-radius:999px;font-weight:800;font-size:14.5px;
  pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tip{position:absolute;left:50%;top:50%;transform:translateX(-50%);width:min(88%,330px);color:var(--ink);border-radius:18px;padding:10px 14px;z-index:4;
  font-size:14px;line-height:1.4;font-weight:700;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;text-wrap:balance}
.tip.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 16px 16px;z-index:5;
  background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.overlay[hidden]{display:none}
.card{background:var(--glass-hi);border-radius:28px;padding:22px 18px 18px;width:100%;max-width:350px;max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 18px 50px rgba(38,48,110,.2)}
.card h2{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1.1;margin:2px 0 8px;text-wrap:balance;letter-spacing:-.01em}
.card h2.title{font-size:42px;margin:6px 0 8px}
.card h3{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;font-size:16px;margin:16px 2px 8px;text-align:left}
.card p{margin:6px 0;line-height:1.45}
.sub{color:var(--ink-2);font-weight:700;font-size:14.5px;text-wrap:balance}
.small{font-size:13px;color:var(--ink-2);font-weight:700}
.btn{display:block;width:100%;font:800 16px 'Nunito',system-ui,sans-serif;padding:13px 10px;border-radius:16px;border:1px solid var(--edge);
  background:rgba(255,255,255,.72);color:var(--ink);margin-top:10px;cursor:pointer;box-shadow:0 3px 10px rgba(38,48,110,.1)}
.btn.primary{background:linear-gradient(180deg,var(--rose-a),var(--rose-b));border-color:rgba(255,255,255,.7);font-size:18px;padding:15px 10px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 8px 20px rgba(255,110,160,.35)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid rgba(30,35,64,.16)}
.btn:active,.lv:active,.iconbtn:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
html.touch :focus-visible{outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo{display:flex;justify-content:center;gap:5px;margin:2px 0 4px}
.logo i{width:24px;height:24px;border-radius:50%;display:block;background:
  radial-gradient(circle at 33% 28%,rgba(255,255,255,.95) 0 13%,rgba(255,255,255,0) 15%),
  radial-gradient(circle at 42% 40%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c);
  box-shadow:inset -2px -4px 6px rgba(30,35,64,.14),inset 0 0 0 1.5px rgba(255,255,255,.55),0 4px 8px rgba(38,48,110,.15)}
.logo i:nth-child(even){transform:translateY(5px)}
.stars{font-size:40px;letter-spacing:8px;margin:6px 0 0;line-height:1}
.stars .on{color:#E8A300;text-shadow:0 2px 0 #B97F00}
.stars .off{color:rgba(30,35,64,.18)}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lv{aspect-ratio:1/1;border:1px solid var(--edge);border-radius:18px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:600 19px 'Fredoka',system-ui,sans-serif;padding:0;background:linear-gradient(160deg,#FFFFFF,var(--t) 75%);box-shadow:0 3px 10px rgba(38,48,110,.1);min-height:48px;border-radius:15px}
.lv small{font:800 10px 'Nunito',system-ui,sans-serif;letter-spacing:0;margin-top:3px;color:#9A6B00}
.lv:disabled{background:rgba(255,255,255,.4) !important;color:#5E6480;cursor:default;box-shadow:none}
.lv:disabled small{color:#5E6480;letter-spacing:.02em;text-transform:uppercase;font-size:8.5px}
.lv.cur{box-shadow:0 0 0 3px var(--ink),0 3px 10px rgba(38,48,110,.1)}
.wname{display:flex;justify-content:space-between;align-items:baseline}
.wname span{font:800 12px 'Nunito',system-ui,sans-serif;color:var(--ink-2)}
.keys{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-top:12px}
@media (hover:none) and (pointer:coarse){.keys{display:none}}

.lab .ic,.press .ic{width:11px;height:11px;vertical-align:-1px;margin-right:3px}
.sbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:9px 2px 0}
.sbar[hidden]{display:none}
.trk{position:relative;flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.62);border:1px solid var(--edge);box-shadow:var(--lift)}
.trk .fill,.trk .pend{position:absolute;top:1px;bottom:1px;left:1px;border-radius:99px;transition:width .35s,left .35s}
.trk .fill{background:linear-gradient(90deg,#FFC85A,#F49B3F);width:0}
.trk .pend{background:repeating-linear-gradient(135deg,rgba(244,155,63,.45) 0 4px,rgba(244,155,63,.18) 4px 8px);width:0}
.trk .mk{position:absolute;top:50%;transform:translate(-50%,-50%);font:800 10.5px/1 'Nunito',system-ui,sans-serif;letter-spacing:-.5px;color:rgba(30,35,64,.42);
  background:rgba(255,255,255,.95);border:1px solid var(--edge);border-radius:99px;padding:2px 4px;white-space:nowrap;box-shadow:0 2px 6px rgba(38,48,110,.12)}
.trk .mk.near{color:#B97F00}
.trk .mk.lit{color:#fff;background:linear-gradient(180deg,#F9C23C,#E39A00);border-color:#FFE7A6}
.sbb{font:800 11px 'Nunito',system-ui,sans-serif;color:var(--ink-2);white-space:nowrap;min-width:72px;text-align:right}
@media (prefers-reduced-motion:reduce){.trk .fill,.trk .pend{transition:none}}
.kicker{font:800 11.5px 'Nunito',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 2px !important}
.rule,.newf{display:flex;gap:11px;align-items:flex-start;text-align:left;margin:11px 0 0}
.newf{background:rgba(255,236,170,.5);border:1px solid rgba(232,163,0,.35);border-radius:16px;padding:8px 10px;margin-top:9px}
.badge{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--edge);box-shadow:0 2px 8px rgba(38,48,110,.1);color:var(--ink);font-size:17px;color:#C98A00}
.badge .ic{width:19px;height:19px}
.badge.g-clear,.badge.g-rescue,.badge.g-drop{color:#2F6E8E}.badge.g-rescue{color:#C98A00}
.badge.p-line{color:#6A7090}.badge.p-ceiling{color:#2F6E8E}.badge.p-shots{color:#4B34B8}.badge.p-time{color:#B4531C}.badge.p-double{color:#8A2F7A}
.pic{flex:none;width:34px;height:34px}
.rk{margin:0 !important;font:800 10.5px 'Nunito',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rt{margin:1px 0 0 !important;font:700 16px/1.25 'Fredoka',system-ui,sans-serif}
.rd{margin:2px 0 0 !important;font-size:13px;line-height:1.38 !important;color:var(--ink-2);font-weight:700}
.tag{display:inline-block;font:800 10px/1 'Nunito',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:#A15F00;color:#fff;border-radius:99px;padding:3px 6px;vertical-align:2px}
.marks{display:flex;flex-wrap:wrap;gap:5px 12px;margin:3px 0 0;font:700 14px 'Fredoka',system-ui,sans-serif}
.card>.marks{justify-content:center;margin:8px 0 2px}
.marks .st{color:#E39A00;letter-spacing:-1px;margin-right:2px}
.guide{color:var(--ink);font-weight:800}
.tipline{text-align:left;margin-top:10px !important}
.note{background:rgba(255,236,170,.55);border-radius:14px;padding:8px 10px;font-size:13.5px;font-weight:800;color:var(--ink)}
.big{font:600 26px 'Fredoka',system-ui,sans-serif;margin:4px 0 !important}
.brk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.brk span{background:rgba(255,255,255,.7);border:1px solid var(--edge);border-radius:12px;padding:5px 2px;font:800 10px 'Nunito',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.brk b{display:block;font:600 15px 'Fredoka',system-ui,sans-serif;letter-spacing:0;color:var(--ink);text-transform:none}
.mini{text-align:left;margin:6px 0 2px}
.mini p{margin:4px 0;font-weight:800;font-size:14px}
.mini .ic{width:16px;height:16px;vertical-align:-3px;margin-right:7px;color:#4B34B8}
.wpager{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.pg{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.75);font:700 26px/1 'Fredoka',system-ui,sans-serif;color:var(--ink);cursor:pointer;padding:0 0 3px}
.pg:disabled{opacity:.35;cursor:default}
.wt{flex:1;border-radius:16px;padding:6px 8px;background:linear-gradient(160deg,#fff,var(--t));border:1px solid var(--edge)}
.wt b{display:block;font:600 18px 'Fredoka',system-ui,sans-serif}
.wt span{font:800 12px 'Nunito',system-ui,sans-serif;color:var(--ink-2)}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(30,35,64,.18)}
.dots i.on{background:var(--ink)}
.wblurb{margin:4px 0 10px !important}
.lv{position:relative;padding-top:2px !important}
.lv .num{line-height:1}
.lv small .on,.smini .on{color:#E39A00}.lv small .off,.smini .off{color:rgba(30,35,64,.2)}.lv small b,.smini b{font-weight:inherit}
.lv .ics{display:flex;gap:2px;height:12px;margin:0 0 2px;color:#4B34B8}
.lv .ics .ic{width:12px;height:12px}
.lv:disabled .ics{opacity:.5}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:12px;font-weight:800;color:var(--ink-2);margin:10px 0 0}
.legend .ic{width:13px;height:13px;vertical-align:-2px;margin-right:3px;color:#4B34B8}
@media (max-width:370px){.back{padding:0 12px 0 9px;font-size:13px}.val{font-size:16.5px}}
@media (orientation:landscape) and (max-height:520px){
  #app{--gut:12px}
  .hud{right:auto;width:150px;grid-template-columns:1fr}
  .press{left:12px;transform:none}
  .sbar{display:none}
  .overlay{padding-top:16px}
}
