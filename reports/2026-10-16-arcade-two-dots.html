<style>
:root{--gold:#FFD046;--amber:#FFB13B;--ice:#7FE5E8;--label:#e8d4c8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07070f;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#root{position:fixed;inset:0;touch-action:none;background:#07070f}
#game{position:absolute;overflow:hidden}
#game canvas{position:absolute;left:0;top:0;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.orb{font-family:Orbitron,Inter,sans-serif;font-weight:700;line-height:normal;white-space:nowrap}
.hide{display:none!important}
/* transition card */
#xfer{display:flex;flex-direction:column;align-items:center;justify-content:center}
#xName{color:#fff;text-align:center;display:flex;justify-content:center;width:100%}
#xStats{display:flex;flex-direction:column;align-items:center}
.xRow{display:flex;flex-direction:row;align-items:baseline}
.xL{font-weight:600;color:rgba(232,212,200,.7);text-align:right}
.xV{font-weight:700;color:var(--label);text-align:left}
/* HUD */
#score{position:absolute;left:0;right:0;display:flex;justify-content:center;padding-bottom:8px}
#scoreT{font-size:42px;letter-spacing:4px;text-align:center}
#pdots{position:absolute;left:0;right:0;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:7px}
#pdots i{width:8px;height:8px;border-radius:4px;background:var(--gold)}
#mile{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
#mileT{color:var(--gold);font-size:14px;letter-spacing:2px}
#mileN{color:var(--gold);font-size:28px;letter-spacing:4px;margin-top:8px}
#pbtn{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:none;border:0;cursor:pointer}
#pbtn span{display:flex;gap:5px;align-items:center}
#pbtn i{width:4px;height:18px;border-radius:2px;background:rgba(255,255,255,.75)}
/* pause */
#pause{background:#07070faa}
#pTitle{color:#fff;font-size:28px;letter-spacing:8px}
#pInfo{display:flex;flex-direction:column;align-items:center;margin-top:24px;margin-bottom:8px}
#pWorld{color:var(--gold);font-size:14px;letter-spacing:3px;text-align:center}
#pDet{display:flex;flex-direction:column;align-items:center;margin-top:6px;gap:4px}
#pDet div{color:rgba(255,255,255,.5);font-size:12px;letter-spacing:1px;text-align:center;margin-top:2px}
#pSub{color:#fff;font-weight:400;letter-spacing:2px;margin-top:14px}
/* Digi controls (added for the site) */
.ui{pointer-events:auto}
#pSet{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:28px;width:min(250px,72%)}
.tg{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);font:600 12px Inter,sans-serif;letter-spacing:2px;cursor:pointer}
.tg b{font-weight:700;color:var(--gold);letter-spacing:2px}
.tg[aria-pressed="false"] b{color:rgba(255,255,255,.4)}
.back{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;color:rgba(232,212,200,.75);font:600 13px Inter,sans-serif;letter-spacing:2px;text-decoration:none}
#pBack{margin-top:10px}
#dBack{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center}
#iTop{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 6px}
#iMute{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:rgba(255,255,255,.6);cursor:pointer}
/* idle */
.iw{position:absolute;display:flex;justify-content:center;text-align:center;letter-spacing:2px}
#iIns{position:absolute;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-weight:400;letter-spacing:1px;line-height:normal}
.thumb{position:absolute;border-style:solid;border-width:2px;display:flex;align-items:center;justify-content:center}
.thumb span{font-weight:700;letter-spacing:2px;line-height:normal}
/* death */
#death{background:rgba(0,0,0,.5)}
.dl{font-weight:600;color:var(--label);letter-spacing:3px;line-height:normal}
#dScore{color:var(--gold);letter-spacing:2px;text-align:center}
</style>
</head>
<body>
<div id="root" role="application" aria-label="Two Dots game. Tap the left half to lift the amber dot and the right half to lift the blue dot. Keep both alive.">
  <div id="game">
    <canvas id="bg"></canvas>
    <div id="xfer" class="layer hide">
      <div id="xName" class="orb"><span id="xNameT"></span></div>
      <div id="xStats">
        <div class="xRow"><span class="xL">DIFFICULTY</span><span class="xV" id="xD"></span></div>
        <div class="xRow"><span class="xL">SCORE</span><span class="xV" id="xS"></span></div>
        <div class="xRow"><span class="xL">GRAVITY</span><span class="xV" id="xG"></span></div>
      </div>
    </div>
    <canvas id="fg"></canvas>

    <div id="hud" class="layer hide">
      <div id="score"><div id="scoreT" class="orb">0</div></div>
      <div id="pdots"><i></i><i></i><i></i></div>
      <div id="mile" class="hide"><div id="mileT" class="orb"></div><div id="mileN" class="orb"></div></div>
      <button id="pbtn" class="ui" aria-label="Pause"><span><i></i><i></i></span></button>
    </div>

    <div id="pause" class="ov hide">
      <div id="pTitle" class="orb">PAUSED</div>
      <div id="pInfo">
        <div id="pWorld" class="orb"></div>
        <div id="pDet"><div id="pG"></div><div id="pS"></div><div id="pD"></div></div>
      </div>
      <div id="pSub">tap to resume</div>
      <div id="pSet" class="ui">
        <button class="tg" id="tSound" aria-pressed="true">SOUND <b>ON</b></button>
        <button class="tg" id="tVib" aria-pressed="true">VIBRATION <b>ON</b></button>
        <button class="tg" id="tFS" aria-pressed="true">FULL SCREEN <b>ON</b></button>
        <button class="tg" id="tRM" aria-pressed="false">REDUCE MOTION <b>OFF</b></button>
      </div>
      <a id="pBack" class="back ui" href="../games.html">← Digi Games</a>
    </div>

    <div id="idle" class="layer">
      <div id="iTwo" class="iw orb" style="color:#FFB13B"><span>TWO</span></div>
      <div id="iDots" class="iw orb" style="color:#7FE5E8"><span>DOTS</span></div>
      <div id="iIns">keep both dots alive</div>
      <div id="thL" class="thumb" style="border-color:#FFB13B99"><span style="color:#FFB13B">TAP</span></div>
      <div id="thR" class="thumb" style="border-color:#7FE5E899"><span style="color:#7FE5E8">TAP</span></div>
      <div id="iTop">
        <a class="back ui" href="../games.html">← Digi Games</a>
        <button id="iMute" class="ui" aria-label="Sound on"></button>
      </div>
    </div>

    <div id="death" class="ov hide">
      <div id="dWorld" class="dl"></div>
      <div id="dScore" class="orb">0</div>
      <div id="dBest" class="dl"></div>
      <div id="dBack"><a class="back ui" href="../games.html">← Digi Games</a></div>
    </div>
  </div>
</div>
