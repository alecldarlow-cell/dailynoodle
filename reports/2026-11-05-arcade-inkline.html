<style>
:root{color-scheme:light;--paper:#e9f1ea;--ink:#1c2c4c;--soft:#51607c;--line:rgba(28,44,76,.22);--red:#cf3a2e;--gold:#e0a106;--hand:"Gochi Hand","Comic Sans MS","Segoe Print",cursive;--body:"Karla",system-ui,-apple-system,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:700 16px var(--body);color:var(--ink);background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{min-height:50px;padding:12px 22px;background:#fffdf6;border:2.5px solid var(--ink);border-radius:13px 16px 12px 15px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.main{background:var(--ink);color:#fffdf6;box-shadow:3px 3px 0 var(--red)}
.btn:disabled{opacity:.42;box-shadow:none}
.lnk{color:var(--ink);font-weight:700;font-size:15px;text-underline-offset:3px;padding:12px 6px;display:inline-block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(var(--st) + 22px) max(24px,var(--sr)) calc(var(--sb) + 22px) max(24px,var(--sl));overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scr[hidden],#hud[hidden],#card[hidden],#turn[hidden],#hint[hidden],#toast[hidden]{display:none}
#home{pointer-events:none}#home>*{pointer-events:auto}
#logo{font:400 clamp(60px,20vw,92px)/.95 var(--hand);margin:calc(4vh) 0 0;transform:rotate(-2deg)}
#tag{margin:0;font:400 22px/1.1 var(--hand);color:var(--soft)}
.grow{flex:1;min-height:12px}
#hb{display:grid;gap:12px;width:min(320px,100%)}
#hb .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tot{font:400 22px var(--hand)}#tot b{color:var(--gold);font-weight:400}
.top{position:fixed;top:calc(var(--st) + 8px);display:flex;gap:6px}
#hl{left:max(12px,var(--sl))}#hr{right:max(12px,var(--sr))}
.ico{width:46px;height:46px;display:grid;place-items:center;font-size:20px}
#levels,#pause{background:var(--paper)}
#levels{align-items:stretch}
#more{margin:6px 0 0;text-align:center;font:400 20px var(--hand);color:var(--soft)}
#levels h2,#pause h2{font:400 36px/1 var(--hand);margin:6px 0 0;text-align:center}
.chap{display:grid;gap:8px;width:min(420px,100%);margin:0 auto}
.chap h3{font:400 24px/1 var(--hand);margin:10px 0 0;display:flex;justify-content:space-between;align-items:baseline}
.chap h3 small{font:700 13px var(--body);color:var(--soft)}
.chap .g{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.lv{aspect-ratio:1/1.12;min-height:48px;background:#fffdf6;border:2px solid var(--ink);border-radius:9px 11px 8px 10px;font:700 16px var(--body);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lv i{font-style:normal;font-size:10px;letter-spacing:0;color:var(--gold);line-height:1;min-height:10px}
.lv:disabled{opacity:.34;background:none}.lv.next{background:var(--ink);color:#fffdf6}
#hud{position:fixed;left:0;right:0;top:0;height:calc(var(--st) + 58px);padding:calc(var(--st) + 6px) max(10px,var(--sr)) 0 max(10px,var(--sl));display:flex;align-items:center;gap:4px;pointer-events:none}
#hud button{pointer-events:auto;width:46px;height:46px;font-size:20px;display:grid;place-items:center}
#ttl{flex:1;min-width:0;text-align:center;font:400 23px/1 var(--hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl small{display:block;font:700 12px/1.3 var(--body);color:var(--soft)}
#hint{position:fixed;left:max(20px,var(--sl));right:max(20px,var(--sr));top:calc(var(--st) + 66px);text-align:center;font:400 22px/1.12 var(--hand);pointer-events:none;text-wrap:balance;transition:opacity .25s}
#toast{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 20px);text-align:center;font:400 21px var(--hand);pointer-events:none}
#card.high{bottom:auto;top:calc(var(--st) + 62px)}
#card{position:fixed;left:max(14px,var(--sl));right:max(14px,var(--sr));bottom:calc(var(--sb) + 14px);max-width:420px;margin:0 auto;background:#fffdf6;border:2.5px solid var(--ink);border-radius:15px 19px 13px 17px;box-shadow:4px 4px 0 var(--ink);padding:14px 16px;display:grid;gap:9px;text-align:center;transform:rotate(-.6deg);animation:up .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes up{from{transform:translateY(40px) rotate(2deg);opacity:0}}
#card h2{font:400 31px/1 var(--hand);margin:0}
#card .st{font-size:34px;line-height:1;letter-spacing:5px;color:var(--gold);min-height:34px}
#card .st span{display:inline-block;animation:pop .4s cubic-bezier(.2,1.7,.5,1) backwards}
#card .st span.o{color:var(--line)}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
#card p{margin:0;font-size:15px;line-height:1.3;color:var(--soft)}
#card .acts{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
#card .acts.one{grid-template-columns:1fr}
#card .btn{min-height:48px;padding:8px 10px}
#pause{gap:10px}
#pause .box{display:grid;gap:4px;width:min(340px,100%)}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:50px;width:100%;padding:0 6px;border-bottom:1.5px dashed var(--line);font:700 16px var(--body);text-align:left}
.sw b{font:400 21px var(--hand);color:var(--red)}.sw b.on{color:var(--ink)}
#turn{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;text-align:center;padding:24px;font:400 28px var(--hand);z-index:9}
@media (prefers-reduced-motion:reduce){#card,#card .st span{animation:none}}
@media (max-height:520px){#logo{font-size:52px;margin-top:0}#tag{display:none}.grow{display:none}#hb{grid-template-columns:1fr 1fr;width:min(520px,100%)}.scr{gap:8px;padding-top:calc(var(--st) + 10px);padding-bottom:calc(var(--sb) + 10px)}#tot{order:9}}
</style>
</head>
<body>
<canvas id="c" aria-label="Sketchbook page. Draw one line with your finger."></canvas>
<div id="hud" hidden><button id="hPause" aria-label="Menu">☰</button><div id="ttl"></div><button id="hRetry" aria-label="Retry">↺</button></div>
<div id="hint" hidden></div><div id="toast" hidden></div>
<section class="scr" id="home">
  <h1 id="logo">Inkline</h1><p id="tag">One line. Then watch.</p>
  <div class="grow"></div>
  <div id="tot"></div>
  <div id="hb"><button class="btn main" id="play" type="button">Play</button><div class="two"><button class="btn" id="daily" type="button">Daily</button><button class="btn" id="lvBtn" type="button">Levels</button></div></div>
  <a class="lnk" href="../games.html">← Noodle Games</a>
</section>
<div class="top" id="hl" hidden></div>
<section class="scr" id="levels" hidden><h2>Sketchbook</h2><div id="chaps" style="display:grid;gap:8px"></div><p id="more">More pages are being drawn.</p><button class="btn" id="lvBack" type="button" style="align-self:center;margin-top:12px">Back</button></section>
<section class="scr" id="pause" hidden><h2>Paused</h2>
  <div class="box"><button class="sw" id="sSnd" type="button"></button><button class="sw" id="sVib" type="button"></button><button class="sw" id="sMot" type="button"></button><button class="sw" id="sRaise" type="button"></button><button class="sw" id="sFS" type="button" hidden></button><button class="sw" id="sReset" type="button"></button></div>
  <button class="btn main" id="resume" type="button">Resume</button><button class="btn" id="toLv" type="button">Levels</button>
  <a class="lnk" href="../games.html">← Noodle Games</a>
</section>
<div id="card" hidden></div>
<div id="turn" hidden>Turn your phone upright</div>
