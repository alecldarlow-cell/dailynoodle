<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ---- Digi News feed metadata — REQUIRED on every shipped puzzle ----
     The Digi News front page builds each card by reading this block out of the
     <head>. It must sit immediately after the viewport meta, and every field
     must be filled before upload — no placeholders ship.
       dn:headline   puzzle name + number, e.g. "Mini 0005", "Doku 0003"
                     (articles use their <h1> verbatim; puzzle pages have no
                     <h1> — the masthead is the wordmark — so the name+number
                     is the house rule for /puzzles)
       dn:standfirst one or two sentences, plain text, no tags
       dn:topic      Crossword (the Mini) | Logic (the Doku)
       dn:date       YYYY-MM-DD — must match the filename date and any footer date
       dn:kind       always "puzzle" for files in /puzzles
       dn:read       "~3 min"
     Filename: YYYY-MM-DD-topic-slug.html — see the pre-publish checklist. -->
<meta name="dn:headline"   content="Mini 0019">
<meta name="dn:standfirst" content="Penne, fusilli and the rest, crossing every map bound together. Medium, and one answer is a dark blue.">
<meta name="dn:topic"      content="Crossword">
<meta name="dn:date"       content="2026-07-30">
<meta name="dn:kind"       content="puzzle">
<meta name="dn:read"       content="~3 min">
<meta name="theme-color" content="#2E5BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digi Mini">
<link rel="manifest" href='data:application/manifest+json,{"name":"Digi Puzzles — The Digi Mini","short_name":"Digi Mini","display":"standalone","orientation":"portrait","background_color":"%23EDEEF2","theme_color":"%232E5BFF","start_url":"."}'>
<title>Digi Puzzles — The Digi Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engines/mini.css"></head><body><div class="app">
<header>
  <div class="masthead">
    <span class="mono-mark" aria-hidden="true">DP</span>
    <span class="mh-text">
      <span class="mh-name"><b>Digi</b><span class="accent">Puzzles</span></span>
      <span class="mh-eyebrow">The Digi Mini</span>
    </span>
  </div>
  <div class="streakbox">streak <b id="streak">0</b> · best <b id="best">0</b></div>
</header>
<div class="meta"><span id="pid">DP·MINI·0019</span><span>·</span><span class="tag" id="pband">medium</span><span id="timer">00:00</span></div>
<main>
  <div class="gridwrap"><div id="grid" class="grid"></div></div>
  <div class="cluebox">
    <button id="prevClue" class="cluearrow" aria-label="Previous clue" title="Previous clue (Shift-Tab)">‹</button>
    <div id="cluebar" class="cluebar" role="button" tabindex="0" aria-label="Active clue — tap to switch across/down"></div>
    <button id="nextClue" class="cluearrow" aria-label="Next clue" title="Next clue (Tab)">›</button>
  </div>
  <button id="toggleClues" class="alltoggle" aria-expanded="false">Show all clues ▾</button>
  <div class="clues" id="cluesWrap" hidden>
    <section><h3>Across</h3><div id="across"></div></section>
    <section><h3>Down</h3><div id="down"></div></section>
  </div>
  <input id="hidden" class="hiddeninput" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-hidden="true" tabindex="-1">
</main>
<div id="msg" class="msg"></div>
<div class="controls">
  <button id="checkWord">Check word</button>
  <button id="checkAll">Check all</button>
  <button id="revealWord">Reveal word</button>
  <button id="revealAll">Reveal all</button>
  <button id="reset">Reset</button>
  <button id="toggleKb">On-screen keys</button>
  <button id="fs" title="Fullscreen" aria-label="Toggle fullscreen">⤢</button>
</div>
<div id="kb" class="kb"></div>
<footer>THE DIGI MINI · SHELL v4 · generated & validated in-browser · code, not eye</footer>
<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
<div id="winModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modalcard">
    <div class="check" aria-hidden="true">✓</div>
    <h2 id="winTitle">Solved!</h2>
    <div class="sub" id="winSub">The Digi Mini</div>
    <div class="statrow">
      <div class="stat"><b id="winTime">00:00</b><span>time</span></div>
      <div class="stat"><b id="winStreak">0</b><span>streak</span></div>
      <div class="stat"><b id="winBest">0</b><span>best</span></div>
    </div>
    <div class="modalbtns">
      <button id="winShare">Share result</button>
    </div>
  </div>
</div>
<script>
/* This puzzle's data. The player is ../engines/mini.js, shared by every mini. */
window.DN_PUZZLE={
  type:"mini",
  id:"DP·MINI·0019", band:"medium",
  grid:[["P","#","A","N","D"],["A","L","T","A","R"],["S","O","L","V","E"],["T","R","A","Y","S"],["A","D","S","#","S"]],
  clues:{ // keyed by answer (unique within a puzzle)
    and:"Joins two things together",
    altar:"The front of a church",
    solve:"Crack it",
    trays:"You carry lunch on them",
    ads:"The bits you skip",
    pasta:"Penne, fusilli, the rest",
    lord:"Sits in the upper house",
    atlas:"Every map, bound together",
    navy:"The sea's service, or a dark blue",
    dress:"Get clothed, or the thing you wear"
  }
};
</script>
<script src="../engines/mini.js"></script></div><script src="../dn-track.js" defer></script>
</body></html>
