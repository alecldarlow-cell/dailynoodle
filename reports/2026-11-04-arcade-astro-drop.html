<script>
'use strict';
/* ---------- noise ---------- */
function mkRand(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function h3(x,y,z){let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177);n=Math.imul(n^n>>>13,1274126177);return((n^n>>>16)>>>0)/4294967296}
const sm=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t,cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function vn(x,y,z){const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z),u=sm(x-i),v=sm(y-j),w=sm(z-k);
 return mix(mix(mix(h3(i,j,k),h3(i+1,j,k),u),mix(h3(i,j+1,k),h3(i+1,j+1,k),u),v),mix(mix(h3(i,j,k+1),h3(i+1,j,k+1),u),mix(h3(i,j+1,k+1),h3(i+1,j+1,k+1),u),v),w)}
function fbm(x,y,z,o=5){let a=.5,s=0,t=0;for(let i=0;i<o;i++){s+=a*vn(x,y,z);t+=a;a*=.5;x=x*2.03+11;y=y*2.03+7;z=z*2.03+3}return s/t}
const mc=(a,b,t)=>[mix(a[0],b[0],t),mix(a[1],b[1],t),mix(a[2],b[2],t)];
const ramp=(st,t)=>{t=cl(t);for(let i=1;i<st.length;i++)if(t<=st[i][0]){const a=st[i-1],b=st[i];return mc(a[1],b[1],(t-a[0])/(b[0]-a[0]||1))}return st[st.length-1][1]};
function craters(seed,n,lo,hi){const r=mkRand(seed),a=[];for(let i=0;i<n;i++){const z=r()*2-1,t=r()*6.283,q=Math.sqrt(1-z*z);a.push([q*Math.cos(t),q*Math.sin(t),z,lo+(hi-lo)*r()*r()])}return a}
function crater(p,cs){let d=0;for(const c of cs){const dot=p[0]*c[0]+p[1]*c[1]+p[2]*c[2];if(dot<.4)continue;const a=Math.acos(cl(dot,-1,1))/c[3];if(a<1)d-=.3*(1-a*a*.55);else if(a<1.3)d+=.2*(1.3-a)/.3}return d}

/* ---------- the ladder ---------- */
const moonC=craters(4,26,.09,.34),mercC=craters(9,44,.06,.26),astC=craters(15,10,.15,.42);
const T=[
{n:'Space dust',kind:'dust'},
{n:'Space junk',kind:'junk'},
{n:'Asteroid',lumpy:.2,col(p){const b=fbm(p[0]*3,p[1]*3+4,p[2]*3)+crater(p,astC)*.6;return ramp([[0,[58,48,46]],[.45,[126,104,90]],[1,[196,172,148]]],b)}},
{n:'Moon',col(p){const m=fbm(p[0]*1.6+3,p[1]*1.6,p[2]*1.6,4),b=.62+crater(p,moonC)*.75+(fbm(p[0]*7,p[1]*7,p[2]*7,3)-.5)*.2-(m>.52?.2:0);return ramp([[0,[112,122,150]],[.5,[198,206,226]],[1,[255,255,255]]],b+.08)}},
{n:'Mercury',atmo:[255,150,70],col(p){const b=.52+crater(p,mercC)*.8+(fbm(p[0]*5,p[1]*5,p[2]*5,4)-.5)*.5;return ramp([[0,[46,24,26]],[.45,[138,76,48]],[.75,[214,134,66]],[1,[255,206,116]]],b)}},
{n:'Mars',col(p){const b=fbm(p[0]*2.4,p[1]*2.4+9,p[2]*2.4,5),f=fbm(p[0]*8,p[1]*8,p[2]*8,3);let c=ramp([[0,[96,38,30]],[.42,[176,74,44]],[.62,[226,124,70]],[1,[250,182,122]]],b+(f-.5)*.25);const cap=sm(cl((Math.abs(p[1])-.8+(f-.5)*.2)/.06));return mc(c,[250,246,240],cap)}},
{n:'Earth',atmo:[120,190,255],col(p){const l=fbm(p[0]*1.9+5,p[1]*1.9,p[2]*1.9+2,6),lat=Math.abs(p[1]);let c=l<.5?mc([14,54,140],[34,130,206],sm(cl(l/.5))):ramp([[.5,[206,190,130]],[.54,[72,140,66]],[.64,[42,104,58]],[.72,[136,116,84]],[1,[210,200,190]]],l);
 c=mc(c,[244,250,255],sm(cl((lat-.8+(l-.5)*.5)/.08)));const cl1=fbm(p[0]*3+20,p[1]*5,p[2]*3,5);return mc(c,[255,255,255],sm(cl((cl1-.53)/.13))*.92)}},
{n:'Neptune',atmo:[130,180,255],spinFixed:true,col(p){const w=fbm(p[0]*1.5,p[1]*2,p[2]*1.5,3),y=p[1]*7+w*2.4,b=.5+.5*Math.sin(y),s=fbm(p[0]*2.5,p[1]*22,p[2]*2.5,3);let c=ramp([[0,[28,62,178]],[.55,[46,104,226]],[1,[104,170,252]]],b*.65+s*.35);return mc(c,[230,244,255],sm(cl((s-.67)/.08))*.8)}},
{n:'Saturn',spinFixed:true,ring:true,col(p){const w=fbm(p[0]*2,p[1]*2,p[2]*2,3),y=p[1]+(w-.5)*.04,b=fbm(3,y*15,5,4);return ramp([[0,[176,132,80]],[.4,[220,182,122]],[.6,[240,214,160]],[1,[252,240,206]]],b)}},
{n:'Jupiter',spinFixed:true,col(p){const w=fbm(p[0]*3,p[1]*4,p[2]*3,5),y=p[1]+(w-.5)*.17,b=.5+.5*Math.sin(y*12.5+1)+(fbm(1,y*30,2,3)-.5)*.5;let c=ramp([[0,[148,74,40]],[.3,[198,120,72]],[.55,[232,190,144]],[.8,[248,232,204]],[1,[255,246,230]]],b);
 const dx=(p[0]-.34)/.3,dy=(p[1]-.36)/.15,d=dx*dx+dy*dy;if(p[2]>0&&d<1){c=mc(c,[206,70,44],sm(1-d)*.95)}return c}},
{n:'Sun',emit:true,col(p,mu){const b=fbm(p[0]*4,p[1]*4,p[2]*4,5),f=fbm(p[0]*13,p[1]*13,p[2]*13,3);let c=ramp([[0,[232,88,16]],[.45,[255,158,32]],[.7,[255,216,84]],[1,[255,250,206]]],b*.8+f*.3);const limb=.62+.38*Math.pow(mu,.5);return[c[0]*limb,c[1]*limb,c[2]*limb*.92]}}
];
const L=[-.52,-.6,.61];
function spriteSurface(t,R){ /* R px; returns canvas of size 2R+4 */
 const S=2*R+4,cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d'),m=S/2;
 if(t.kind==='dust'){const r=mkRand(7);const gl=g.createRadialGradient(m,m,0,m,m,R);gl.addColorStop(0,'rgba(190,160,255,.8)');gl.addColorStop(.6,'rgba(120,120,255,.3)');gl.addColorStop(1,'rgba(120,120,255,0)');g.fillStyle=gl;g.fillRect(0,0,S,S);
