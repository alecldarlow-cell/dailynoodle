<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ---- Digi News feed metadata — REQUIRED on every shipped puzzle ----
     The Digi News front page builds each card by reading this block out of the
     <head>. It must sit immediately after the viewport meta, and every field
     must be filled before upload — no placeholders ship.
       dn:headline   puzzle name + number, e.g. "Mini 0005", "Doku 0003"
                     (articles use their <h1> verbatim; puzzle pages have no
                     <h1> — the masthead is the wordmark — so the name+number
                     is the house rule for /puzzles)
       dn:standfirst one or two sentences, plain text, no tags
       dn:topic      Crossword (the Mini) | Logic (the Doku)
       dn:date       YYYY-MM-DD — must match the filename date and any footer date
       dn:kind       always "puzzle" for files in /puzzles
       dn:read       "~3 min"
     Filename: YYYY-MM-DD-topic-slug.html — see the pre-publish checklist. -->
<meta name="dn:headline"   content="Doku 0486">
<meta name="dn:standfirst" content="18 letters in the bank, 3 already set. Place each tile so every across and down run is a real word — one solution, no guessing.">
<meta name="dn:topic"      content="Logic">
<meta name="dn:date"       content="2027-11-11">
<meta name="dn:kind"       content="puzzle">
<meta name="dn:read"       content="~3 min">
<meta name="theme-color" content="#2E5BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digi Doku">
<link rel="manifest" href='data:application/manifest+json,{"name":"Digi Puzzles — The Digi Doku","short_name":"Digi Doku","display":"standalone","orientation":"portrait","background_color":"%23EDEEF2","theme_color":"%232E5BFF","start_url":"."}'>
<title>Digi Puzzles — The Digi Doku</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engines/doku.css"></head><body><div class="app">
<header>
  <div class="masthead">
    <span class="mono-mark" aria-hidden="true">DP</span>
    <span class="mh-text">
      <span class="mh-name"><b>Digi</b><span class="accent">Puzzles</span></span>
      <span class="mh-eyebrow">The Digi Doku</span>
    </span>
  </div>
  <div class="streakbox">streak <b id="streak">0</b> · best <b id="best">0</b></div>
</header>
<div class="meta"><span id="pid">DP·LEXI·0486</span><span>·</span><span class="tag" id="pband">hard</span><span id="timer">00:00</span></div>
<main>
  <div class="gridwrap"><div id="grid" class="grid"></div></div>
  <div class="bankwrap">
    <span class="banklabel">Letter bank</span>
    <div id="bank" class="bank" aria-label="Letter bank"></div>
  </div>
  <div id="gate" class="gate" hidden></div>
  <input id="hidden" class="hiddeninput" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-hidden="true" tabindex="-1">
</main>
<div id="msg" class="msg"></div>
<div class="controls">
  <button id="revealAll">Reveal all</button>
  <button id="reset">Reset</button>
  <button id="toggleHints" aria-pressed="true">Hints: on</button>
  <button id="fs" title="Fullscreen" aria-label="Toggle fullscreen">⤢</button>
</div>
<footer>THE DIGI DOKU · SHELL v4 · unique solution proved in code, not eye</footer>
<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
<div id="winModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modalcard">
    <div class="check" aria-hidden="true">✓</div>
    <h2 id="winTitle">Solved!</h2>
    <div class="sub" id="winSub">The Digi Doku</div>
    <div class="statrow">
      <div class="stat"><b id="winTime">00:00</b><span>time</span></div>
      <div class="stat"><b id="winStreak">0</b><span>streak</span></div>
      <div class="stat"><b id="winBest">0</b><span>best</span></div>
    </div>
    <div class="modalbtns">
      <button id="winShare">Share result</button>
    </div>
  </div>
</div>
<script>
/* This puzzle's data. The player is ../engines/doku.js, shared by every doku. */
window.DN_PUZZLE={

  locked: [[3,4],[2,1],[4,1]],
  bank: ["U","H","M","T","E","D","O","L","U","E","N","R","D","R","R","O","O","E"]
};
</script>
<script src="../engines/doku.js"></script></div><script src="../dn-track.js" defer></script>
</body></html>
