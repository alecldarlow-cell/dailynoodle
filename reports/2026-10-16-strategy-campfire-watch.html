    if(S.selected===c.id) cls.push("target");
    if(aimable) cls.push("aimable");
    if(!lit && !aimable) cls.push("unlit");
    if(c.ring===1) cls.push("breach");
    const hpDots=Array.from({length:c.hp}).map(()=>"<i></i>").join("");
    const nm = c.ring===1 ? "⚠ reaches camp" : CREATURES[c.key].name;
    const ph = -((Math.abs(c.angle*1000)|0)%28)/10;     // desynchronise the idle bob
    return `<div class="${cls.join(' ')}" data-id="${c.id}" style="--ux:${pos.ux};--uy:${pos.uy};--s:${sc};z-index:${6+Math.round((pos.uy+1)*5)};--zc:${z.color};--d:${ph}s" onclick="tapCreature('${c.id}')">
        <div class="body">${CREATURES[c.key].ic}</div>
        <div class="eyes"><i></i><i></i></div>
        <div class="hp">${hpDots}</div>
        <div class="nm">${nm}</div>
      </div>`;
  }).join("");

  const ring=(n)=>{
    const z=ZONES[n], lit=litFor(n,r);
    return `<div class="ring r${n} ${lit?'lit':'dark'}" style="--f:${RING_F[n].toFixed(4)};--zc:${z.color};--zsoft:${z.soft}">
        <span class="rnum" style="background:${lit?z.color:'#6b7787'}">${z.num}</span>
      </div>`;
  };

  // hand
  const hand=ranger.hand;
  const handHtml=hand.map((key,i)=>{
    const def=CARD_DEFS[key];
    const v=cardVisual(def);
    const selected = S.armedCard===i;
    const noTarget = def.kind==="attack" && !hasAnyTarget(key,r);
    const faded = S.armedCard!==null && !selected;
    const cls=["card"];
    if(selected) cls.push("armed");
    if(noTarget) cls.push("dim");
    if(faded) cls.push("faded");
    let di=-1;
    if(dealMode==="all") di=i;
    else if(dealMode && dealMode.n && i>=hand.length-dealMode.n) di=i-(hand.length-dealMode.n);
    if(di>=0) cls.push("deal");
    return `<div class="${cls.join(' ')}" style="--bar:${v.bar};--i:${Math.max(0,di)}" onclick="tapCard(${i})">
        <div class="zonebar"></div>
        <div class="chip">${v.chip}</div>
        <div class="dmg">${v.dmg}</div>
        <div class="cic">${def.ic}</div>
        <div class="cn">${def.name}</div>
        <div class="czone">${v.zlabel}</div>
      </div>`;
  }).join("");

  // role button
  let roleBtn="";
  if(ranger.role==="keeper"){
    roleBtn=`<button class="btn role" onclick="roleAction()" ${S.keeperUsed?'disabled':''}>${S.mode==='keeper'?'✕ Cancel':'🔥 Scare back'}</button>`;
  } else if(ranger.role==="forager"){
    roleBtn=`<button class="btn role" onclick="roleAction()" ${S.foragerUsed?'disabled':''}>${S.mode==='forager'?'✕ Cancel':'🪵 Burn +1'}</button>`;
  } else {
    roleBtn=`<button class="btn role" disabled>${ROLES[ranger.role].ic} ${ROLES[ranger.role].name.replace('The ','')}</button>`;
  }

  // mode-aware action bar: one row, always in thumb reach
  const undoBtn=`<button class="btn ghost undo" onclick="undoTurn()" ${S.acted?'':'disabled'} aria-label="Undo">↶</button>`;
  let controlsHtml;
  if(S.mode==="confirm" && S.armedCard!==null){
    const def=CARD_DEFS[ranger.hand[S.armedCard]];
    let eff;
    if(def.kind==="fuel") eff="+"+(def.amt+(ranger.role==="forager"?1:0))+" fuel";
    else if(def.kind==="lantern") eff="light every ring";
    else eff="draw "+def.amt;
    controlsHtml=`
      <button class="btn ghost cancel" onclick="cancelSelection()">✕</button>
      <button class="btn play" onclick="playSelected()">▶ Play ${def.name} · ${eff}</button>`;
  } else if(S.mode==="attack"){
    controlsHtml=`<button class="btn ghost" onclick="cancelSelection()" style="flex:1">✕ Cancel — pick another card</button>`;
  } else {
    controlsHtml=`${roleBtn}${undoBtn}<button class="btn endturn" onclick="endTurn()">End Watch ▸</button>`;
  }

  const boardCls = S.over ? (S.over.won ? "dawn" : "dusk") : "";

  app.innerHTML=`
    <div class="gscreen">
      <div class="topbar">
        <div class="stat fire">
          <div><div class="lab">Fire</div><div class="val">${S.fuel}<span class="unit">/${MAX_FUEL}</span></div></div>
          <div class="pips">${lightPips()}</div>
        </div>
        <div class="stat camp"><div><div class="lab">Camp</div><div class="val">${S.camp}<span class="unit">/${S.d.camp}</span></div></div></div>
        <div class="stat dawn"><div><div class="lab">Night</div><div class="val">${S.round}<span class="unit">/${S.totalRounds}</span></div></div></div>
        <button class="btn ghost icon menubtn" onclick="openHelp()" aria-label="Menu">☰</button>
      </div>

      <div class="boardzone">
        <div class="board ${boardCls}">
          <div class="sky"></div>
          <div class="stars">${STARS}</div>
          <div class="moon" style="left:${moon.x}%;top:${moon.y}%"></div>
          <div class="ground"></div>
          ${TREELINE}
          <div class="clearing"></div>
          <div class="tent">⛺</div>
          ${BRUSH}
          ${ring(3)}${ring(2)}${ring(1)}
          <div class="lightmask" style="--lr:${lr}"></div>
          <div class="firepit ${fireLow?'low':''} ${S.over&&!S.over.won?'out':''}" style="--fire-scale:${fireScale};--flick-dur:${flickDur}s"><div class="glow" style="--glow-op:${glowOp}"></div><span class="flame">🔥</span></div>
          ${creaturesHtml}
          ${creatureInfoHtml}${tickerHtml}
        </div>
      </div>

      <div class="tray">
        <div class="wholine"><span class="whoname">${escapeHtml(ranger.name)}</span><span class="whorole">${ROLES[ranger.role].ic} ${ROLES[ranger.role].name}</span></div>
        <div class="prompt" id="prompt">${defaultPrompt()}</div>
        <div class="hand">${handHtml||'<div class="nohand">No cards — end the watch to draw.</div>'}</div>
        <div class="controls">${controlsHtml}</div>
      </div>
    </div>
  `;
  return { lr, moon };
}

function confettiPieces(){
  const cols=['#e23b2e','#e09114','#15a06f','#ffab38','#7cb8d6','#ffd070','#ec6a4f','#93b76d'];
  let p=''; for(let i=0;i<44;i++){
    const l=(Math.random()*100).toFixed(1), dur=(1.9+Math.random()*2.4).toFixed(2),
          del=(Math.random()*1.4).toFixed(2), col=cols[i%cols.length],
          sz=(6+Math.random()*7).toFixed(1), rot=Math.floor(Math.random()*360);
    p+=`<i style="left:${l}%;width:${sz}px;height:${(parseFloat(sz)*1.5).toFixed(1)}px;background:${col};animation-duration:${dur}s;animation-delay:${del}s;transform:rotate(${rot}deg)"></i>`;
  }
  return p;
}
function statsHtml(){
  const s=S.stats;
  const cell=(k,em,v)=>`<div class="statcell"><div class="k">${k}</div><div class="v"><span class="em">${em}</span>${v}</div></div>`;
  return `<div class="statgrid">
      ${cell("Creatures downed","🗡",s.kills)}
      ${cell("Broke into camp","🐾",s.breaches)}
      ${cell("Closest call","🛡",Math.max(0,s.lowestCamp)+" left")}
      ${cell("Dimmest the fire got","🔥",Math.max(0,s.lowestFuel))}
    </div>`;
}
function renderOverlay(){
  if(document.getElementById("ovl")) return;
  const o=S.over;
  const div=document.createElement("div");
  div.className="overlay"; div.id="ovl";
  if(o.won){
    div.innerHTML=`
      <div class="confetti">${confettiPieces()}</div>
      <div class="heli-fly">🚁</div>
      <div class="modal win-modal" style="position:relative;z-index:52">
        <div class="big-ic">🌅</div>
        <h2 class="win">You Survived!</h2>
        <div class="win-sub">🎉 Dawn breaks — rescue incoming 🚁</div>
        <p>${o.msg}</p>
        <p style="opacity:.8;font-size:13px">All ${S.totalRounds} nights survived · ${DIFFS[S.diffKey].name}</p>
        ${statsHtml()}
        <button class="btn big" onclick="restart()">Play Again</button>
        <button class="btn ghost" style="width:100%;margin-top:9px" onclick="toSetup()">Change Setup</button>
        <div class="backrow"><a class="backlink" href="../games.html">← Digi Games</a></div>
      </div>`;
  } else {
    div.innerHTML=`
      <div class="modal">
        <div class="big-ic">🌑</div>
        <h2 class="lose">The Dark Wins</h2>
        <p>${o.msg}</p>
        <p style="opacity:.8;font-size:13px">Survived ${S.round-1<0?0:S.round-1} of ${S.totalRounds} nights · ${DIFFS[S.diffKey].name}</p>
        ${statsHtml()}
        <button class="btn big" onclick="restart()">Try Again</button>
        <button class="btn ghost" style="width:100%;margin-top:9px" onclick="toSetup()">Change Setup</button>
        <div class="backrow"><a class="backlink" href="../games.html">← Digi Games</a></div>
      </div>`;
  }
  document.body.appendChild(div);
}
function restart(){
  const ov=document.getElementById("ovl"); if(ov) ov.remove();
  newGame(S.diffKey, [S.rangers[0].name,S.rangers[1].name], [S.rangers[0].role,S.rangers[1].role]);
  rndArm('retry'); goFS();
  clearOverlayTimer(); dealMode='all'; flipSkip=true; lastLR=null; lastMoon=null;
  render();
}
function toSetup(){
  const ov=document.getElementById("ovl"); if(ov) ov.remove();
  clearOverlayTimer(); rndDrop(); S=null; render();
}

/* Pause menu: rules, settings, back link and quit. The play clock stops while it's open. */
function openHelp(){
  if(nightAnimating || fxLock || document.getElementById("helpovl")) return;
  const div=document.createElement("div");
  div.className="overlay"; div.id="helpovl";
  document.body.appendChild(div);
  menuOpen=true; clockOff();
  refreshMenu();
}
function refreshMenu(){
  const div=document.getElementById("helpovl"); if(!div) return;
  const det=div.querySelector("details"), wasOpen=det?det.open:false;
  div.innerHTML=`
    <div class="modal">
      <div class="big-ic">🏕️</div>
      <h2 style="color:var(--fire-ink);font-size:24px">Paused</h2>
      <div class="menu-actions">
        <button class="btn big" onclick="closeHelp()">Back to the Fire</button>
      </div>
      <div class="setrow">
        <button class="btn ${soundOn?'sel':''}" onclick="toggleSound()">${soundOn?'🔊 Sound: on':'🔇 Sound: off'}</button>
        <button class="btn" onclick="toggleTheme()">${theme==='day'?'☀ Daylight':'☾ Night'}</button>
      </div>
      ${setLabels()}
      <details ${wasOpen?'open':''}><summary>How to Survive</summary>
      <ul class="howto">
        <li>Each <b>attack card</b> hits only <b>its labelled ring</b> (R1 Clearing, R2 Treeline, R3 Deep Woods). ◎ = any lit ring.</li>
        <li>You can only strike creatures in <b>lit</b> rings. Fire ≥${LIGHT[1]} lights the Clearing, ≥${LIGHT[2]} the Treeline, ≥${LIGHT[3]} the Deep Woods.</li>
        <li>The fire <b>drops 1 fuel each night</b>. Feed it with 🪵 firewood or it dies — and so do you.</li>
        <li>Every night, creatures step <b>one ring inward</b>, then a new wave appears in the woods.</li>
        <li>A creature reaching camp deals damage = its remaining HP. Kill 🐻 bears early.</li>
        <li><b>Tap a card to pick it up.</b> A wood/lantern card then shows a <b>▶ Play</b> button; an attack card asks you to <b>tap a glowing creature</b>. Tap the card again to put it back.</li>
        <li>Mis-tap? <b>↶ Undo</b> rewinds everything back to the start of the current turn.</li>
      </ul></details>
      ${S&&S.log.length?`<details><summary>Night log</summary><div class="log">${S.log.map(l=>`<div class="l ${l.cls}">${escapeHtml(l.text)}</div>`).join('')}</div></details>`:''}
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="quitRun()">Quit to Setup</button>
      <div class="backrow"><a class="backlink" href="../games.html">← Digi Games</a></div>
    </div>`;
}
function closeHelp(){
  const e=document.getElementById("helpovl"); if(e) e.remove();
  menuOpen=false; clockOn(); goFS();
}
function quitRun(){                    // abandons the run: no game_end (contract §5.2)
  const e=document.getElementById("helpovl"); if(e) e.remove();
  menuOpen=false; rndDrop(); S=null; save.game=null; render();
}

/* ---------- Test hook (contract §5.5): only when the checker sets __DGTEST ---------- */
if(window.__DGTEST===true){
  window.__dg={
    end(win){                          // finish the current run through the real end path
      if(!S) startGame();
      if(S.over) return;
      nightAnimating=false;
      gameOver(!!win, win ? "Rescue arrives at first light." : "The last ember dies.");
    },
    state(){ return S; },
  };
}

/* ---------------- BOOT ---------------- */
initFx();
render();
</script>
<script src="../dn-track.js" defer></script>
</body>
</html>
