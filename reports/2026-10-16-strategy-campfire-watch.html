<style>
  :root{
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    /* zone identity — shared across themes */
    --z1:#e23b2e; --z1-soft:rgba(226,59,46,.18);
    --z2:#e09114; --z2-soft:rgba(224,145,20,.18);
    --z3:#15a06f; --z3-soft:rgba(21,160,111,.18);
    --wild:#c9a015; --wild-soft:rgba(201,160,21,.20);
    /* fire */
    --ember:#ff7a18; --ember-2:#ffab38; --ember-3:#ffd070; --ember-glow:rgba(255,140,40,.6);
    /* board (kept dark in BOTH themes so fire + rings pop) */
    --board-bg1:#2b3a4e; --board-bg2:#0f1722;
    /* cards (kept light in BOTH themes for contrast) */
    --card-bg1:#fdf5e1; --card-bg2:#ecdfc0; --ink:#241f15; --ink-soft:#6c604a;
    --wood:#9a6a2e;
  }
  body.day{
    --page-bg:linear-gradient(168deg,#fdf8ec 0%,#f2e8d2 55%,#e8ddc1 100%);
    --parch:#221e16; --parch-2:#675d46;
    --panel:#fffdf6; --panel-line:rgba(60,45,15,.22); --modal-bg:#fffdf6;
    --frost:#236f93; --moss:#4d7a2a; --blood-2:#c5341d;
    --fire-ink:#c85e0e; --grain:.025; --board-edge:rgba(0,0,0,.28);
  }
  body.night{
    --page-bg:radial-gradient(125% 95% at 50% -10%, #1e2c40 0%, #15202e 38%, #0a111b 72%, #05080d 100%);
    --parch:#f1e8d3; --parch-2:#b7ac92;
    --panel:rgba(255,255,255,.07); --panel-line:rgba(241,232,211,.18); --modal-bg:#172230;
    --frost:#7cb8d6; --moss:#93b76d; --blood-2:#ec6a4f;
    --fire-ink:#ffab38; --grain:.05; --board-edge:rgba(255,255,255,.12);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); color:var(--parch); background:var(--page-bg);
    background-attachment:fixed; min-height:100%; overflow-x:hidden; -webkit-text-size-adjust:100%;
    transition:background .3s, color .3s;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--grain);z-index:0;
    background-image:radial-gradient(rgba(120,90,40,.7) .5px, transparent .5px);background-size:3px 3px;}
  #app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 28px;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.3px;}

  /* ---------- SETUP ---------- */
  .title-wrap{text-align:center;padding:16px 0 4px;}
  .title-wrap .spark{font-size:32px;filter:drop-shadow(0 0 14px var(--ember-glow));}
  h1{font-size:40px;line-height:1;color:var(--fire-ink);
     text-shadow:0 0 22px var(--ember-glow);margin-top:6px;}
  .subtitle{font-family:var(--serif);font-style:italic;color:var(--parch-2);margin-top:8px;font-size:15px;}
  .theme-toggle{display:flex;gap:8px;justify-content:center;margin-top:14px;}
  .theme-toggle .btn{flex:0 0 auto;padding:9px 16px;font-size:14px;}
  .panel{background:var(--panel);border:1.5px solid var(--panel-line);border-radius:14px;padding:16px;margin-top:16px;
    box-shadow:0 2px 14px rgba(0,0,0,.12);}
  .panel h3{color:var(--fire-ink);font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
  .field{margin-bottom:14px;}
  .field > label{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--parch-2);margin-bottom:7px;}
  input[type=text]{width:100%;background:rgba(127,127,127,.12);border:1.5px solid var(--panel-line);
    color:var(--parch);font-family:var(--serif);font-size:17px;padding:11px 12px;border-radius:9px;}
  input[type=text]:focus{outline:none;border-color:var(--ember);}
  .seg{display:flex;gap:8px;} .seg button{flex:1;}
  .btn{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--parch);
    background:var(--panel);border:1.5px solid var(--panel-line);
    padding:12px 14px;border-radius:11px;cursor:pointer;transition:transform .08s, background .15s, border-color .15s;}
  .btn:active{transform:scale(.97);}
  .btn.sel{background:linear-gradient(180deg,var(--ember),#d8550a);border-color:var(--ember-3);color:#1c1206;
           box-shadow:0 0 16px var(--ember-glow);}
  .btn.ghost{background:transparent;}
  .btn.icon{padding:9px 13px;font-size:17px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;}
  .btn.big{width:100%;font-size:19px;font-family:var(--serif);letter-spacing:.5px;padding:16px;
    background:linear-gradient(180deg,var(--ember-2),var(--ember));border:none;color:#1c1206;font-weight:800;
    box-shadow:0 6px 22px var(--ember-glow);margin-top:18px;}
  .roles{display:grid;grid-template-columns:1fr;gap:10px;}
  .rolecard{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:11px;
    background:rgba(127,127,127,.10);border:1.5px solid var(--panel-line);}
  .rolecard .ic{font-size:27px;line-height:1;}
  .rolecard .rn{font-family:var(--serif);font-size:18px;color:var(--fire-ink);}
  .rolecard .rd{font-size:12.5px;color:var(--parch-2);line-height:1.4;margin-top:3px;}
  .rolecard .rwho{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--moss);margin-top:5px;font-weight:700;}
  .howto{font-size:13.5px;line-height:1.62;color:var(--parch-2);}
  .howto b{color:var(--parch);}
  .howto li{margin:6px 0;list-style:none;padding-left:18px;position:relative;}
  .howto li::before{content:"›";position:absolute;left:2px;color:var(--ember);font-weight:800;}
  .zkey{display:flex;gap:6px;justify-content:center;margin:2px 0 6px;flex-wrap:wrap;}
  .zchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;}
  .zchip b{font-size:13px;}

  /* ---------- GAME HUD ---------- */
  .hud{display:flex;gap:8px;margin-bottom:10px;}
  .stat{flex:1;background:var(--panel);border:1.5px solid var(--panel-line);border-radius:12px;
    padding:8px 6px 9px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .stat .lab{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--parch-2);font-weight:700;}
  .stat .val{font-family:var(--serif);font-size:30px;margin-top:2px;line-height:1;font-weight:700;}
  .stat .val .unit{font-size:13px;opacity:.78;vertical-align:top;margin-top:7px;display:inline-block;}
  .stat.fire .val{color:var(--fire-ink);}
  .stat.camp .val{color:var(--frost);}
  .stat.dawn .val{color:var(--parch);}
  .sublab{font-size:10px;color:var(--parch-2);margin-top:3px;}
  .pips{display:flex;gap:5px;justify-content:center;margin-top:5px;}
  .pip{width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--zc);color:var(--zc);background:transparent;}
  .pip.on{background:var(--zc);color:#fff;box-shadow:0 0 8px var(--zc);}
  .pip.off{opacity:.4;}

  /* ---------- BOARD ---------- */
  .board-wrap{position:relative;width:100%;max-width:344px;margin:2px auto 4px;padding:6px;}
  .board{position:relative;width:100%;padding-top:100%;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, var(--board-bg1) 0%, var(--board-bg2) 78%);
    box-shadow:inset 0 0 40px rgba(0,0,0,.55), 0 4px 20px rgba(0,0,0,.3);
    border:2px solid var(--board-edge);}
  .ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;transition:.35s;}
  .ring .rnum{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:21px;height:21px;border-radius:50%;
    color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:7;
    border:2px solid #0d1320;box-shadow:0 1px 5px rgba(0,0,0,.6);}
  .ring.r3{width:84%;height:84%;} .ring.r2{width:58%;height:58%;} .ring.r1{width:32%;height:32%;}
  .ring.lit{border:2.5px solid var(--zc);box-shadow:inset 0 0 26px var(--zsoft);}
  .ring.dark{border:2px dashed rgba(150,165,185,.32);}
  .zlegend{display:flex;gap:7px;justify-content:center;margin:0 0 8px;flex-wrap:wrap;}

  .firepit{position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(var(--fire-scale,1));transition:transform .45s ease;
    width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:36px;z-index:5;}
  .firepit .flame{animation:flick var(--flick-dur,1.7s) infinite ease-in-out;filter:drop-shadow(0 0 12px var(--ember));}
  .firepit .glow{position:absolute;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle, var(--ember-glow) 0%, transparent 66%);animation:pulse 2.6s infinite ease-in-out;z-index:-1;
    opacity:var(--glow-op,.9);transition:opacity .45s ease;}
  .firepit.low .flame{filter:drop-shadow(0 0 11px #ff3a1a) saturate(1.15);}
  @keyframes flick{0%,100%{transform:scale(1) rotate(-1deg);opacity:.96;}45%{transform:scale(1.13) rotate(2deg);opacity:1;}70%{transform:scale(.96) rotate(-1deg);opacity:.9;}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.16);}}

  .creature{position:absolute;transform:translate(-50%,-50%);z-index:6;display:flex;flex-direction:column;align-items:center;
    cursor:pointer;transition:left .5s ease, top .5s ease, opacity .5s ease, transform .12s;}
  .creature .body{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:radial-gradient(circle at 36% 30%, #41506a, #1a2230);
    border:3px solid var(--zc);box-shadow:0 3px 9px rgba(0,0,0,.55);}
  .creature .znum{position:absolute;top:-5px;left:-5px;width:18px;height:18px;border-radius:50%;background:var(--zc);
    color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #0d1320;}
  .creature.aimable .body{border-color:#fff;animation:aim 1s infinite;transform:scale(1.07);}
  .creature.target .body{box-shadow:0 0 0 3px rgba(255,255,255,.7),0 0 16px #fff;}
  @keyframes aim{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7),0 0 12px var(--ember);}50%{box-shadow:0 0 0 7px rgba(255,255,255,0),0 0 12px var(--ember);}}
  .creature.unlit .body{opacity:.34;filter:grayscale(.6);} .creature.unlit .znum{opacity:.4;}
  .creature .hp{margin-top:3px;display:flex;gap:3px;}
  .creature .hp i{width:8px;height:8px;border-radius:50%;background:#ff6a52;box-shadow:0 0 4px #c4452f;border:1px solid rgba(0,0,0,.3);}
  .creature .nm{font-size:11px;font-weight:700;color:#f3ead6;margin-top:2px;text-shadow:0 1px 3px #000,0 0 4px #000;}
  .creature.breach .nm{color:#ff8a72;}

  /* ---------- COMBAT + SPAWN JUICE ---------- */
  /* Body-level so they survive the full re-render that follows an action. */
  .dmgfloat{position:fixed;z-index:45;pointer-events:none;transform:translate(-50%,-50%);
    font-family:var(--serif);font-weight:800;font-size:22px;color:#fff;
    text-shadow:0 2px 6px #000,0 0 10px #000;animation:dmgrise .85s ease-out forwards;}
  .dmgfloat.kill{color:var(--ember-3);font-size:27px;}
  @keyframes dmgrise{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
    18%{opacity:1;transform:translate(-50%,-95%) scale(1.15);}
    100%{opacity:0;transform:translate(-50%,-210%) scale(1);}}
  .poof{position:fixed;z-index:44;pointer-events:none;width:62px;height:62px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,#fff 0%,var(--ember-2) 38%,var(--ember) 55%,transparent 72%);
    animation:poofburst .5s ease-out forwards;}
  @keyframes poofburst{
    0%{opacity:.95;transform:translate(-50%,-50%) scale(.3);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.9);}}
  /* Shake + flash on a creature that took a non-lethal hit (played on the inner body). */
  .creature.hit .body{animation:crhit .42s ease;}
  @keyframes crhit{
    0%{transform:none;}
    15%{transform:translateX(-4px);box-shadow:0 0 0 4px #fff,0 0 20px #fff;}
    32%{transform:translateX(4px);}
    50%{transform:translateX(-3px);box-shadow:0 0 0 3px rgba(255,255,255,.7),0 0 14px #fff;}
    70%{transform:translateX(2px);}
    100%{transform:none;}}
  /* Newcomers fade + scale in at the treeline. Keeps the centring translate throughout. */
  .creature.spawning{animation:crspawn .55s ease-out;}
  @keyframes crspawn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2);}
    60%{opacity:1;transform:translate(-50%,-50%) scale(1.14);}
    100%{transform:translate(-50%,-50%) scale(1);}}

  /* Breach: a red vignette pulses in from the screen edges + the Camp stat recoils. */
  .breachflash{position:fixed;inset:0;z-index:43;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center, transparent 42%, rgba(190,20,10,.55) 100%);
    animation:breachpulse .75s ease-out forwards;}
  @keyframes breachpulse{0%{opacity:0;}22%{opacity:var(--peak,1);}100%{opacity:0;}}
  .stat.camp.breached{animation:campshake .5s ease;}
  @keyframes campshake{
    0%,100%{transform:none;}
    15%{transform:translateX(-5px);}30%{transform:translateX(5px);}
    45%{transform:translateX(-4px);}60%{transform:translateX(3px);}
    75%{transform:translateX(-2px);}}
  .stat.camp.breached .val{animation:campredflash .5s ease;}
  @keyframes campredflash{0%,100%{color:var(--frost);}30%,60%{color:var(--blood-2);}}

  /* ---------- TURN + HAND ---------- */
  .turnbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--panel);border:1.5px solid var(--panel-line);border-radius:12px;padding:9px 12px;margin:6px 0 8px;}
  .turnbar .who{font-family:var(--serif);font-size:18px;font-weight:700;}
  .turnbar .who .role{font-size:11.5px;color:var(--moss);font-weight:700;font-family:var(--sans);}
  .prompt{text-align:center;font-size:14px;color:var(--fire-ink);min-height:19px;margin-bottom:7px;font-family:var(--serif);font-style:italic;font-weight:600;}

  .hand{display:flex;gap:9px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .hand::-webkit-scrollbar{height:0;}
  .card{flex:0 0 auto;width:108px;height:150px;border-radius:13px;scroll-snap-align:center;cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(168deg,var(--card-bg1),var(--card-bg2));color:var(--ink);
    border:1.5px solid rgba(0,0,0,.22);box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5);
    padding:10px 9px 9px 15px;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s, opacity .12s;}
  .card:active{transform:translateY(-2px);}
  .card .zonebar{position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--bar);}
  .card.armed{transform:translateY(-12px);box-shadow:0 14px 24px var(--ember-glow),0 0 0 3px var(--ember);}
  .card.dim{opacity:.42;} .card.faded{opacity:.4;transform:scale(.94);}
  .card .chip{position:absolute;top:8px;left:18px;width:24px;height:24px;border-radius:50%;background:var(--bar);color:#fff;
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .card .dmg{position:absolute;top:8px;right:8px;font-size:14px;font-weight:800;color:var(--bar);}
  .card .cic{font-size:30px;text-align:center;margin:26px 0 3px;}
  .card .cn{font-family:var(--serif);font-size:15px;font-weight:700;text-align:center;line-height:1.05;}
  .card .czone{font-size:11px;font-weight:800;text-align:center;margin-top:3px;color:var(--bar);text-transform:uppercase;letter-spacing:.4px;}
  .card .cd{font-size:10.5px;text-align:center;color:var(--ink-soft);margin-top:auto;line-height:1.25;}

  .controls{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
  .controls .btn{flex:1;min-width:118px;font-size:14.5px;padding:14px;}
  .btn.role{background:linear-gradient(180deg, rgba(93,138,58,.5), rgba(93,138,58,.22));border-color:var(--moss);}
  .btn.endturn{background:linear-gradient(180deg,#8fd0e6,#5fa6c4);color:#08222e;border:none;font-weight:800;}
  .btn.play{flex:1;background:linear-gradient(180deg,var(--ember-2),var(--ember));color:#1c1206;border:none;font-weight:800;
    box-shadow:0 4px 16px var(--ember-glow);}
  .btn:disabled{opacity:.4;pointer-events:none;}

  /* ---------- LOG ---------- */
  .log{margin-top:12px;background:var(--panel);border:1.5px solid var(--panel-line);border-radius:11px;
    padding:9px 12px;font-size:13px;line-height:1.55;color:var(--parch-2);max-height:104px;overflow-y:auto;}
  .log .l{margin:1px 0;}
  .log .l.bad{color:var(--blood-2);font-weight:600;}
  .log .l.good{color:var(--moss);font-weight:600;}
  .log .l.fire{color:var(--fire-ink);}
  .log .l.night{color:var(--frost);font-family:var(--serif);font-style:italic;}

  /* ---------- OVERLAY ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.84);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .3s;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{max-width:410px;width:100%;text-align:center;background:var(--modal-bg);color:var(--parch);
    border:1.5px solid var(--panel-line);border-radius:18px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .modal .big-ic{font-size:56px;filter:drop-shadow(0 0 18px var(--ember-glow));}
  .modal h2{font-size:30px;margin:8px 0;}
  .modal h2.win{color:var(--fire-ink);text-shadow:0 0 20px var(--ember-glow);}
  .modal h2.lose{color:var(--blood-2);}
  .modal p{color:var(--parch-2);font-size:14.5px;line-height:1.55;margin-bottom:8px;}
  .modal .howto{text-align:left;margin:14px 0;}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 6px;}
  .statcell{background:rgba(127,127,127,.13);border:1px solid var(--panel-line);border-radius:11px;padding:9px 11px;text-align:left;}
  .statcell .k{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--parch-2);font-weight:700;}
  .statcell .v{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--parch);margin-top:2px;line-height:1;}
  .statcell .v .em{font-size:16px;margin-right:3px;}
  .bestline{font-size:12px;margin-top:8px;text-align:center;color:var(--fire-ink);
    font-family:var(--serif);font-style:italic;font-weight:600;min-height:16px;}
  .difftag{display:block;font-size:10px;margin-top:2px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.72;}
  .creatureinfo{display:flex;align-items:center;gap:11px;background:var(--panel);border:1.5px solid var(--panel-line);
    border-radius:12px;padding:10px 12px;margin:8px 0 2px;position:relative;}
  .creatureinfo .ci-ic{font-size:30px;line-height:1;flex:0 0 auto;}
  .creatureinfo .ci-main{flex:1;min-width:0;}
  .creatureinfo .ci-name{font-family:var(--serif);font-weight:800;font-size:16px;color:var(--parch);}
  .creatureinfo .ci-line{font-size:12px;color:var(--parch-2);margin-top:2px;line-height:1.45;}
  .creatureinfo .ci-hit{color:var(--frost);font-weight:600;}
  .creatureinfo .ci-nohit{color:var(--fire-ink);font-weight:600;}
  .creatureinfo .imminent{color:#ff8a72;font-weight:700;}
  .creatureinfo .ci-close{position:absolute;top:5px;right:8px;cursor:pointer;color:var(--parch-2);
    font-size:15px;line-height:1;padding:3px 5px;border-radius:6px;}
  .creatureinfo .ci-close:hover{background:rgba(127,127,127,.15);}
  .hidden{display:none !important;}
  .nightbanner{position:fixed;top:0;left:0;right:0;z-index:40;text-align:center;
    font-family:var(--serif);font-style:italic;font-size:21px;color:#fff;
    padding:max(20px,calc(env(safe-area-inset-top) + 12px)) 18px 18px;
    background:linear-gradient(180deg, rgba(5,7,12,.92), rgba(5,7,12,0));pointer-events:none;animation:banner 1.8s ease forwards;}
  @keyframes banner{0%{opacity:0;transform:translateY(-12px);}25%,70%{opacity:1;transform:translateY(0);}100%{opacity:0;}}
  .footnote{text-align:center;font-size:11px;color:var(--parch-2);opacity:.6;margin-top:16px;font-family:var(--serif);}

  /* ---------- DIGI SITE: back link, menu, settings, reduced motion ---------- */
  body{touch-action:manipulation;}
  .btn{min-height:44px;}
  .creatureinfo .ci-close{top:2px;right:2px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;}
  .creatureinfo{padding-right:46px;}
  .backlink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;
    color:var(--parch-2);font-family:var(--serif);font-size:14px;text-decoration:none;}
  .backlink:active{opacity:.7;}
  .backrow{text-align:center;margin-top:8px;}
  .setrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px;}
  .setrow .btn{flex:1 1 140px;font-size:14px;padding:10px 12px;}
  .modal .setrow .btn{flex:1 1 44%;}
  .modal .setrow.wide{margin-top:0;}
  .modal .setrow.wide .btn{flex:1 1 100%;}
  .modal .menu-actions{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
  .modal .menu-actions .btn.big{margin-top:0;}
  .modal details{text-align:left;margin:10px 0 4px;border:1.5px solid var(--panel-line);border-radius:11px;padding:0 12px;}
  .modal summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--serif);font-weight:700;color:var(--fire-ink);}
  .modal{max-height:calc(100dvh - 24px);overflow-y:auto;}
  .continue{border-color:var(--ember-2);}
  .continue .cline{font-family:var(--serif);font-style:italic;color:var(--parch-2);font-size:14px;text-align:center;}
  .continue .btn.big{margin-top:10px;}
  /* Reduced motion (in-game toggle; defaults to the OS prefers-reduced-motion setting). */
  body.rm *, body.rm *::before, body.rm *::after{animation:none !important;transition:none !important;}
  body.rm .confetti, body.rm .heli-fly, body.rm .poof{display:none !important;}
  body.rm .breachflash{opacity:calc(var(--peak,1)*.6);}

  /* ======================================================
     TABLET PORTRAIT  ≥ 620px
     Wider column, bigger board, larger everything
     ====================================================== */
  .confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:51;}
  .confetti i{position:absolute;top:-28px;border-radius:2px;opacity:.93;animation:conffall linear forwards;}
  @keyframes conffall{to{transform:translateY(112vh) rotate(740deg);}}
  .heli-fly{position:fixed;top:11%;left:-80px;font-size:48px;z-index:53;pointer-events:none;
    animation:heliacross 3.5s ease-in-out forwards;}
  @keyframes heliacross{
    0%  {left:-80px;opacity:0;transform:scaleX(-1) translateY(0);}
    10% {opacity:1;}
    50% {transform:scaleX(-1) translateY(-14px);}
    88% {opacity:1;}
    100%{left:112vw;opacity:0;transform:scaleX(-1) translateY(-4px);}
  }
  .modal.win-modal{border-color:var(--ember-2);box-shadow:0 0 0 2px var(--ember-2),0 20px 60px rgba(0,0,0,.6),0 0 70px var(--ember-glow);}
  .modal h2.win{font-size:36px;text-shadow:0 0 30px var(--ember-glow);}
  .win-sub{color:var(--ember-2);font-weight:800;font-size:14px;margin:-4px 0 10px;letter-spacing:1px;text-transform:uppercase;}

  @media (min-width: 620px) {
    #app { max-width: 700px; }
    .board-wrap { max-width: 480px; }
    .stat .val { font-size: 34px; }
    .stat .lab { font-size: 11px; }
    .card { width: 128px; height: 164px; }
    .card .cic { font-size: 34px; margin: 28px 0 4px; }
    .card .cn  { font-size: 16px; }
    .card .cd  { font-size: 11.5px; }
    .creature .body { width: 56px; height: 56px; font-size: 30px; }
    .creature .znum { width: 22px; height: 22px; font-size: 12px; }
    .creature .nm   { font-size: 13px; }
    .creature .hp i { width: 9px; height: 9px; }
    .ring .rnum { width: 24px; height: 24px; font-size: 13px; }
    .firepit { width: 70px; height: 70px; font-size: 42px; }
    .firepit .glow { width: 170px; height: 170px; }
    .turnbar .who { font-size: 22px; }
    .turnbar .who .role { font-size: 13px; }
    .controls .btn { font-size: 17px; padding: 16px; }
    .btn.icon { padding: 12px 16px; font-size: 20px; }
    .prompt { font-size: 16px; }
    .pip { width: 20px; height: 20px; font-size: 11px; }
    .zchip { font-size: 13px; padding: 5px 12px; }
    .log { font-size: 14px; }
  }

  /* ======================================================
     TABLET LANDSCAPE  ≥ 700px wide AND ≥ 520px tall
     True two-column: board left, hand+controls right
     No horizontal scrolling on the card hand
     ====================================================== */
  @media (min-width: 700px) and (orientation: landscape) and (min-height: 520px) {
    #app { max-width: 100%; padding: 16px 24px;
           min-height: calc(100vh - 32px); min-height: calc(100dvh - 32px);
           display: flex; flex-direction: column; justify-content: center; }

    /* Setup screen: keep readable width, don't stretch full-screen */
    #app > .title-wrap, #app > .panel, #app > .btn.big, #app > .footnote {
      max-width: 660px; width: 100%; align-self: center; }

    /* Two-column layout: board left, hand+controls right */
    .game-layout { display: flex; gap: 24px; align-items: flex-start; width: 100%; }
    .left-col  { flex: 0 0 min(52vw, 74vh); }
    .right-col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }

    /* Board fills the left column */
    .board-wrap { max-width: 100%; margin: 0 auto 8px; }

    /* HUD and legend tighten up in left col */
    .hud { margin-bottom: 10px; }
    .stat .val { font-size: 30px; }
    .zlegend { margin: 2px 0 0; }

    /* Slightly larger fire + creatures on the bigger board */
    .firepit { width: 72px; height: 72px; font-size: 44px; }
    .firepit .glow { width: 180px; height: 180px; }
    .creature .body { width: 58px; height: 58px; font-size: 30px; }
    .creature .nm { font-size: 13px; }
    .ring .rnum { width: 24px; height: 24px; font-size: 13px; }

    /* Cards: 3-column grid — no horizontal scroll, all visible */
    .hand {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      overflow: visible;
      padding: 4px 0 8px;
    }
    .card { width: auto; height: 168px; }
    .card .cic { margin: 22px 0 3px; font-size: 32px; }

    /* Controls row stays full width */
    .controls { flex-wrap: wrap; }
    .controls .btn { font-size: 16px; padding: 14px; }
    .btn.endturn { flex: 2; }

    /* Log gets a bit more height since there's vertical room */
    .log { max-height: 140px; }

    /* Turnbar tightens */
    .turnbar { margin: 2px 0 8px; }
    .turnbar .who { font-size: 20px; }
  }


  /* ======================================================
     v2.1 GAME SCREEN — one fixed screen, board first.
     Top bar · board (fills what's left) · hand tray.
     ====================================================== */
  html.ingame, body.ingame{height:100%;overflow:hidden;overscroll-behavior:none;}
  body.ingame #app{max-width:560px;height:100vh;height:100dvh;display:flex;
    padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));}
  .gscreen{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px;width:100%;}

  /* top bar */
  .topbar{flex:0 0 auto;display:flex;gap:6px;}
  .topbar .stat{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:7px;padding:3px 6px;border-radius:11px;
    min-height:44px;text-align:left;box-shadow:none;}
  .topbar .stat.fire{flex:1.7 1 0;}
  .topbar .stat .lab{font-size:9px;letter-spacing:1.1px;}
  .topbar .stat .val{font-size:21px;margin-top:0;}
  .topbar .stat .val .unit{font-size:11px;margin-top:3px;}
  .topbar .pips{margin-top:0;gap:3px;}
  .topbar .pip{width:15px;height:15px;font-size:9px;border-width:1.5px;}
  .topbar .menubtn{flex:0 0 46px;padding:0;font-size:19px;}

  /* board: a night scene filling the zone — sky and treeline beyond, the clearing on tilted ground.
     --rx/--ry are the Deep Woods ring's radii; every ring, creature, the fire and the light derive from them. */
  .boardzone{flex:1 1 auto;min-height:0;position:relative;container-type:size;display:flex;align-items:center;justify-content:center;}
  .gscreen .board{position:relative;padding-top:0;width:100%;height:100%;
    --rx:min(41.5cqw,44cqh); --ry:calc(var(--rx) * .95); --cy:max(56%, calc(100% - var(--ry) - 64px)); --hz:calc(var(--cy) - var(--ry) * 1.12);
    border-radius:24px;overflow:hidden;border:2px solid var(--board-edge);
    background:#0e1a16;
    box-shadow:0 4px 18px rgba(0,0,0,.3);}
  .gscreen .board .sky{position:absolute;left:0;right:0;top:0;height:calc(var(--hz) + 6px);z-index:4;pointer-events:none;
    background:linear-gradient(180deg,#050a14 0%,#0b1527 45%,#1a2c47 85%,#22385a 100%);}
  .gscreen .board .stars{position:absolute;left:0;right:0;top:0;height:calc(var(--hz) - 20px);z-index:4;pointer-events:none;}
  .gscreen .board .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#f4efe0;opacity:.55;
    animation:twinkle 3.6s ease-in-out infinite;animation-delay:var(--t,0s);}
  @keyframes twinkle{0%,100%{opacity:.55}50%{opacity:.15}}
  .gscreen .board .moon{position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;
    background:radial-gradient(circle at 36% 34%,#fffbea,#ece2bd 58%,#cbbf95);box-shadow:0 0 18px 6px rgba(255,246,214,.28);}
  .gscreen .board .ground{position:absolute;left:0;right:0;bottom:0;top:var(--hz);z-index:1;pointer-events:none;
    background:linear-gradient(180deg,#16251f 0%,#121f1a 40%,#0c1512 100%);}
  .gscreen .board .brush{position:absolute;left:0;bottom:-2px;width:100%;height:min(44px,8cqh);z-index:4;pointer-events:none;}
  .gscreen .board .treeline{position:absolute;left:0;width:100%;height:min(86px,17cqh);z-index:4;pointer-events:none;
    top:calc(var(--hz) - min(86px,17cqh) + 8px);}
  .gscreen .board .clearing{position:absolute;left:50%;top:var(--cy);width:calc(var(--rx) * 2.45);height:calc(var(--ry) * 2.45);
    transform:translate(-50%,-50%);z-index:1;pointer-events:none;border-radius:50%;
    background:radial-gradient(closest-side, rgba(110,88,58,.55) 0%, rgba(74,72,48,.42) 45%, rgba(38,52,38,.25) 75%, rgba(20,34,29,0) 100%);}
  .gscreen .board .tent{position:absolute;left:calc(50% - var(--rx) * .2);top:calc(var(--cy) - var(--ry) * .17);z-index:2;
    transform:translate(-50%,-50%);font-size:clamp(20px,6cqw,30px);pointer-events:none;filter:brightness(.85);}
  .gscreen .ring{border-radius:50%;left:50%;top:var(--cy);z-index:2;
    width:calc(var(--rx) * 2 * var(--f));height:calc(var(--ry) * 2 * var(--f));}
  .gscreen .ring.lit{border-width:2.5px;box-shadow:inset 0 0 22px var(--zsoft), 0 0 10px var(--zsoft);}
  .gscreen .firepit{top:var(--cy);}
  .gscreen .creature{left:calc(50% + var(--rx) * var(--ux));top:calc(var(--cy) + var(--ry) * var(--uy));
    transform:translate(-50%,-50%) scale(var(--s,1));}
  .gscreen .creature .body{width:50px;height:50px;}
  @property --lr{syntax:'<number>';inherits:false;initial-value:1;}
  .gscreen .lightmask{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(calc(var(--rx) * var(--lr)) calc(var(--ry) * var(--lr)) at 50% var(--cy),
      rgba(3,6,11,0) 0%, rgba(3,6,11,0) 60%, rgba(3,6,11,.42) 88%, rgba(3,6,11,.6) 100%);}
  .gscreen .firepit .glow{width:min(48cqw,210px);height:min(48cqw,210px);}
  .firepit.out .flame{filter:grayscale(1) brightness(.45);opacity:.5;animation:none;transition:opacity 1s, filter 1s;}
  .firepit.out .glow{opacity:.1 !important;}
  .board.dawn::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,200,130,.78) 0%,rgba(255,160,100,.32) 42%,rgba(255,220,170,0) 78%);animation:dawnup 1.6s ease forwards;}
  @keyframes dawnup{from{opacity:0}to{opacity:1}}

  /* creatures: idle breathing, eyes in the dark, walking, lunging */
  .gscreen .creature .body{animation:idle 2.8s ease-in-out infinite;animation-delay:var(--d,0s);}
  @keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.5px) scale(1.04)}}
  .gscreen .creature.unlit .body{opacity:1;filter:brightness(.16) saturate(.3);border-color:rgba(120,135,155,.35);}
  .creature .eyes{display:none;position:absolute;top:17px;left:50%;transform:translateX(-50%);gap:8px;z-index:2;pointer-events:none;}
  .creature.unlit .eyes{display:flex;}
  .creature .eyes i{width:6px;height:4px;border-radius:50%;background:#ffd34d;box-shadow:0 0 6px 2px rgba(255,196,60,.75);
    animation:blink 4.6s infinite;animation-delay:var(--d,0s);}
  @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
  .creature.unlit .nm{opacity:.45;} .creature.unlit .hp{opacity:.35;}
  .creature.walking .body{animation:hop .17s ease-in-out 3 alternate;}
  @keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px) rotate(3deg)}}
  .creature.lunge .body{animation:lunge .5s ease-in forwards;}
  @keyframes lunge{0%{transform:scale(1)}40%{transform:scale(1.25);box-shadow:0 0 22px #ff4a2a}100%{transform:scale(.6)}}
  .creature.ghost{position:fixed;z-index:44;pointer-events:none;animation:ghostdie .55s ease-in forwards;}
  @keyframes ghostdie{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,-50%) scale(1.22) rotate(-8deg);filter:brightness(2.2)}
    100%{opacity:0;transform:translate(-50%,-70%) scale(.35) rotate(24deg)}}

  /* floating info card + ticker over the foot of the board */
  .gscreen .creatureinfo{position:absolute;left:8px;right:8px;bottom:8px;z-index:9;margin:0;
    background:var(--modal-bg);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fade .2s;}
  .ticker{position:absolute;left:12px;right:12px;bottom:9px;z-index:8;pointer-events:none;text-align:center;
    font-family:var(--serif);font-style:italic;font-size:12.5px;line-height:1.3;color:#f1e8d3;text-shadow:0 1px 3px #000,0 0 8px #000;opacity:.72;}
  .ticker.bad{color:#ff9f8a;} .ticker.good{color:#c4e8a0;} .ticker.fire{color:#ffc670;} .ticker.night{color:#a9d4ec;}
  .ticker.new{animation:tickin 3.4s ease forwards;}
  @keyframes tickin{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:.72}}

  /* tray: who's on watch, the prompt, a one-row hand, one action row */
  .tray{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;}
  .tray .wholine{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px;}
  .tray .whoname{font-family:var(--serif);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tray .whorole{font-size:11.5px;color:var(--moss);font-weight:700;white-space:nowrap;}
  .gscreen .prompt{margin:0;min-height:34px;display:flex;align-items:center;justify-content:center;font-size:13.5px;line-height:1.22;padding:0 6px;}
  .gscreen .hand{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:12px 1px 3px;margin-top:-10px;scroll-snap-type:none;}
  .gscreen .card{flex:1 1 0;min-width:56px;max-width:100px;width:auto;height:clamp(100px,12.6vh,124px);padding:6px 4px 6px 9px;border-radius:11px;}
  .gscreen .card .zonebar{width:5px;}
  .gscreen .card .chip{top:5px;left:9px;width:18px;height:18px;font-size:10px;}
  .gscreen .card .dmg{top:5px;right:5px;font-size:11px;}
  .gscreen .card .cic{font-size:25px;margin:22px 0 3px;}
  .gscreen .card .cn{font-size:11.5px;}
  .gscreen .card .czone{font-size:8.5px;letter-spacing:.2px;line-height:1.1;}
  .gscreen .card.armed{transform:translateY(-9px);}

<script>
"use strict";

/* =========================================================
   CAMPFIRE WATCH — a two-player co-operative survival game
   ---------------------------------------------------------
   CHANGELOG
   v1.0.0  Original build.
   v1.1.0  Fix: in-game help stated wrong light thresholds.
   v1.2.0  Single-source light thresholds (LIGHT); escape all
           player-supplied names before they reach the DOM.
   v1.3.0  Animated night advance — creatures now visibly step
           one ring inward (and breach into the fire) instead
           of teleporting. UI locks during the ~1s sequence.
   v1.4.0  Combat & spawn juice — floating damage numbers, a
           burst on kills, a shake+flash on non-lethal hits, and
           newcomers fade in at the treeline.
   v1.5.0  Breach feedback — a red vignette pulses in from the
           screen edges and the Camp stat recoils when a
           creature breaks into camp (intensity scales with the
           number of breaches).
   v1.6.0  Continuous fire — the flame and its glow now scale
           smoothly with fuel and the glow brightens as more
           rings are lit, instead of a single binary "low" state.
           The flame quickens and reddens when the fire starves.
   v1.7.0  Scorekeeping — the run is tracked (creatures downed,
           breaches, closest call, dimmest the fire got) and
           shown on the win/lose screen.
   v1.8.0  Persistent bests — per-difficulty records (best nights,
           most downed, wins) saved to localStorage and shown on
           the setup screen. Fully offline; degrades gracefully if
           storage is unavailable.
   v1.9.0  Readability — tapping a creature opens an info panel
           (HP, location, nights-to-breach, breach damage, and
           which of your cards can hit it). Difficulty buttons now
           carry an honesty tag (Forgiving / Fair / Brutal).
   v2.0.0  Digi Games edition — site tags and thumbnail, back
           link, round tracking (game_start / game_end), a pause
           menu (rules, sound, theme, full screen, motion, quit),
           a game in progress survives a reload ("Continue"),
           full screen on Android, reduced-motion toggle, and
           44px tap targets. Rules and balance unchanged.
   v2.1.0  One-screen layout: slim top bar, the board fills the
           rest (rings stretch to ovals on tall phones), a one-row
           hand and one action row; legend, log and footer moved
           out of the way (full log in the menu). Animations: cards
           fly to their target, sparks and embers from the fire,
           firelight that visibly reaches out, creatures that
           breathe, show only their eyes in the dark, walk in and
           lunge, kill bursts, lantern sweep, moon across the
           nights, dawn on a win, hands dealt on each hand-off,
           haptics. Rules, balance, saves and tracking unchanged.
   v2.2.0  Board redrawn as a night scene: round rings on gently
           tilted ground (no more stretched ovals), sky with stars
           and moon, a pine treeline, the camp tent by the fire, and
           creatures a touch smaller towards the back.

   ROUND (for tracking): one run — from the first card, role or
   End Watch tap after "Light the Fire" (or Play Again / Continue)
   to dawn (win) or the fire dying / camp falling (loss).
   level = the night reached. Quitting mid-run sends no game_end.
   ========================================================= */
const VERSION = "2.2.0";

const DIFFS = {
  easy:     { name:"Gentle Night", tag:"Forgiving", fuel:9, camp:7, rounds:7, hand:5,
              spawn:[1,1,1,1,2,2,2], seed:1 },
  standard: { name:"True Dark",    tag:"Fair",      fuel:7, camp:5, rounds:8, hand:5,
              spawn:[1,2,2,2,3,3,3,3], seed:2 },
  hard:     { name:"Black Forest", tag:"Brutal",    fuel:7, camp:5, rounds:9, hand:5,
              spawn:[1,2,2,2,3,3,3,3,3], seed:3 },
};
const MAX_FUEL = 12;

// Single source of truth: minimum fuel that lights each ring.
// Read by litFor, lightPips, lightReachLabel AND the help text, so they can never drift apart.
const LIGHT = { 1:1, 2:5, 3:9 };

// Escape any player-supplied string before it enters innerHTML (names reach the HUD, log and setup inputs).
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

const ROLES = {
  hunter:  { ic:"🏹", name:"The Hunter",  desc:"Every attack you make deals +1 damage." },
  forager: { ic:"🪵", name:"The Forager", desc:"All fuel cards give you +1 extra fuel. Once per turn, burn any spare card for +1 fuel." },
  scout:   { ic:"🔭", name:"The Scout",   desc:"You can strike creatures in the Deep Woods even in pitch dark." },
  keeper:  { ic:"🔥", name:"The Keeper",  desc:"Once per night, brandish a torch to scare one creature back a ring." },
};

const CREATURES = {
  fox:  { ic:"🦊", name:"Fox",  hp:1 },
  boar: { ic:"🐗", name:"Boar", hp:2 },
  wolf: { ic:"🐺", name:"Wolf", hp:2 },
  bear: { ic:"🐻", name:"Bear", hp:3 },
};

// target: 'r1'|'r2'|'r3'|'anyLit'|null   kind: 'attack'|'fuel'|'lantern'|'draw'
const CARD_DEFS = {
  stone:   { name:"Sling Stone",  ic:"🪨", kind:"attack", target:"r1", dmg:1, ring:1, copies:6,
             desc:"1 dmg · Clearing" },
  arrow:   { name:"Bow Shot",     ic:"🏹", kind:"attack", target:"r2", dmg:1, ring:2, copies:6,
             desc:"1 dmg · Treeline" },
  farshot: { name:"Long Shot",    ic:"🎯", kind:"attack", target:"r3", dmg:1, ring:3, copies:5,
             desc:"1 dmg · Deep Woods" },
  heavy:   { name:"Heavy Club",   ic:"🪓", kind:"attack", target:"r1", dmg:2, ring:1, copies:3,
             desc:"2 dmg · Clearing" },
  snare:   { name:"Snare",        ic:"🪤", kind:"attack", target:"anyLit", dmg:2, copies:3,
             desc:"2 dmg · any lit ring" },
  firewood:{ name:"Firewood",     ic:"🪵", kind:"fuel", amt:3, copies:5,
             desc:"Feed fire +3 fuel" },
  kindling:{ name:"Kindling",     ic:"🌿", kind:"fuel", amt:1, copies:4,
             desc:"Feed fire +1 fuel" },
  lantern: { name:"Lantern",      ic:"🏮", kind:"lantern", copies:3,
             desc:"Light ALL rings until dawn-break this round" },
  rally:   { name:"Second Wind",  ic:"💨", kind:"draw", amt:2, copies:3,
             desc:"Draw 2 cards" },
};

const RING_NAMES = { 1:"Clearing", 2:"Treeline", 3:"Deep Woods" };
const RING_RADIUS = { 1:16, 2:29, 3:42 }; // % from centre

/* ---------------- ZONES, THEME & VISUAL HELPERS ---------------- */
const ZONES = {
  1:{ name:"Clearing",   num:"1", color:"#e23b2e", soft:"rgba(226,59,46,.18)" },
  2:{ name:"Treeline",   num:"2", color:"#e09114", soft:"rgba(224,145,20,.18)" },
  3:{ name:"Deep Woods", num:"3", color:"#15a06f", soft:"rgba(21,160,111,.18)" },
};
let theme = "day";  // "day" = high-contrast Daylight, "night" = campfire dark
function toggleTheme(){ if(nightAnimating) return; theme = (theme==="day"?"night":"day"); render(); refreshMenu(); }
function setTheme(t){ saveNames(); theme=t; render(); }

// Returns the colour bar, badge chip, damage/effect text and zone label for a card.
function cardVisual(def){
  if(def.kind==="attack"){
    if(def.target==="anyLit") return { bar:"var(--wild)", chip:"✦", dmg:def.dmg+"⚔", zlabel:"Any lit ring" };   // labels kept short for the compact hand
    const z=ZONES[def.ring];
    return { bar:z.color, chip:z.num, dmg:def.dmg+"⚔", zlabel:z.name };
  }
  if(def.kind==="fuel")    return { bar:"var(--wood)",  chip:"🪵", dmg:"+"+def.amt, zlabel:"Feed fire" };
  if(def.kind==="lantern") return { bar:"var(--frost)", chip:"🏮", dmg:"☀",        zlabel:"Light all" };
  return                          { bar:"var(--frost)", chip:"↺",  dmg:"↺"+def.amt, zlabel:"Draw "+def.amt };
}

// Coloured light-reach pips for the campfire HUD (which zones the firelight reaches).
function lightPips(){
  const reach={1:S.fuel>=LIGHT[1], 2:S.fuel>=LIGHT[2], 3:S.fuel>=LIGHT[3]};
  return [1,2,3].map(n=>{
    const lit = S.lantern || reach[n];
    return `<span class="pip ${lit?'on':'off'}" style="--zc:${ZONES[n].color}">${ZONES[n].num}</span>`;
  }).join("");
}

/* ---------------- STATE ---------------- */
let S = null;
let goldenIdx = 0;
let turnSnapshot = null;   // state at the start of the acting ranger's turn (for Undo)
let nightAnimating = false; // true during the night-advance glide; locks all input

function rand(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rand(arr.length)]; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function beginTurn(){ S.acted=false; turnSnapshot = clone(S); }   // call when a fresh acting turn starts
function undoTurn(){
  if(S && !S.over && !nightAnimating && !fxLock && turnSnapshot){ S = clone(turnSnapshot); render(); }
}

function newGame(diffKey, names, roles){
  const d = DIFFS[diffKey];
  S = {
    diffKey, d,
    rangers: [
      { name:names[0]||"Ranger One", role:roles[0], hand:[] },
      { name:names[1]||"Ranger Two", role:roles[1], hand:[] },
    ],
    fuel:d.fuel, camp:d.camp, round:1, totalRounds:d.rounds,
    cur:0, turnInRound:0,
    creatures:[], deck:[], discard:[],
    lantern:false, keeperUsed:false, foragerUsed:false,
    armedCard:null, mode:null, // mode: 'attack'|'keeper'|'forager'
    selected:null, log:[], over:null, acted:false,
    stats:{ kills:0, dmg:0, breaches:0, lowestCamp:d.camp, lowestFuel:d.fuel },
  };
  buildDeck();
  for(let r=0;r<2;r++){ drawUp(r); }
  // seed creatures
  spawn(2, pick(["fox","boar","wolf"]));
  spawn(3, pick(["fox","boar","wolf"]));
  if(diffKey==="hard"){ spawn(3, pick(["boar","wolf"])); }
  pushLog("The fire crackles. Night One falls over the camp.", "night");
  beginTurn();
}

function buildDeck(){
  const deck=[];
  for(const k in CARD_DEFS){
    for(let i=0;i<CARD_DEFS[k].copies;i++) deck.push(k);
  }
  // shuffle
  for(let i=deck.length-1;i>0;i--){ const j=rand(i+1); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  S.deck=deck; S.discard=[];
}
function drawCard(){
  if(S.deck.length===0){
    if(S.discard.length===0) return null;
    S.deck=S.discard; S.discard=[];
    for(let i=S.deck.length-1;i>0;i--){ const j=rand(i+1); [S.deck[i],S.deck[j]]=[S.deck[j],S.deck[i]]; }
    pushLog("Spent cards are gathered and reshuffled.","");
  }
  return S.deck.pop();
}
function drawUp(r){
  const h=S.rangers[r].hand;
  while(h.length < S.d.hand){ const c=drawCard(); if(c===null) break; h.push(c); }
}
function spawn(ring, key){
  goldenIdx++;
  const frac = (goldenIdx * 0.61803398875) % 1.0;
  let deg = (296 + frac * 308 + (Math.random()*16 - 8)) % 360;
  if(deg<0) deg+=360;
  if(deg>=244 && deg<=296){ deg = deg<270 ? 244 : 296; }
  S.creatures.push({ id:"c"+goldenIdx+"_"+rand(99999), key, hp:CREATURES[key].hp,
                     ring, angle:deg*Math.PI/180 });
}
function pushLog(text, cls){
  S.log.unshift({text, cls:cls||""});
  if(S.log.length>30) S.log.pop();
}

/* ---------------- LIGHT ---------------- */
function litFor(ring, rangerIdx){
  if(S.lantern) return true;
  if(ring===3 && S.rangers[rangerIdx].role==="scout") return true;
  return S.fuel >= LIGHT[ring];
}
function lightReachLabel(){
  const lit=[];
  if(S.fuel>=LIGHT[1]) lit.push("Clearing");
  if(S.fuel>=LIGHT[2]) lit.push("Treeline");
  if(S.fuel>=LIGHT[3]) lit.push("Deep Woods");
  if(lit.length===0) return "✦ near darkness";
  return "lit: "+lit.join(", ");
}

/* ---------------- PERSISTENCE (bests) ----------------
   localStorage only — no network, no files, no dependencies, so the game
   stays one self-contained offline HTML. Every access is guarded: if storage
   is unavailable (private mode, sandboxed preview, disabled) it silently
   no-ops and the game plays exactly as before, just without saved bests.   */
/* One save object under the site prefix (contract §7): bests, settings,
   the setup screen, and the run in progress (so a reload offers "Continue"). */
const SAVE_KEY = "digi-campfire-watch-v1";
const OLD_BEST_KEY = "campfire-watch-bests-v1";   // pre-site builds kept bests here
const coarse = (()=>{ try{ return matchMedia('(pointer: coarse)').matches; }catch(e){ return false; } })();
const prefersRM = (()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();
function loadSave(){
  let s=null;
  try{ const raw=window.localStorage.getItem(SAVE_KEY); if(raw) s=JSON.parse(raw); }catch(e){ s=null; }
  if(!s || typeof s!=="object") s={};
  if(!s.bests || typeof s.bests!=="object"){
    s.bests={};
    try{ const o=window.localStorage.getItem(OLD_BEST_KEY); if(o){ const b=JSON.parse(o); if(b && typeof b==="object") s.bests=b; } }catch(e){}
  }
  if(typeof s.fs!=="boolean")    s.fs=coarse;          // full screen: on for touch screens (§10)
  if(typeof s.sound!=="boolean") s.sound=true;
  if(typeof s.rm!=="boolean")    s.rm=prefersRM;
  if(s.theme!=="day" && s.theme!=="night") s.theme="day";
  if(s.game && (typeof s.game!=="object" || !DIFFS[s.game.diffKey] || !s.game.d || !Array.isArray(s.game.rangers) || s.game.over)) s.game=null;
  if(s.setup && (typeof s.setup!=="object" || !DIFFS[s.setup.diff] || !Array.isArray(s.setup.names) || !Array.isArray(s.setup.roles)
                 || !s.setup.roles.every(r=>ROLES[r]))) s.setup=null;
  return s;
}
const save = loadSave();
theme = save.theme;
let motionReduced = save.rm;
function persist(){
  // The setup screen (S null) leaves a saved run alone; only a new run, game over or Quit replace it.
  if(S && !nightAnimating) save.game = S.over ? null : clone(S);      // never store a half-resolved night
  save.gi = goldenIdx;
  save.setup = setupState;
  save.sound = soundOn; save.theme = theme; save.rm = motionReduced;
  try{ window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); return true; }
  catch(e){ return false; }
}
function loadBests(){ return save.bests || {}; }
function saveBests(b){ save.bests=b; return persist(); }
function recordResult(){
  if(!S || !S.over) return;
  const b=loadBests(), k=S.diffKey;
  const rec=b[k]||{ plays:0, wins:0, bestNights:0, mostKills:0, bestCampLeft:0 };
  rec.plays=(rec.plays||0)+1;
  const nights = S.over.won ? S.totalRounds : Math.max(0, S.round-1);
  if(S.over.won){ rec.wins=(rec.wins||0)+1; rec.bestCampLeft=Math.max(rec.bestCampLeft||0, S.camp); }
  rec.bestNights=Math.max(rec.bestNights||0, nights);
  rec.mostKills =Math.max(rec.mostKills||0, S.stats.kills);
  b[k]=rec; saveBests(b);
}
function bestLine(diffKey){
  const b=loadBests()[diffKey];
  if(!b || !b.plays) return "No runs yet — light the first fire.";
  const d=DIFFS[diffKey];
  if(b.wins>0)
    return `★ Best: survived all ${d.rounds} nights · ${b.mostKills} downed · ${b.wins} win${b.wins>1?"s":""} in ${b.plays}`;
  return `Furthest: ${b.bestNights} of ${d.rounds} nights · ${b.mostKills} downed · ${b.plays} attempt${b.plays>1?"s":""}`;
}


/* ---------------- SOUND ENGINE ---------------- */
let soundOn = save.sound;
let _actx = null;
function toggleSound(){ if(nightAnimating) return; soundOn=!soundOn; render(); refreshMenu(); }
function _ctx(){
  if(!_actx){ try{ _actx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(_actx.state==='suspended') _actx.resume(); return _actx;
}
function _t(freq,dur,type,vol,dt){
  if(!soundOn) return; const ctx=_ctx(); if(!ctx) return;
  try{
    const t=ctx.currentTime+(dt||0), o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function _n(dur,ffreq,vol,dt,ftype){
  if(!soundOn) return; const ctx=_ctx(); if(!ctx) return;
  try{
    const t=ctx.currentTime+(dt||0), n=Math.ceil(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<n;i++) data[i]=(Math.random()*2-1);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type=ftype||'bandpass'; f.frequency.value=ffreq; f.Q.value=2;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t);
  }catch(e){}
}
function _sweep(f1,f2,dur,type,vol,dt){
  if(!soundOn) return; const ctx=_ctx(); if(!ctx) return;
  try{
    const t=ctx.currentTime+(dt||0), o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function _heli(start,dur){
  const ctx=_ctx(); if(!ctx) return;
  const step=0.105, n=Math.floor(dur/step);
  for(let i=0;i<n;i++){
    const p=i/n, env=Math.min(1,p/0.28)*(p>0.72?Math.max(0.15,1-(p-0.72)/0.28):1);
    _n(0.055,165,0.14*env,start+i*step,'lowpass');
    _t(50,0.06,'sine',0.11*env,start+i*step);
  }
}

  const p=rq.call(el,{navigationUI:'hide'}); if(p&&p.then) p.then(lock,()=>{}); else lock(); }catch(e){} }

// Fly a glyph (or a glowing bolt) along an arc. Returns the flight time in ms (0 = no flight).
function fly(from, to, glyph, cls, dur){
  if(!fxOn() || !from || !to) return 0;
  const a=centreOf(from), b=centreOf(to); dur=dur||340;
  const d=document.createElement('div');
  d.className='fly '+(cls||''); d.textContent=glyph||"";
  d.style.left=a.x+'px'; d.style.top=a.y+'px';
  document.body.appendChild(d);
  const dx=b.x-a.x, dy=b.y-a.y, lift=Math.min(140, 50+Math.hypot(dx,dy)*0.3);
  const kf=[];
  for(let i=0;i<=8;i++){
    const t=i/8, x=dx*t, y=dy*t - lift*4*t*(1-t);
    kf.push({ transform:`translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${cls==='spin'?Math.round(t*560):0}deg) scale(${(1.25-0.35*t).toFixed(2)})`,
              opacity: t===0 ? 0.5 : 1 });
  }
  try{ d.animate(kf,{ duration:dur, easing:'cubic-bezier(.35,.1,.65,1)', fill:'forwards' }); }catch(e){}
  setTimeout(()=>d.remove(), dur+40);
  return dur;
}
function afterFlight(ms, fn){
  if(ms<=0){ fn(); return; }
  fxLock=true;
  setTimeout(()=>{ fxLock=false; if(S) fn(); }, ms);
}

function scheduleOverlay(){

/* Sparks and embers: one canvas over the page, drawn only while there is something to draw. */
const fxc=document.createElement('canvas'); fxc.className='fxc';
let fctx=null, parts=[], fxRaf=0, emitAcc=0, lastT=0;
function initFx(){ try{ document.body.appendChild(fxc); fctx=fxc.getContext('2d'); sizeFx(); }catch(e){ fctx=null; } }
function sizeFx(){
  if(!fctx) return;
  const d=Math.min(2, window.devicePixelRatio||1);
  fxc.width=Math.round(innerWidth*d); fxc.height=Math.round(innerHeight*d);
  fxc.style.width=innerWidth+'px'; fxc.style.height=innerHeight+'px';
  fctx.setTransform(d,0,0,d,0,0);
}
function burst(x, y, n, o){
  o=o||{}; if(!fctx || !fxOn()) return;
  for(let i=0;i<n;i++){
    const a=o.up ? (-Math.PI/2 + (Math.random()-.5)*1.7) : Math.random()*Math.PI*2;
    const sp=60+Math.random()*(o.up?190:150);
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0, max:.45+Math.random()*.6,
                 r:1+Math.random()*2.2, g:o.up?160:240, h:o.hue!=null?o.hue+Math.random()*12:28+Math.random()*26 });
  }
  if(parts.length>400) parts.splice(0, parts.length-400);
  kickFx();
}
function emitEmber(){
  const s=Math.max(.6, fireScaleNow);
  parts.push({ x:fireC.x+(Math.random()-.5)*20*s, y:fireC.y-8*s, vx:(Math.random()-.5)*12, vy:-(26+Math.random()*46)*s,
               life:0, max:1+Math.random()*1.4, r:.7+Math.random()*1.5, g:-5, h:22+Math.random()*28, sw:Math.random()*6.28 });
}
function fxLoop(t){
  fxRaf=0; if(!fctx) return;
  const dt=lastT ? Math.min(.05,(t-lastT)/1000) : .016; lastT=t;
  const live=!!(S && !S.over && fxOn() && !document.hidden && !menuOpen && fireC && S.fuel>0);
  if(live){ emitAcc+=dt*(1+S.fuel*.7); while(emitAcc>=1){ emitAcc-=1; emitEmber(); } }
  fctx.clearRect(0,0,innerWidth,innerHeight);
  fctx.globalCompositeOperation='lighter';
  parts=parts.filter(p=>{
    p.life+=dt; if(p.life>=p.max) return false;
    p.vy+=p.g*dt; if(p.sw!=null){ p.sw+=dt*3; p.x+=Math.sin(p.sw)*14*dt; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    const k=1-p.life/p.max;
    fctx.globalAlpha=Math.max(0,k*k);
    fctx.fillStyle=`hsl(${p.h|0},100%,${(55+28*k)|0}%)`;
    fctx.beginPath(); fctx.arc(p.x,p.y,p.r*(.55+.45*k),0,6.2832); fctx.fill();
    return true;
  });
  fctx.globalAlpha=1;
  if(parts.length || live) fxRaf=requestAnimationFrame(fxLoop); else lastT=0;
}
function kickFx(){ if(fctx && !fxRaf && !document.hidden && (fxOn() || parts.length)) fxRaf=requestAnimationFrame(fxLoop); }

/* ---------------- CARD VALIDITY ---------------- */
function canTarget(cardKey, creature, rangerIdx){
  const def=CARD_DEFS[cardKey];
  if(def.kind!=="attack") return false;
  if(def.target==="anyLit") return litFor(creature.ring, rangerIdx);
  if(def.target==="r1") return creature.ring===1 && litFor(1, rangerIdx);
  if(def.target==="r2") return creature.ring===2 && litFor(2, rangerIdx);
  if(def.target==="r3") return creature.ring===3 && litFor(3, rangerIdx);
  return false;
}
function hasAnyTarget(cardKey, rangerIdx){
  return S.creatures.some(c=>canTarget(cardKey,c,rangerIdx));
}

/* ---------------- ACTIONS ----------------
   Unified interaction: tapping ANY card "picks it up" (selects it).
   - Non-targeted cards (fuel/lantern/draw): a "Play" button confirms.
   - Attack cards: tap a glowing creature to resolve.
   Tapping the selected card again, or Cancel, puts it back.
   v2.1: the rules resolve at once; the card then flies to its target
   and the board catches up on landing (fxLock holds input ~0.35s).
*/
function busy(){ return !S || !!S.over || nightAnimating || fxLock; }
function cardEl(i){ return document.querySelectorAll('.hand .card')[i] || null; }
function cardRect(i){ const n=cardEl(i); return n ? n.getBoundingClientRect() : null; }
function hideCard(i){ const n=cardEl(i); if(n) n.style.visibility='hidden'; }
const PROJ = { stone:"🪨", heavy:"🪓", snare:"🪤" };   // thrown things; bows fire a glowing bolt

function tapCard(handIdx){
  if(busy()) return;
  rndStart();
  const r=S.cur;
  const key=S.rangers[r].hand[handIdx];
  if(key===undefined) return;
  const def=CARD_DEFS[key];

  // Forager "burn a card" mode consumes the tapped card
  if(S.mode==="forager"){
    const from=cardRect(handIdx), to=rectOf('.firepit');
    S.rangers[r].hand.splice(handIdx,1); S.discard.push(key);
    S.fuel=Math.min(MAX_FUEL,S.fuel+1);
    S.foragerUsed=true; S.mode=null; S.armedCard=null; S.acted=true;
    pushLog(S.rangers[r].name+" feeds a spare "+def.name+" to the fire (+1 fuel).","fire");
    hideCard(handIdx); sndThrow();
    afterFlight(fly(from,to,def.ic,'spin',360), ()=>{ sndFuel(); buzz(12); render(); fireFlare(14); });
    return;
  }

  // tapping the already-selected card cancels the selection
  if(S.armedCard===handIdx){ S.armedCard=null; S.mode=null; render(); return; }

  if(def.kind==="attack"){
    if(!hasAnyTarget(key,r)){
      const where = def.target==="anyLit"?"any lit ring":RING_NAMES[def.ring];
      const tooDark = def.ring && !litFor(def.ring,r);
      flashPrompt("No creature you can reach in the "+where+(tooDark?" — it's too dark there":"")+".");
      nudgeCard(handIdx);
      return;
    }
    S.armedCard=handIdx; S.mode="attack";
  } else {
    S.armedCard=handIdx; S.mode="confirm";
  }
  sndCard(); render();
}

function playSelected(){
  if(busy() || S.mode!=="confirm" || S.armedCard===null) return;
  const r=S.cur, idx=S.armedCard, key=S.rangers[r].hand[idx], def=CARD_DEFS[key];
  const from=cardRect(idx), to=rectOf('.firepit');
  let land=()=>{};
  if(def.kind==="fuel"){
    let amt=def.amt; if(S.rangers[r].role==="forager") amt+=1;
    const before=S.fuel; S.fuel=Math.min(MAX_FUEL,S.fuel+amt); const g=S.fuel-before;
    pushLog(S.rangers[r].name+" adds "+def.name+" to the fire (+"+g+" fuel"+(g<amt?", capped":"")+").","fire");
    S.rangers[r].hand.splice(idx,1); S.discard.push(key);
    land=()=>{ sndFuel(); buzz(12); fireFlare(10+g*6); };
  } else if(def.kind==="lantern"){
    S.lantern=true;
    pushLog(S.rangers[r].name+" raises a lantern — every ring is lit until night deepens.","good");
    S.rangers[r].hand.splice(idx,1); S.discard.push(key);
    land=()=>{ sndLantern(); buzz(10); lanternSweep(); };
  } else if(def.kind==="draw"){
    sndDraw(); S.rangers[r].hand.splice(idx,1); S.discard.push(key);
    let got=0; for(let i=0;i<def.amt;i++){ const c=drawCard(); if(c){S.rangers[r].hand.push(c);got++;} }
    pushLog(S.rangers[r].name+" catches a second wind (drew "+got+").","good");
    S.armedCard=null; S.mode=null; S.acted=true;
    dealMode={ n:got };
    render(); return;
  }
  S.armedCard=null; S.mode=null; S.acted=true;
  hideCard(idx); sndThrow();
  afterFlight(fly(from,to,def.ic,'spin',380), ()=>{ render(); land(); });
}

function cancelSelection(){
  if(busy()) return;
  S.armedCard=null; S.mode=null; render();
}

function tapCreature(id){
  if(busy()) return;
  rndStart();
  const r=S.cur;
  const c=S.creatures.find(x=>x.id===id);
  if(!c) return;

  if(S.mode==="keeper"){
    if(c.ring>=3){ flashPrompt("Already at the forest edge."); return; }
    const from=rectOf('.controls .btn.role'), to=bodyRect(c.id);
    c.ring+=1;
    S.keeperUsed=true; S.mode=null; S.acted=true;
    pushLog(S.rangers[r].name+" brandishes a torch — the "+CREATURES[c.key].name+" recoils to the "+RING_NAMES[c.ring]+".","good");
    sndThrow();
    afterFlight(fly(from,to,"🔥",'spin',360), ()=>{ sndPush(); buzz(15); render(); });   // FLIP slides it back a ring
    return;
  }

  if(S.mode==="attack" && S.armedCard!==null){
    const idx=S.armedCard, key=S.rangers[r].hand[idx];
    if(!canTarget(key,c,r)){ flashPrompt("That strike can't reach this creature."); return; }
    let dmg=CARD_DEFS[key].dmg;
    if(S.rangers[r].role==="hunter") dmg+=1;
    const from=cardRect(idx), to=bodyRect(c.id);
    const hpBefore=c.hp;
    c.hp-=dmg;
    S.stats.dmg += Math.min(dmg, hpBefore);   // effective damage (no overkill)
    S.rangers[r].hand.splice(idx,1); S.discard.push(key);
    S.armedCard=null; S.mode=null; S.acted=true;
    const killed = c.hp<=0;
    if(killed){
      S.stats.kills++;
      S.creatures=S.creatures.filter(x=>x.id!==c.id);
      pushLog(S.rangers[r].name+" downs the "+CREATURES[c.key].name+"! ("+CARD_DEFS[key].name+")","good");
    } else {
      pushLog(S.rangers[r].name+" hits the "+CREATURES[c.key].name+" for "+dmg+". ("+c.hp+" left)","");
    }
    hideCard(idx); sndThrow();
    const glyph=PROJ[key]||"";
    const ms=fly(from,to,glyph,glyph?'spin':'bolt', key==="farshot"?440:key==="arrow"?380:340);
    afterFlight(ms, ()=>{
      const rect=bodyRect(c.id)||to;          // still on the board until this render
      if(killed){ makeGhost(c.id); sndKill(); buzz(28); } else { sndAttack(); buzz(14); }
      render();
      spawnFloat(rect, "−"+dmg, killed?"kill":"hit");
      if(killed){ spawnPoof(rect); burstAt(rect, 18); }
      else flashCreature(c.id);
    });
    return;
  }
  // just select for info
  S.selected = (S.selected===id)?null:id;
  render();
}

function roleAction(){

/* ---------------- NIGHT (THREAT) PHASE ----------------
   Split in two so the advance can be *seen*:
   1. nightPhase()  — fire burns down, board redraws, then creatures
      walk one ring inward (breaching ones lunge into the fire).
   2. nightResolve() — once the walk finishes, apply the damage,
      lose/win checks, spawn the next wave and start the round.
   nightAnimating locks all input for the ~1s in between.            */
function nightPhase(){
  if(nightAnimating) return;
  S.lantern=false;
  // 1. fire burns down — render so the rings visibly dim first
  sndNight(); S.fuel-=1;
  S.stats.lowestFuel=Math.min(S.stats.lowestFuel, S.fuel);
  pushLog("The fire burns lower (−1 fuel).","fire");
  S.armedCard=null; S.mode=null; S.selected=null;
  nightAnimating=true;
  render();
  boardOverlay("veil", 1250);
  buzz(10);
  advanceCreaturesVisually(nightResolve);
}

// Walk each creature to where its next ring will be, then call done().
function advanceCreaturesVisually(done){
  const STEP_MS=motionReduced?140:520, STAGGER=motionReduced?0:60;
  const nodes=Array.from(document.querySelectorAll('.board .creature'));
  if(nodes.length===0){ setTimeout(done, motionReduced?120:420); return; }
  // Force a layout flush so the browser locks in current positions
  // before we change them — otherwise the transition is skipped.
  void nodes[0].offsetWidth;
  let maxDelay=0;
  nodes.forEach((node,i)=>{
    const c=S.creatures.find(x=>x.id===node.getAttribute('data-id'));
    if(!c) return;
    const target=c.ring-1;
    const to = target>=1 ? ringPos(target, c.angle) : { ux:0, uy:0 };   // ring 0 = breach → into the fire
    const delay=i*STAGGER; maxDelay=Math.max(maxDelay,delay);
    node.style.transitionDelay=delay+'ms';
    node.style.transitionDuration=STEP_MS+'ms';
    node.classList.add(target<1?'lunge':'walking');
    node.style.setProperty('--ux', to.ux); node.style.setProperty('--uy', to.uy);
    if(target<1) node.style.opacity='0';  // fade as it reaches camp
  });
  setTimeout(done, STEP_MS + maxDelay + 60);
}

function nightResolve(){
  nightAnimating=false;
  // 2. creatures advance (state now catches up to what was shown)
  for(const c of S.creatures){ c.ring-=1; }
  const reached = S.creatures.filter(c=>c.ring<1);
  S.creatures = S.creatures.filter(c=>c.ring>=1);
  for(const c of reached){
    S.camp-=c.hp; sndBreach();
    pushLog("A "+CREATURES[c.key].name+" breaks into camp! (−"+c.hp+" integrity)","bad");
  }
  if(reached.length){
    S.stats.breaches+=reached.length;
    S.stats.lowestCamp=Math.min(S.stats.lowestCamp, S.camp);
    buzz([40,40,70]);
  }
  if(reached.length) flashBreach(reached.length);   // red vignette even if this breach is fatal
  // 3. lose checks
  if(S.fuel<=0){ return gameOver(false,"The last ember dies. Without light or warmth, you're lost in the dark."); }
  if(S.camp<=0){ return gameOver(false,"The camp is overwhelmed. You're driven into the forest, separated and alone."); }
  // 4. dawn?
  if(S.round>=S.totalRounds){
    return gameOver(true,"Your radio crackles: rescue confirmed. The helicopter descends through the mist — the creatures scatter as it lands. You kept the fire. You kept each other.");
  }
  // 5. spawn next wave
  const base=S.d.spawn[S.round-1]!==undefined?S.d.spawn[S.round-1]:S.d.spawn[S.d.spawn.length-1];
  const roll=rand(4);
  const n=Math.max(0, base + (roll===0?-1:(roll===3?1:0)));
  let poolKeys;
  if(S.round<3) poolKeys=["fox","boar","wolf"];
  else if(S.round<6) poolKeys=["boar","wolf","wolf","bear"];
  else poolKeys=["wolf","bear","bear","boar"];
  const prevIds=new Set(S.creatures.map(c=>c.id));
  for(let i=0;i<n;i++) spawn(3, pick(poolKeys));
  pushLog(n+" new shape"+(n>1?"s":"")+" stir"+(n>1?"":"s")+" in the Deep Woods.","bad");
  // 6. next round
  S.round+=1; S.turnInRound=0; S.cur=0; S.keeperUsed=false; S.foragerUsed=false;
  beginTurn();
  showNightBanner("Night "+S.round);
  pushLog("— Night "+S.round+" —","night");
  dealMode="all"; flipSkip=true;
  render();
  animateSpawns(S.creatures.filter(c=>!prevIds.has(c.id)).map(c=>c.id));
  if(reached.length){ shakeCamp(); shakeBoard(); }   // recoil on the fresh nodes (only reached if not game over)
}

function gameOver(won, msg){
  if(!S || S.over) return;             // a run ends once
  rndEnd(won);                         // before S.over is set, so a run that ends untouched still opens first
  S.over = { won, msg };
  recordResult();
  overlayAt = performance.now() + (motionReduced ? 0 : (won ? 1700 : 1000));   // let dawn break / the fire die first
  if(won) sndWin(); else sndLose();
  buzz(won ? [30,60,30,60,90] : [120]);
  render();
}

// How far the firelight reaches, as % of the board's half-size (rings sit at 32 / 58 / 84).
// How far the firelight reaches, in units of the Deep Woods ring (rings sit at .38 / .69 / 1).
function lightReach(){
  if(S.over) return S.over.won ? 3 : 0.06;
  if(S.lantern) return 1.9;
  if(S.fuel>=LIGHT[3]) return 1.16;
  if(S.fuel>=LIGHT[2]) return 0.84;
  if(S.fuel>=LIGHT[1]) return 0.52;
  return 0.3;
}
/* The clearing is drawn as ground seen from slightly above: round rings tilted to 0.86,
   centred a little below the middle of the board, with sky and treeline beyond.
   A creature's place is (ux, uy) in ring units; CSS turns that into pixels via --rx/--ry/--cy. */
const RING_F = { 1:16/42, 2:29/42, 3:1 };
function ringPos(ring, angle){ const f=RING_F[ring]||0; return { ux:+(Math.cos(angle)*f).toFixed(4), uy:+(Math.sin(angle)*f).toFixed(4) }; }
function depthScale(uy){ return +(0.9 + 0.16*(uy+1)/2).toFixed(3); }   // further back = a little smaller
function pinePath(seed, n, minH, maxH, edgeH){
  let x=0, d="M0 100", s=seed;
  const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  const step=400/n;
  for(let i=0;i<=n;i++){
    const cx=i*step+(rnd()-.5)*step*.5;
    const edge = i<2 || i>n-2;
    const h=edge ? edgeH*(0.85+rnd()*.15) : minH+rnd()*(maxH-minH);
    const hw=step*(edge?0.95:0.7);
    // a pine: three stacked tiers
    d+=` L${(cx-hw).toFixed(1)} 100 L${(cx-hw*.55).toFixed(1)} ${(100-h*.45).toFixed(1)} L${(cx-hw*.75).toFixed(1)} ${(100-h*.42).toFixed(1)}`
      +` L${(cx-hw*.35).toFixed(1)} ${(100-h*.75).toFixed(1)} L${(cx-hw*.5).toFixed(1)} ${(100-h*.72).toFixed(1)} L${cx.toFixed(1)} ${(100-h).toFixed(1)}`
      +` L${(cx+hw*.5).toFixed(1)} ${(100-h*.72).toFixed(1)} L${(cx+hw*.35).toFixed(1)} ${(100-h*.75).toFixed(1)} L${(cx+hw*.75).toFixed(1)} ${(100-h*.42).toFixed(1)}`
      +` L${(cx+hw*.55).toFixed(1)} ${(100-h*.45).toFixed(1)} L${(cx+hw).toFixed(1)} 100`;
  }
  return d+" L400 100 Z";
}
const TREELINE = `<svg class="treeline" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
  <path d="${pinePath(7,15,34,58,70)}" fill="#1b2d46"/>
  <path d="${pinePath(31,9,46,78,98)}" fill="#0d1822"/></svg>`;
const STARS = (()=>{ let s=11; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  return Array.from({length:26},(_,i)=>`<i style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*92).toFixed(1)}%;--t:${(rnd()*3.6).toFixed(1)}s;${rnd()<.25?'width:3px;height:3px;':''}"></i>`).join(""); })();
const BRUSH = `<svg class="brush" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 L0 22 Q14 8 26 20 Q34 4 48 18 Q58 12 66 24 Q80 14 92 26 L110 30 Q124 22 136 32 L270 34 Q286 22 300 30 Q312 14 326 22 Q336 6 350 18 Q362 10 372 22 Q386 8 400 18 L400 40 Z" fill="#08110e"/></svg>`;
