<meta name="theme-color" content="#0b3b53">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: the sea chart fills the screen edge to edge; a see-through fleet bar floats on top and a compact order dock sits in the thumb zone. One dark-sea look, no theme switch. */
[hidden]{display:none!important}
:root{
 --navy:#0b3b53;--navy-2:#082b3d;--glass:rgba(6,28,41,.82);--paper:#f4e9cc;--paper-2:#e7d8b2;--ink:#1d2a31;--ink-2:#5c5a49;
 --gold:#f2c46b;--verm:#e4572e;--good:#45ad63;--warn:#e3a52a;--bad:#d9493c;
 --f-chart:"IM Fell English SC","Iowan Old Style",Georgia,serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
 --dockH:66px;color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);color:var(--paper);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* the play screen never pinch-zooms the page: a pinch anywhere on it is the game's camera */
#top,#dock,#hint,#banner,#note,#sign,#top *,#dock *{touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* fleet bar */
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 10px;pointer-events:none;background:linear-gradient(rgba(4,22,33,.62),rgba(4,22,33,0))}
#top>*{pointer-events:auto}
.round{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(244,233,204,.32);background:rgba(6,28,41,.62);display:grid;place-items:center;flex:none;padding:0}
.round svg{width:20px;height:20px}
#fleets{flex:1;display:flex;justify-content:center;align-items:center;gap:5px;min-width:0;min-height:44px;background:none;border:0;padding:0;color:inherit;font:inherit}
.chip{position:relative;display:flex;align-items:center;gap:3px;height:34px;padding:0 9px 0 2px;border-radius:17px;background:rgba(6,28,41,.66);border:1.5px solid rgba(255,255,255,.1);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;transition:transform .25s,box-shadow .25s,opacity .25s}
.chip img{width:30px;height:30px;margin-top:-4px}
.chip.on{transform:scale(1.1);box-shadow:0 0 0 2px var(--c,#fff),0 0 14px var(--c,#fff)}
.chip.out{opacity:.32;filter:grayscale(1)}
.chip b{font-weight:900}
#fleets.tight{gap:6px}
#fleets.tight .chip{padding:0;width:38px;justify-content:center}
#fleets.tight .chip b{position:absolute;right:-6px;bottom:-5px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--c);color:var(--k);font-size:11.5px;line-height:18px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.55)}
#side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;min-width:58px}
.srow{display:flex;align-items:center;gap:8px}
#chest{position:relative;display:flex;align-items:center;gap:4px;height:26px;padding:0 7px 0 5px;border-radius:10px;border:1.5px solid rgba(255,255,255,.1);background:rgba(6,28,41,.66);font:900 13px var(--f-ui);color:var(--paper);font-variant-numeric:tabular-nums;transition:box-shadow .3s,background .3s}
#chest svg{width:19px;height:15px}
#chest::after{content:"";position:absolute;inset:-9px -4px}
#chest.ready{background:rgba(242,196,107,.22);border-color:var(--gold);box-shadow:0 0 10px rgba(242,196,107,.55)}
#chest.pop{animation:chestPop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes chestPop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
.slots{display:flex;justify-content:center;gap:14px;margin:4px 0}
.slots span{width:58px;height:48px;border-radius:12px;display:grid;place-items:center;background:rgba(120,90,40,.12);box-shadow:inset 0 0 0 2px rgba(120,90,40,.25)}
.slots span svg{width:40px;height:32px}
.slots span.off svg{opacity:.18;filter:grayscale(1)}
.slots span.new{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(242,196,107,.6)}
#turnL{font-weight:900;font-size:14px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#chainsBtn{position:relative;border:0;background:rgba(6,28,41,.66);border-radius:10px;font-size:13px;font-weight:800;padding:5px 10px;min-height:30px;border:1.5px solid rgba(255,255,255,.1)}
#chainsBtn::after{content:"";position:absolute;inset:-8px -6px}
#chainsBtn[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
/* hint: floats over the sea just above the orders bar, and fades after a few seconds */
#hint{position:fixed;left:50%;bottom:calc(var(--dockH) + 8px);transform:translateX(-50%);z-index:5;box-sizing:border-box;background:rgba(6,28,41,.82);border:1px solid rgba(244,233,204,.18);color:var(--paper);padding:5px 13px;border-radius:14px;font-size:14px;font-weight:800;line-height:1.3;text-align:center;width:max-content;max-width:min(calc(100vw - 24px),440px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .5s,background .25s;pointer-events:none}
#hint.coach{background:var(--paper);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:nudge 1.6s ease-in-out infinite}
#hint:empty,#hint.off{opacity:0}
#hint.up{bottom:calc(var(--dockH) + 108px)}
@keyframes nudge{0%,100%{transform:translateX(-50%)}50%{transform:translate(-50%,-3px)}}
/* orders bar: one slim row in the thumb zone; buttons appear only when they do something */
/* the command card: floats clear of the screen edge; row one says where you are, row two is what you can do */
#dock{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;max-width:520px;margin:0 auto;box-sizing:border-box;border-radius:22px;padding:10px 12px 12px;background:rgba(7,30,44,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(244,233,204,.16);box-shadow:0 12px 30px rgba(0,0,0,.42);display:flex;flex-direction:column;gap:9px}
.r1{display:flex;align-items:center;gap:8px;height:26px;margin:0 2px 0 4px}
.r2{display:flex;align-items:center;gap:10px;height:54px}
#dLine{flex:1;min-width:0;margin-left:4px;font-weight:800;font-size:13px;line-height:1.35;color:rgba(244,233,204,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#dLine .dim{font-weight:700;opacity:.8}
#dLine:empty,#dock.two #dLine,#dock.sl #dLine{display:none}
#dock.two .btn,#dock.solo .btn{flex:1}
.lnk{position:relative;flex:none;height:30px;border:1.5px solid rgba(244,233,204,.35);border-radius:15px;background:rgba(244,233,204,.08);padding:0 12px;font:800 13.5px var(--f-ui);color:var(--paper);white-space:nowrap}
.lnk::after{content:"";position:absolute;inset:-8px -6px}
.lnk.warn{color:#ffb39c}
.lnk.glow{color:var(--gold)}

#dIcon{display:none;width:24px;height:24px;flex:none;margin:-4px -2px 0 -2px}
#dock.rv #dIcon{display:block}

#dTitle{font-family:var(--f-chart);font-size:19px;line-height:1;letter-spacing:.02em;white-space:nowrap;flex:none}
#dInfo{flex:1;min-width:0;font-weight:800;font-size:13.5px;color:rgba(244,233,204,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#dInfo b{color:var(--gold);font-weight:900}
#dInfo:empty{display:none}
@media (max-width:350px){.hero canvas{width:86px;height:99px}}
.btn{min-height:54px;height:54px;border-radius:16px;padding:0 16px;min-width:104px;font:900 17px var(--f-ui);border:2px solid rgba(244,233,204,.5);background:rgba(255,255,255,.05);color:var(--paper);touch-action:manipulation;transition:transform .08s,opacity .2s;flex:none;white-space:nowrap}
.btn.pri{min-width:96px;border:0;color:#fff;background:linear-gradient(#f2703f,#d5461d);box-shadow:inset 0 -4px 0 rgba(0,0,0,.24),0 6px 16px rgba(228,87,46,.4);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.pri.warn{background:#f4e9cc;color:#8a2a12;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);text-shadow:none}
.btn.pri.sec{background:rgba(255,255,255,.05);border:2px solid rgba(244,233,204,.5);color:var(--paper);box-shadow:none;text-shadow:none}
.btn:active{transform:translateY(2px) scale(.98)}
.btn:disabled{opacity:.32;transform:none}
.btn.glow{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.24),0 0 0 0 rgba(242,196,107,.0)}50%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.24),0 0 0 5px rgba(242,196,107,.75)}}
#range{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
#range input{flex:1;min-width:0;accent-color:var(--verm);height:34px;margin:0}
#rangeV{display:none}
.btn.ico{min-width:46px;width:46px;padding:0;font-size:19px}
.sq{width:44px;height:44px;border-radius:12px;border:2px solid rgba(244,233,204,.5);background:transparent;font:900 22px var(--f-ui);flex:none;padding:0;line-height:1}
/* turn banner */
#banner{position:fixed;left:0;right:0;top:34%;z-index:8;display:flex;justify-content:center;pointer-events:none}
.rib{display:flex;align-items:center;gap:12px;padding:10px 26px 10px 14px;background:linear-gradient(90deg,rgba(244,233,204,0),var(--paper) 12%,var(--paper) 88%,rgba(244,233,204,0));color:var(--ink);min-width:min(86vw,360px);justify-content:center;animation:rib 1.5s cubic-bezier(.2,.8,.2,1) forwards}
.rib img{width:54px;height:54px;margin:-14px 0 -8px}
.rib b{display:block;font-family:var(--f-chart);font-weight:400;font-size:30px;line-height:1}
.rib small{display:block;font-weight:800;font-size:14.5px;line-height:1.35;color:var(--ink-2);margin-top:4px;max-width:250px}
@keyframes rib{0%{transform:translateX(-110%);opacity:0}18%{transform:translateX(0);opacity:1}78%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0}}
/* notes and signs */
#note{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translate(-50%,-8px);z-index:7;box-sizing:border-box;width:max-content;max-width:min(calc(100vw - 24px),420px);background:rgba(6,28,41,.88);border:1px solid rgba(244,233,204,.2);border-radius:14px;padding:8px 13px;font-size:14px;font-weight:700;line-height:1.35;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center}
#note.on{opacity:1;transform:translate(-50%,0)}
#note b{color:var(--gold)}
#note small{display:block;margin-top:3px;font-size:13px;color:rgba(244,233,204,.75)}
#sign{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:9;pointer-events:none;width:min(92vw,400px);box-sizing:border-box;background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 15px 12px;box-shadow:0 12px 32px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:3px;font-size:14.5px;line-height:1.4;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
#sign b{font-family:var(--f-chart);font-weight:400;font-size:21px}
#sign small{color:var(--ink-2);font-size:13px;font-weight:700}
@keyframes pop{0%{transform:translateX(-50%) scale(.85);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
/* cards */
#modal{position:fixed;inset:0;z-index:20;background:rgba(3,18,27,.5);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);box-sizing:border-box}
#modal.title{background:linear-gradient(rgba(3,18,27,.15),rgba(3,18,27,.55));align-items:stretch;padding:0}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;color:var(--ink);border-radius:20px;padding:20px 18px 16px;
 background:radial-gradient(120% 80% at 50% 0%,#fbf3dc,var(--paper) 60%,#eadcb6);box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 1.5px rgba(120,90,40,.25);display:flex;flex-direction:column;gap:10px;animation:cardIn .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes cardIn{0%{transform:translateY(18px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
.card h2{margin:0;font-family:var(--f-chart);font-weight:400;font-size:32px;line-height:1.02;text-wrap:balance}
.card p{margin:0;font-size:15px;line-height:1.45}
.kick{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.sub{color:var(--ink-2)}
.cbtn{min-height:52px;width:100%;border-radius:15px;font:900 17px var(--f-ui);border:2px solid var(--ink);background:transparent;color:var(--ink)}
.cbtn.pri{border:0;color:#fff;background:linear-gradient(#f2703f,#d5461d);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 6px 16px rgba(228,87,46,.35)}
.cbtn.danger{border-color:var(--bad);color:var(--bad)}
.cbtn:active{transform:translateY(2px)}
.mini{width:100%;height:150px;border-radius:14px;display:block;background:#145a77;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.15)}
.rv{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.35}
.rv img{width:40px;height:40px;flex:none;margin:-4px 0}
.rv b{font-weight:900}
.tip{background:rgba(120,90,40,.1);border-radius:12px;padding:10px 12px;font-size:14.5px}
.links{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{color:var(--ink);font-weight:900;text-decoration:none;padding:0 2px;min-height:44px;display:inline-flex;align-items:center;background:none;border:0;font-size:15px}
.link.home{color:var(--ink-2)}
.big-stars{display:flex;justify-content:center;gap:10px;font-size:46px;line-height:1;color:#c8901a}
.big-stars span{display:inline-block;animation:star .5s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.big-stars .off{color:rgba(0,0,0,.14)}
@keyframes star{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;border:0;border-radius:13px;background:rgba(120,90,40,.1);padding:6px 12px;text-align:left;color:var(--ink);font-weight:900}
.sw small{display:block;font-weight:700;color:var(--ink-2);font-size:13px}
.sw .t{width:44px;height:26px;border-radius:13px;background:#b9ad8f;position:relative;flex:none;transition:background .2s}
.sw .t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked="true"] .t{background:var(--good)}
.sw[aria-checked="true"] .t::after{transform:translateX(18px)}
.seg{display:flex;gap:6px}
.seg .cbtn{flex:1;min-height:44px;font-size:14px;padding:0 6px}
.seg .cbtn.on{background:var(--ink);color:var(--paper)}
.lbl{font-weight:900;font-size:14px;margin-top:4px}
.lbl small{display:block;font-weight:700;color:var(--ink-2);font-size:13px}
.fr{display:grid;grid-template-columns:40px 1fr;gap:3px 10px;align-items:center;font-size:14px;line-height:1.3}
.fr img{width:40px;height:40px;margin:-4px 0;grid-row:span 2}
.fr b{display:block;font-weight:900}
.fr small{display:block;color:var(--ink-2);font-weight:700;font-size:13px}
.fr i{display:block;height:7px;border-radius:4px;background:var(--c);min-width:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.fr.out{opacity:.45}
.log{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.4}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:1.42}
.phead{display:flex;align-items:center;gap:10px}
.phead .cbtn{width:auto;min-height:40px;padding:0 12px;font-size:15px}
/* title screen */
.tscreen{width:100%;max-width:460px;margin:0 auto;height:100%;overflow:auto;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;color:var(--paper)}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-top:4px}
.hero canvas{width:104px;height:120px;animation:bob 2.4s ease-in-out infinite;flex:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
.htext{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.htext h1{margin:0;font-family:var(--f-chart);font-weight:400;font-size:clamp(30px,10.6vw,46px);line-height:.95;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.35)}
.htext p{margin:6px 0 0;font-weight:800;font-size:15px;color:rgba(244,233,204,.9)}
.tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid rgba(244,233,204,.55);color:rgba(244,233,204,.85);border-radius:20px;padding:2px 9px;margin-bottom:6px}
.tscreen .kick{color:rgba(244,233,204,.75);margin-top:4px}
.ccard{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:10px;text-align:left;color:var(--ink);background:radial-gradient(120% 90% at 30% 0%,#fbf3dc,var(--paper) 60%,#e8d9b3);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.ccard:disabled{filter:saturate(.3) brightness(.8);opacity:.85}
.ccard canvas{width:84px;height:84px;border-radius:12px;flex:none;background:#145a77}
.ccard .ci{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ccard b{font-family:var(--f-chart);font-weight:400;font-size:22px;line-height:1.05}
.ccard small{font-weight:700;font-size:13.5px;color:var(--ink-2)}
.ccard .riv{display:flex;gap:0;margin-top:2px}
.ccard .riv img{width:30px;height:30px;margin-right:-4px}
.ccard .st{font-size:17px;color:#c8901a;letter-spacing:1px;white-space:nowrap;align-self:flex-start;margin-top:4px}
.ccard .st .off{color:rgba(0,0,0,.15)}
.ccard .lock{font-size:12px;font-weight:800;color:var(--ink-2);align-self:center;max-width:72px;text-align:right}
.tlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:2px}
.tlinks .link{color:var(--paper)}

/* dice: every outcome of (attack dice, defence dice, fort) worked out once */
const DIST={};
(function(){for(let a=1;a<=3;a++)for(let d=1;d<=2;d++)for(const f of [0,1]){const o={};let n=0;
 const rec=(arr,k,cb)=>{if(!k){cb(arr);return;}for(let v=1;v<=6;v++)rec(arr.concat(v),k-1,cb);};
 rec([],a,A=>rec([],d,D=>{const As=[...A].sort((x,y)=>y-x),Ds=[...D].sort((x,y)=>y-x);if(f)Ds[0]+=1;let al=0,dl=0;
  for(let i=0;i<Math.min(a,d);i++){if(As[i]>Ds[i])dl++;else al++;}const k=al+','+dl;o[k]=(o[k]||0)+1;n++;}));
 DIST[a+'|'+d+'|'+f]=Object.entries(o).map(([k,v])=>{const [al,dl]=k.split(',').map(Number);return [al,dl,v/n];});}})();
/* chance a Blitz takes the island: a = attackers able to roll (troops on the island minus the one that stays), d = defenders */
const PT=new Map();
function pTake(a,d,fort){if(d<=0)return 1;if(a<=0)return 0;const key=a*4096+d*2+(fort?1:0);let v=PT.get(key);if(v!==undefined)return v;
 v=0;for(const [al,dl,p] of DIST[Math.min(3,a)+'|'+Math.min(2,d)+'|'+(fort?1:0)])v+=p*pTake(a-al,d-dl,fort);PT.set(key,v);return v;}

/* seeded dice: mulberry32, state kept in the game so a reload never re-rolls */
function rng01(st){let t=(st.rs=(st.rs+0x6D2B79F5)>>>0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const die=st=>1+Math.floor(rng01(st)*6);

 const st={v:1,c:ci,mode:m,own:new Array(n).fill(-1),tr:new Array(n).fill(RULES.neutral[m]||3),fl:c.fleets.slice(),alive:c.fleets.map(()=>true),
  spoils:c.fleets.map(()=>0),cash:0,cashF:c.fleets.map(()=>0),turn:1,cur:0,phase:'reinforce',pool:0,placed:[],conq:false,moved:false,rs:(seed>>>0)||1,
  stats:{taken:0,lost:0,battles:0,best:0}};
 c.fleets.forEach((k,f)=>{const s=c.start[k];st.own[s.h]=f;st.tr[s.h]=RULES.harbour0+(f===0?(c.p0||0):0);for(const i of s.f){st.own[i]=f;st.tr[i]=RULES.first0;}});

const fortAt=(st,i)=>isHarb(st,i);   /* a harbour's fort helps whoever holds it */
const count=(st,f)=>{let k=0;for(const o of st.own)if(o===f)k++;return k;};
function chainHeld(st,f,ch){const c=chartOf(st);return c.isl.every((s,i)=>s.ch!==ch||st.own[i]===f);}
