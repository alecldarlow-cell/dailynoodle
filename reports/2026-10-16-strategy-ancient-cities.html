<style>
:root{--ink:#3a2a1e;--ink2:#6b5442;--paper:#fff8ea;--paper2:#f6ead2;--line:#e2cfa9;--terra:#c65a33;--terra2:#a9461f;--jade:#1f9c7a;--lake:#5cc3cc;
 --p0:#e5583a;--p1:#2f62d4;--p2:#8b53c6;--gold:#e7b53c;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'Cinzel',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f5eee0;color:var(--ink);font-family:var(--ui);overscroll-behavior:none}
body{position:fixed;inset:0}
#app{position:absolute;inset:0;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.ib{width:44px;height:44px;border-radius:14px;background:rgba(255,248,234,.94);box-shadow:0 2px 8px rgba(40,60,70,.18);display:grid;place-items:center}
.ib svg{width:22px;height:22px}
/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 8px) 10px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
#score{flex:1;display:flex;gap:6px;justify-content:center;min-width:0;padding-right:44px}
.pl{display:flex;align-items:center;gap:6px;background:rgba(255,248,234,.95);border-radius:14px;padding:6px 10px 6px 8px;box-shadow:0 2px 8px rgba(40,60,70,.16);min-width:0;border:2px solid transparent;transition:border-color .2s}
.pl i{width:12px;height:12px;border-radius:50%;flex:none}
.pl b{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}
.pl span{font-weight:900;font-size:18px;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.pl.on{border-color:currentColor}
.pl.p0{color:var(--p0)}.pl.p1{color:var(--p1)}.pl.p2{color:var(--p2)}
.pl.p0 i{background:var(--p0)}.pl.p1 i{background:var(--p1)}.pl.p2 i{background:var(--p2)}
.pl b,.pl span{color:var(--ink)}
.three{padding-right:0!important}.three .pl{padding:5px 7px;gap:4px}.three .pl b{max-width:38px;font-size:12px;text-overflow:clip}.three .pl span{font-size:16px}
#bag{display:flex;align-items:center;gap:3px;padding:0 4px 0 6px;margin-left:2px;border-left:1px solid var(--line);font-weight:900;font-size:15px;height:28px;color:var(--ink2)}
#bag svg{width:18px;height:18px}
#mkt{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 60px);display:flex;gap:6px;align-items:center;background:rgba(255,248,234,.94);border-radius:16px;padding:4px 6px 4px 10px;box-shadow:0 2px 8px rgba(40,60,70,.16)}
#mkt.fixed .mk{background:#efe6d2}
#mkt .ml{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;margin-right:2px}
.mk{display:flex;align-items:center;gap:3px;padding:2px 7px 2px 3px;border-radius:12px;background:var(--paper2);position:relative;transition:background .3s}
.mk canvas{width:24px;height:24px}
.mk b{font-size:18px;font-weight:900;min-width:12px;text-align:center;font-variant-numeric:tabular-nums}
.mk em{position:absolute;right:-3px;top:-6px;font-style:normal;font-size:11px;font-weight:900;padding:0 4px;border-radius:8px;opacity:0;transition:opacity .3s}
.mk em.up{background:#2e9d5b;color:#fff;opacity:1}.mk em.dn{background:var(--terra);color:#fff;opacity:1}
.mk.flash{background:#ffe7a8}
.mk.off{display:none}
#bFit{position:absolute;right:10px;width:44px;height:44px;border-radius:13px}
#bFit svg{width:20px;height:20px}
/* ---------- banner / info ---------- */
.card{background:rgba(255,248,234,.97);border-radius:18px;box-shadow:0 6px 22px rgba(30,50,60,.22);border:1px solid var(--line)}
#banner{position:absolute;left:12px;right:12px;margin:0 auto;max-width:440px;padding:12px 40px 12px 14px;top:calc(var(--safe-t) + 104px)}
#banner h3{margin:0 0 2px;font-family:var(--disp);font-size:17px;letter-spacing:.02em}
#banner p{margin:4px 0 0;font-size:14px;line-height:1.35;color:var(--ink2);font-weight:700}
#banner .x{position:absolute;right:2px;top:2px;width:44px;height:44px;font-size:22px;color:var(--ink2)}
#banner .rv{font-weight:800;color:var(--ink)}
#info{position:absolute;left:10px;right:10px;margin:0 auto;max-width:440px;padding:10px 12px;bottom:calc(var(--safe-b) + 128px)}
#info .f{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
#info .f+.f{border-top:1px solid var(--line)}
#info .ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:900}
#info .t{font-size:13.5px;line-height:1.35;font-weight:700;color:var(--ink2)}
#info .t b{color:var(--ink);font-weight:900}
.own{display:inline-flex;gap:8px;margin-top:2px}.own span{font-weight:900}
/* ---------- tray ---------- */
#tray{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(var(--safe-b) + 10px);pointer-events:none}
#tray .wrap{max-width:460px;margin:0 auto;pointer-events:auto;background:rgba(255,248,234,.96);border-radius:22px 22px 18px 18px;box-shadow:0 -2px 18px rgba(30,50,60,.2);padding:6px 8px 8px}
#prev{min-height:22px;font-size:13.5px;font-weight:800;text-align:center;color:var(--ink2);padding:2px 4px 5px;line-height:1.25}
#prev .g{color:var(--p0)}#prev .r{color:var(--p1)}#prev .r2{color:var(--p2)}
#prev .k{color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
.slot{width:68px;height:68px;border-radius:14px;background:var(--paper2);display:grid;place-items:center;position:relative;transition:transform .15s,box-shadow .15s,opacity .2s;box-shadow:inset 0 0 0 2px var(--line)}
.slot canvas{width:58px;height:58px;border-radius:8px}
.slot.sel{box-shadow:inset 0 0 0 3px var(--p0),0 4px 12px rgba(229,88,58,.35);transform:translateY(-3px)}
.slot.rv{box-shadow:inset 0 0 0 3px var(--p1),0 4px 12px rgba(47,98,212,.35)}
.slot.rv2{box-shadow:inset 0 0 0 3px var(--p2),0 4px 12px rgba(139,83,198,.35)}
.slot.empty{opacity:.25}
.slot:disabled{cursor:default}
.acts{display:flex;gap:6px;margin-left:4px}
.ab{width:54px;height:68px;border-radius:14px;display:grid;place-items:center;font-weight:900;transition:opacity .2s,transform .1s}
.ab svg{width:26px;height:26px}
.ab:active{transform:scale(.95)}
#bRot{background:var(--paper2);box-shadow:inset 0 0 0 2px var(--line)}
#bOk{background:var(--jade);color:#fff;box-shadow:0 3px 0 #157559}
.ab:disabled{opacity:.3;cursor:default}
/* ---------- screens ---------- */
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#home{background:linear-gradient(180deg,rgba(243,236,220,0) 0%,rgba(243,236,220,0) 46%,rgba(243,236,220,.92) 52%,#f3ecdc 58%) local}
.hwrap{max-width:460px;margin:0 auto;padding:0 16px calc(var(--safe-b) + 24px)}
.htop{min-height:52vh;display:flex;flex-direction:column;justify-content:flex-start;padding-top:calc(var(--safe-t) + 22px);text-align:center}
.htop h1{font-family:var(--disp);font-weight:700;font-size:38px;line-height:1.05;margin:0;color:var(--ink);letter-spacing:.03em}
.htop h1 em{display:block;font-style:normal;font-size:.42em;letter-spacing:.32em;color:var(--terra);margin-bottom:6px}
.htop .sub{margin:8px auto 0;display:inline-block;font-weight:800;font-size:14px;color:var(--ink2)}
.htop .sub b{color:#157559}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:76px;border-radius:22px;background:var(--terra);color:#fff;font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--terra2),0 10px 24px rgba(160,70,30,.3);letter-spacing:.01em}
.big small{display:block;font-size:13px;font-weight:800;opacity:.9;margin-top:1px}
.big:active{transform:translateY(2px);box-shadow:0 3px 0 var(--terra2)}
.seg{display:flex;background:var(--paper2);border-radius:14px;padding:4px;gap:4px;margin-top:18px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;height:44px;border-radius:11px;font-weight:900;font-size:15px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(80,50,20,.15)}
.dnote{font-size:13px;color:var(--ink2);font-weight:700;text-align:center;margin:8px 4px 0;min-height:18px}
h2.lh{font-family:var(--disp);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
h2.lh:after{content:'';flex:1;height:1px;background:var(--line)}
.lv{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border-radius:16px;background:#fff;margin-bottom:8px;text-align:left;box-shadow:0 1px 0 var(--line),0 2px 8px rgba(80,50,20,.06)}
.lv .num{width:34px;height:34px;border-radius:11px;background:var(--paper2);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:16px;flex:none;color:var(--terra)}
.lv .nm{flex:1;min-width:0}
.lv .nm b{display:block;font-size:16px;font-weight:900}
.lv .nm span{display:block;font-size:12.5px;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{font-size:17px;letter-spacing:1px;color:#d9c7a4;white-space:nowrap}.stars i{font-style:normal;color:var(--gold)}
.lv.lock{opacity:.62;background:var(--paper2)}
.lv.grand .num{background:var(--jade);color:#fff}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{height:44px;padding:0 14px;border-radius:12px;background:#fff;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 0 var(--line);color:var(--ink);text-decoration:none}
.chip.off{color:#7f6f5c}
.back{display:block;text-align:center;margin-top:16px;font-weight:800;color:var(--terra2);text-decoration:none;font-size:15px;padding:13px 12px;min-height:44px}
/* modal */
#modal{background:rgba(30,60,70,.42);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 14px) 14px calc(var(--safe-b) + 14px)}
#modal[hidden]{display:none}
.mbox{width:100%;max-width:420px;max-height:100%;overflow-y:auto;padding:18px 18px 16px;margin:auto}
.mbox h2{font-family:var(--disp);margin:0 0 4px;font-size:24px;text-align:center}
.mbox .lead{text-align:center;color:var(--ink2);font-weight:700;margin:0 0 12px;font-size:14.5px}
.mbtn{display:block;width:100%;height:52px;border-radius:15px;background:var(--paper2);font-weight:900;font-size:16px;margin-top:8px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);text-align:center;line-height:52px;text-decoration:none}
.mbtn.pri{background:var(--terra);color:#fff;box-shadow:0 4px 0 var(--terra2)}
.mbtn.jd{background:var(--jade);color:#fff;box-shadow:0 4px 0 #157559}
.mrow{display:flex;gap:8px}.mrow .mbtn{flex:1}
.tg{display:flex;justify-content:space-between;align-items:center;min-height:48px;font-weight:800;border-top:1px solid var(--line);padding:0 2px}
.tg button{width:56px;height:32px;border-radius:999px;background:#d8c9ab;position:relative;transition:background .2s}
.tg button:before{content:'';position:absolute;inset:-8px -6px}   /* 44px+ touch area round the switch */

<script>
/* ================= Ancient Cities — rules engine (no DOM) ================= */
const AC=(function(){
'use strict';
const DX=[0,1,0,-1],DY=[-1,0,1,0];           // sides: 0 N, 1 E, 2 S, 3 W
const GOODS=['m','c','j'];                     // slot ids; a city names and draws them
function mulberry(a){a>>>=0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---- tile types: e = edges N,E,S,W (W water, G garden, C causeway); segs in canonical sides ---- */
const T={
 cap:       {e:'GWWW',segs:[{k:'G',s:[0],n:1}]},
 capRoad:   {e:'GCWC',segs:[{k:'G',s:[0],n:1},{k:'C',s:[1,3]}]},
 capCurveR: {e:'GCCW',segs:[{k:'G',s:[0],n:1},{k:'C',s:[1,2]}]},
 capCurveL: {e:'GWCC',segs:[{k:'G',s:[0],n:1},{k:'C',s:[2,3]}]},
 capGate:   {e:'GWCW',segs:[{k:'G',s:[0],n:1},{k:'C',s:[2],end:'gate'}]},
 capsOpp:   {e:'GWGW',segs:[{k:'G',s:[0],n:1},{k:'G',s:[2],n:1}]},
 capsAdj:   {e:'GGWW',segs:[{k:'G',s:[0],n:1},{k:'G',s:[1],n:1}]},
 corner:    {e:'GGWW',segs:[{k:'G',s:[0,1],n:2}]},
 cornerRoad:{e:'GGCC',segs:[{k:'G',s:[0,1],n:1},{k:'C',s:[2,3]}]},
 band:      {e:'GWGW',segs:[{k:'G',s:[0,2],n:2}]},
 three:     {e:'GGGW',segs:[{k:'G',s:[0,1,2],n:2}]},
 threeGate: {e:'GGGC',segs:[{k:'G',s:[0,1,2],n:2},{k:'C',s:[3],end:'gate'}]},
 full:      {e:'GGGG',segs:[{k:'G',s:[0,1,2,3],n:3}]},
 straight:  {e:'WCWC',segs:[{k:'C',s:[1,3]}]},
 curve:     {e:'WWCC',segs:[{k:'C',s:[2,3]}]},
 tee:       {e:'WCCC',ctr:'plaza',segs:[{k:'C',s:[1],end:'plaza'},{k:'C',s:[2],end:'plaza'},{k:'C',s:[3],end:'plaza'}]},
 cross:     {e:'CCCC',ctr:'plaza',segs:[{k:'C',s:[0],end:'plaza'},{k:'C',s:[1],end:'plaza'},{k:'C',s:[2],end:'plaza'},{k:'C',s:[3],end:'plaza'}]},
 pyr:       {e:'WWWW',ctr:'pyr',segs:[]},
 pyrRoad:   {e:'WWCW',ctr:'pyr',segs:[{k:'C',s:[2],end:'pyr'}]},
 lake:      {e:'WWWW',ctr:'lake',segs:[]},
 market:    {e:'WWWW',ctr:'market',segs:[]},
 ward:      {e:'XXXX',ctr:'ward',segs:[]},     // walled ward: fits any edge; ends roads at its gates, closes gardens against its wall
 marketRoad:{e:'WCWC',ctr:'market',segs:[{k:'C',s:[1],end:'market'},{k:'C',s:[3],end:'market'}]}
};

/* ---- levels (shared by every city; a city supplies names and art) ---- */
const B1={cap:10,capsOpp:3,capsAdj:3,corner:6,band:4,three:5,full:1,lake:4};
const B2={cap:6,capsOpp:2,capsAdj:2,corner:3,band:2,three:2,full:1,lake:1,straight:4,curve:4,capRoad:3,capCurveR:2,capCurveL:2,cornerRoad:2,threeGate:2,capGate:2};
const B3=Object.assign({},B2,{cap:5,lake:0,curve:3,band:1,pyr:2,pyrRoad:2});
const B5=Object.assign({},B3,{straight:3,cap:4,tee:3,cross:1});
const B6=Object.assign({},B5,{cap:6,corner:4,three:3,straight:4,pyr:3});
const B7=Object.assign({},B6,{cap:8,corner:5,band:2,three:4,capRoad:4,curve:4,pyr:4,tee:4,capsOpp:3,full:2,capGate:3});
function scaleBag(b,n){ // keep the mix, change the size (largest remainder)
 const tot=Object.values(b).reduce((a,v)=>a+v,0),o={},rem=[];let got=0;
 for(const k in b){const x=b[k]*n/tot,f=Math.floor(x);o[k]=f;got+=f;rem.push([x-f,k]);}
 rem.sort((a,c)=>c[0]-a[0]);for(let i=0;got<n;i++,got++)o[rem[i%rem.length][1]]++;return o;}
/* Islands: three sizes, all 2:3 portrait like a phone's play area, each about 80% filled by its bag. */
const ISLAND={S:{n:'Small',lim:[4,6],tiles:19,wards:1,mins:3},M:{n:'Medium',lim:[6,9],tiles:43,wards:3,mins:7},L:{n:'Large',lim:[8,12],tiles:76,wards:5,mins:12}};
const SIZES=['S','S','M','M','M','M','M','M'];
function withWards(b,n){b=Object.assign({},b);for(let i=0;i<n;i++){let k=null;for(const t in b)if(t!=='ward'&&(!k||b[t]>b[k]))k=t;b[k]--;b.ward=(b.ward||0)+1;}return b;}
/* Bags tuned for finished cities (see sim): more garden closers, more road ends, fewer pure extenders, plus wards. */
function tuneBag(b,n){b=Object.assign({},b);const m=Object.values(b).reduce((a,v)=>a+v,0);
 b.cap=(b.cap||0)+Math.round(m*.12);b.capsOpp=(b.capsOpp||0)+1;if(b.three>1)b.three--;if(b.band>1)b.band--;
 if(b.straight||b.curve){let k=0;for(const t of['straight','curve','capRoad'])if(b[t]>1){b[t]--;k++;}b.capGate=(b.capGate||0)+Math.ceil(k/2);if(b.pyrRoad!=null)b.pyrRoad++;else b.threeGate=(b.threeGate||0)+1;}
 return scaleBag(b,n);}
const WB=(b,z)=>withWards(tuneBag(b,ISLAND[z].tiles),ISLAND[z].wards);
const LEVELS=[
 {size:SIZES[0],bag:WB(B1,SIZES[0]),goods:2,start:'market',market:false,lim:null},     // First Gardens: fixed prices
 {size:SIZES[1],bag:WB(B1,SIZES[1]),goods:2,start:'market',market:true,lim:null},      // Market Day: prices move
 {size:SIZES[2],bag:WB(B2,SIZES[2]),goods:3,start:'marketRoad',market:true,lim:null},
 {size:SIZES[3],bag:WB(B3,SIZES[3]),goods:3,start:'marketRoad',market:true,lim:null},
 {size:SIZES[4],bag:WB(B3,SIZES[4]),goods:3,start:'marketRoad',market:true,docks:.3,lim:null},
 {size:SIZES[5],bag:WB(B5,SIZES[5]),goods:3,start:'marketRoad',market:true,docks:.25,lim:null},
 {size:SIZES[6],bag:WB(B6,SIZES[6]),goods:3,start:'marketRoad',market:true,docks:.25,lim:null},
 {size:'M',pick:true,bags:{S:WB(B7,'S'),M:WB(B7,'M'),L:WB(B7,'L')},bag:WB(B7,'M'),goods:3,start:'marketRoad',market:true,docks:.25,players:3,lim:null}   // Grand Market: the player picks the island
];
const DIRECTOR={on:0,win:6,lateWin:14,lateAt:.6,str:.7,close:2.2,snug:.7,hole:1.6,late:1.4,shape:1};
const CLOSER={ward:1.3,cap:1,capsOpp:1,capsAdj:1,capGate:1,pyrRoad:.6,tee:.8,cross:.8,lake:.5,pyr:.3};
const RULES={start:[3,4,5],lo:1,hi:6,drop:1,bigDrop:4,rise:1,revert:1,lmBonus:3,pyrVal:9,dockBonus:1};

function bagOf(lv,isl){const L=LEVELS[lv];return L.bags&&isl&&L.bags[isl]?L.bags[isl]:L.bag;}
function islandOf(lv,isl){const L=LEVELS[lv];return L.pick&&isl&&ISLAND[isl]?isl:L.size;}
function starTh(lv,diff,isl){const u=bagSize(lv,isl)/40,b={calm:[20,40],fair:[10,25],sharp:[6,18]}[diff]||[10,25];return [1,Math.round(b[0]*u),Math.round(b[1]*u)];}
function starsFor(lv,diff,m,isl){const t=starTh(lv,diff,isl);return m>=t[2]?3:m>=t[1]?2:m>=t[0]?1:0;}
function headStart(lv,isl){return Math.round(Math.min(10,10*bagSize(lv,isl)/40));}
function bagSize(lv,isl){const b=bagOf(lv,isl);let n=0;for(const k in b)n+=b[k];return n;}

/* ---- deck ---- */
function buildDeck(lv,rnd,isl){
 const L=LEVELS[lv],deck=[],BAG=bagOf(lv,isl);
 const pick=()=>{const r=rnd();if(L.goods===2)return r<.58?'m':'c';return r<.5?'m':r<.82?'c':'j';};
 for(const t in BAG)for(let i=0;i<BAG[t];i++){
  const g=[],d=[];
  const roads=T[t].segs.some(x=>x.k==='C');
  for(const sg of T[t].segs){if(sg.k==='G'){const a=[];for(let k=0;k<sg.n;k++)a.push(pick());a.sort();g.push(a);d.push(L.docks&&!roads&&rnd()<L.docks*1.4?1:0);}else{g.push(null);d.push(0);}}
  deck.push({t,g,d});
 }
 for(let i=deck.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
 if(DIRECTOR.shape){const key=deck.map((x,i)=>i/deck.length+DIRECTOR.shape*((CLOSER[x.t]||0)-.4)*(.6+rnd()*.8));const ord=deck.map((_,i)=>i).sort((a,b)=>key[a]-key[b]);const d2=ord.map(i=>deck[i]);deck.length=0;deck.push(...d2);}   // dealing arc: closers lean towards the back
 deck.forEach((x,i)=>{x.id=i;x.key=x.t+'|'+x.g.map(a=>a?a.join(''):'').join(',')+'|'+x.d.join('');});
 return deck;
}
const edgesOf=(inst,rot)=>{const e=T[inst.t].e,o=[];for(let s=0;s<4;s++)o[(s+rot)%4]=e[s];return o;};
const K=(x,y)=>(x+2048)*4096+(y+2048);

/* ---- match ---- */
function newMatch(lv,seed,opt){
 opt=opt||{};const L=LEVELS[lv],np=L.players||2,rnd=mulberry(seed);
 const isl=islandOf(lv,opt.island);let deck=buildDeck(lv,rnd,isl);
 if(opt.lead){const lead=opt.lead.map((x,i)=>({t:x.t,g:T[x.t].segs.map((sg,k)=>sg.k==='G'?(x.g&&x.g[k]||['m']):null),d:T[x.t].segs.map(()=>0)}));deck=lead.concat(deck.slice(0,Math.max(0,(opt.size||deck.length)-lead.length)));
  deck.forEach((x,i)=>{x.id=i;x.key=x.t+'|'+x.g.map(a=>a?a.join(''):'').join(',')+'|'+x.d.join('');});}
 const st={maxed:[false,false],frame:opt.frame?{x0:-Math.floor((opt.frame[0]-1)/2),y0:-Math.floor((opt.frame[1]-1)/2),w:opt.frame[0],h:opt.frame[1]}:null,island:isl,lim:opt.lim===undefined?ISLAND[isl].lim:opt.lim,lv,seed,np,deck,di:0,drng:mulberry(seed^0x2c1b3c6d),offer:[],turn:0,turnNo:0,over:false,
  scores:new Array(np).fill(0),br:[],prices:RULES.start.slice(),act:[1,1,L.goods>2?1:0],
  tiles:[],grid:new Map(),front:new Set(),par:[],F:[],pyrs:[],moves:[],discards:0,head:opt.head||0,lastSale:null};
 for(let p=0;p<np;p++)st.br.push({G:0,C:0,P:0,E:0,H:0});
 if(st.head){st.scores[0]+=st.head;st.br[0].H=st.head;}
 putTile(st,{t:L.start,g:T[L.start].segs.map(()=>null),d:T[L.start].segs.map(()=>0),id:-1,key:L.start},0,0,0,-1);
 refill(st,[]);
 return st;
}
function find(st,a){const p=st.par;while(p[a]!==a){p[a]=p[p[a]];a=p[a];}return a;}
function union(st,a,b){a=find(st,a);b=find(st,b);if(a===b)return a;const A=st.F[a],Bf=st.F[b];
 if(A.tiles.size<Bf.tiles.size){const t=a;a=b;b=t;}const X=st.F[a],Y=st.F[b];
 for(const t of Y.tiles)X.tiles.add(t);X.open+=Y.open;X.lm+=Y.lm;X.dock+=Y.dock;for(let i=0;i<3;i++)X.goods[i]+=Y.goods[i];
 st.par[b]=a;st.F[b]=null;return a;}
function goodsCount(arr){const g=[0,0,0];if(arr)for(const x of arr)g[GOODS.indexOf(x)]++;return g;}

const inFrame=(st,x,y)=>!st.frame||(x>=st.frame.x0&&y>=st.frame.y0&&x<st.frame.x0+st.frame.w&&y<st.frame.y0+st.frame.h);
const shore=(st,x,y)=>{if(st.frame)return !inFrame(st,x,y);if(!st.lim||!st.bb)return false;const b=st.bb;return (b.x1-b.x0+1>=st.lim[0]&&(x<b.x0||x>b.x1))||(b.y1-b.y0+1>=st.lim[1]&&(y<b.y0||y>b.y1));};
function canPlace(st,inst,x,y,rot){if(!inFrame(st,x,y))return false;
 if(st.grid.has(K(x,y)))return false;if(st.lim&&st.bb){const b=st.bb;if(Math.max(b.x1,x)-Math.min(b.x0,x)+1>st.lim[0]||Math.max(b.y1,y)-Math.min(b.y0,y)+1>st.lim[1])return false;}const e=edgesOf(inst,rot);let n=0;
 for(let s=0;s<4;s++){const ti=st.grid.get(K(x+DX[s],y+DY[s]));if(ti===undefined)continue;n++;
  const a=st.tiles[ti].e[(s+2)%4],b=e[s];if(a!==b&&a!=='X'&&b!=='X')return false;}
 return n>0;
}
function legal(st,inst){const out=[];
 for(const k of st.front){const x=Math.floor(k/4096)-2048,y=k%4096-2048,r=[];
  for(let rot=0;rot<4;rot++)if(canPlace(st,inst,x,y,rot))r.push(rot);
  if(r.length)out.push({x,y,rots:dedupeRots(inst,r)});}
 return out;
}
function dedupeRots(inst,r){ // drop rotations that give identical tiles (e.g. symmetric)
 const seen=new Set(),o=[];for(const rot of r){const sig=edgesOf(inst,rot).join('')+'/'+T[inst.t].segs.map((s,i)=>s.s.map(v=>(v+rot)%4).sort().join('')+':'+(inst.g[i]||[]).join('')+inst.d[i]).sort().join('.');
  if(!seen.has(sig)){seen.add(sig);o.push(rot);}}return o;}
function hasLegal(st,inst){for(const k of st.front){const x=Math.floor(k/4096)-2048,y=k%4096-2048;for(let r=0;r<4;r++)if(canPlace(st,inst,x,y,r))return true;}return false;}

function putTile(st,inst,x,y,rot,owner){
 const ti=st.tiles.length,e=edgesOf(inst,rot),tile={x,y,inst,rot,owner,e,side:[-1,-1,-1,-1],nodes:[],turn:st.turnNo};
 st.tiles.push(tile);st.grid.set(K(x,y),ti);st.front.delete(K(x,y));
 if(!st.bb)st.bb={x0:x,y0:y,x1:x,y1:y};else{st.bb.x0=Math.min(st.bb.x0,x);st.bb.y0=Math.min(st.bb.y0,y);st.bb.x1=Math.max(st.bb.x1,x);st.bb.y1=Math.max(st.bb.y1,y);}
 for(let s=0;s<4;s++){const k=K(x+DX[s],y+DY[s]);if(!st.grid.has(k))st.front.add(k);}
 const def=T[inst.t];
 def.segs.forEach((sg,i)=>{const n=st.par.length;st.par.push(n);
  st.F.push({k:sg.k,open:sg.s.length,tiles:new Set([ti]),goods:goodsCount(inst.g[i]),dock:inst.d[i]?1:0,lm:(sg.end==='pyr'||sg.end==='market')?1:0,closed:false});
  tile.nodes.push(n);for(const s of sg.s)tile.side[(s+rot)%4]=n;});
 const touched=new Set(),sealed=[];
 for(let s=0;s<4;s++){if(shore(st,x+DX[s],y+DY[s])){if(e[s]==='G'||e[s]==='C')st.F[find(st,tile.side[s])].open-=1;continue;}const nb=st.grid.get(K(x+DX[s],y+DY[s]));if(nb===undefined)continue;const ne=st.tiles[nb].e[(s+2)%4];
  if(e[s]==='X'){if(ne==='G'||ne==='C'){const n=st.tiles[nb].side[(s+2)%4];st.F[find(st,n)].open-=1;sealed.push(n);}continue;}
  if(e[s]==='W')continue;
  if(ne==='X'){st.F[find(st,tile.side[s])].open-=1;continue;}
  const a=tile.side[s],b=st.tiles[nb].side[(s+2)%4];const r=union(st,a,b);st.F[r].open-=2;}
 for(const n of tile.nodes)touched.add(find(st,n));for(const n of sealed)touched.add(find(st,n));
 if(def.ctr==='pyr')st.pyrs.push({t:ti,x,y,done:false});
 return {ti,roots:[...touched]};
}

/* ---- scoring ---- */
function counts(st,tiles){const c=new Array(st.np).fill(0);for(const t of tiles){const o=st.tiles[t].owner;if(o>=0)c[o]++;}return c;}
function split(c,v){ // majority full, runner-up half, ties share the rank
 const g=c.map(()=>0),mx=Math.max(...c);if(mx<=0||v<=0)return g;let sec=0;
 c.forEach((n,i)=>{if(n===mx)g[i]=v;else if(n>sec)sec=n;});
 if(sec>0){const h=Math.floor(v/2);c.forEach((n,i)=>{if(n===sec)g[i]=h;});}
 return g;}
function gardenValue(st,f,prices){let v=0,n=0;for(let i=0;i<3;i++){v+=f.goods[i]*prices[i];n+=f.goods[i];}if(f.dock)v+=n*RULES.dockBonus;return v;}
function featValue(st,f){return f.k==='G'?gardenValue(st,f,st.prices):f.tiles.size+RULES.lmBonus*f.lm;}
function pyrTiles(st,P){const a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const t=st.grid.get(K(P.x+dx,P.y+dy));if(t!==undefined)a.push(t);}return a;}

function award(st,g,cat){g.forEach((v,i)=>{st.scores[i]+=v;st.br[i][cat]+=v;});}

/* ---- a turn: take offer[oi], place at x,y,rot ---- */
function play(st,oi,x,y,rot){
 if(st.over)throw new Error('match over');
 const inst=st.offer[oi];if(!inst||!canPlace(st,inst,x,y,rot))throw new Error('illegal move');
 const p=st.turn,ev=[];st.offer.splice(oi,1);st.moves.push([oi,x,y,rot]);
 const {ti,roots}=putTile(st,inst,x,y,rot,p);
 if(st.lim&&st.bb){const b=st.bb,mx=[b.x1-b.x0+1>=st.lim[0],b.y1-b.y0+1>=st.lim[1]];
  for(let a=0;a<2;a++){if(!mx[a]||st.maxed[a])continue;st.maxed[a]=true;ev.push({type:'shore',axis:a});   // the shore appears on this axis: seal edges already facing it
   st.tiles.forEach((t,k)=>{if(k===ti)return;for(const d of(a?[0,2]:[1,3])){const nx=t.x+DX[d],ny=t.y+DY[d];if(!shore(st,nx,ny)||st.grid.has(K(nx,ny)))continue;
    if(t.e[d]==='G'||t.e[d]==='C'){const r=find(st,t.side[d]);st.F[r].open-=1;if(!roots.includes(r))roots.push(r);}}});}}
 ev.push({type:'place',ti,p,x,y,rot,inst});
 const prices=st.prices.slice(),sold=[0,0,0];
 for(const r of roots){const f=st.F[r];if(!f||f.closed||f.open!==0)continue;f.closed=true;
  const c=counts(st,f.tiles),v=featValue(st,f),g=split(c,v);award(st,g,f.k);
  if(f.k==='G')for(let i=0;i<3;i++)sold[i]+=f.goods[i];
  ev.push({type:'close',kind:f.k,root:r,tiles:[...f.tiles],counts:c,value:v,gains:g,goods:f.goods.slice(),dock:f.dock,lm:f.lm,prices});}
 for(const P of st.pyrs){if(P.done)continue;if(Math.abs(P.x-x)>1||Math.abs(P.y-y)>1)continue;const tl=pyrTiles(st,P);
  if(tl.length===9){P.done=true;const c=counts(st,tl),g=split(c,RULES.pyrVal);award(st,g,'P');ev.push({type:'close',kind:'P',pyr:P,tiles:tl,counts:c,value:RULES.pyrVal,gains:g});}}
 const mkt=LEVELS[st.lv].market!==false;
 if(mkt&&sold[0]+sold[1]+sold[2]>0){const before=st.prices.slice();
  for(let i=0;i<3;i++){if(!st.act[i])continue;
   if(sold[i]>0)st.prices[i]=Math.max(RULES.lo,st.prices[i]-RULES.drop-(sold[i]>=RULES.bigDrop?1:0));
   else st.prices[i]=Math.min(RULES.hi,st.prices[i]+RULES.rise);}
  st.lastSale={before,after:st.prices.slice(),sold};ev.push({type:'market',before,after:st.prices.slice(),sold});}
 else if(mkt&&RULES.revert){const before=st.prices.slice();let ch=false;   // a quiet turn: prices drift one step back toward normal
  for(let i=0;i<3;i++){if(!st.act[i])continue;const b=RULES.start[i];if(st.prices[i]<b){st.prices[i]++;ch=true;}else if(st.prices[i]>b){st.prices[i]--;ch=true;}}
  if(ch)ev.push({type:'market',before,after:st.prices.slice(),sold:[0,0,0],drift:true});}
 st.turnNo++;st.turn=(st.turn+1)%st.np;
 refill(st,ev);
 if(!st.offer.length){st.over=true;endScore(st,ev);}
 return ev;
}
/* The director: the bag stays the bag (same tiles, same count), but each draw looks a few tiles ahead and,
   more often as the city grows, deals the one that fits the board best: tiles that finish open gardens and
   causeways, sit snugly against several neighbours, or fill a hole. Both players draw from the same offer,
   so it shapes the city without favouring either side. Deterministic for a seed and a move list. */
function fitScore(st,inst){let best=-1;const holes=new Set();
 for(const k of st.front){const x=Math.floor(k/4096)-2048,y=k%4096-2048;let n=0;for(let d=0;d<4;d++)if(st.grid.has(K(x+DX[d],y+DY[d])))n++;
  for(let r=0;r<4;r++){if(!canPlace(st,inst,x,y,r))continue;const h=hypo(st,inst,x,y,r,0);let cl=0;for(const g of h.groups)if(g.open===0)cl++;for(const q of h.pyr)if(q.n===9)cl++;
   const v=DIRECTOR.close*cl+DIRECTOR.snug*(n-1)+(n>=3?DIRECTOR.hole:0);if(v>best)best=v;}}
 return best;}
function draw(st){
 if(!DIRECTOR.on||st.di>=st.deck.length-1||st.tiles.length<3)return st.deck[st.di++];
 const p=st.di/st.deck.length,end=Math.min(st.deck.length,st.di+(p>=DIRECTOR.lateAt?DIRECTOR.lateWin:DIRECTOR.win));
 if(st.drng()>DIRECTOR.str*(.45+DIRECTOR.late*p))return st.deck[st.di++];
 let bi=st.di,bv=-Infinity;for(let i=st.di;i<end;i++){const v=fitScore(st,st.deck[i])+st.drng()*.3;if(v>bv){bv=v;bi=i;}}
 const t=st.deck[bi];st.deck[bi]=st.deck[st.di];st.deck[st.di]=t;return st.deck[st.di++];}
function refill(st,ev){
 for(;;){while(st.offer.length<3&&st.di<st.deck.length)st.offer.push(draw(st));
  const dead=st.offer.findIndex(o=>!hasLegal(st,o));if(dead<0)break;
  if((st.frame||st.lim)&&[...st.front].some(k=>{const x=Math.floor(k/4096)-2048,y=k%4096-2048;return canPlace(st,{t:'ward',g:[],d:[]},x,y,0);})&&[...st.front].some(k=>inFrame(st,Math.floor(k/4096)-2048,k%4096-2048))){const o=st.offer[dead];st.offer[dead]={t:'ward',g:[],d:[],id:o.id,key:'ward'};ev.push({type:'toward',inst:o});st.discards++;continue;}
  ev.push({type:'discard',inst:st.offer[dead]});st.offer.splice(dead,1);st.discards++;
  if(!st.offer.length&&st.di>=st.deck.length)break;}
}
function endScore(st,ev){
 const seen=new Set();
 for(let n=0;n<st.par.length;n++){const r=find(st,n);if(seen.has(r))continue;seen.add(r);const f=st.F[r];if(!f||f.closed)continue;
  const v=f.k==='G'?f.goods[0]+f.goods[1]+f.goods[2]:f.tiles.size;const c=counts(st,f.tiles),g=split(c,v);
  if(g.some(Boolean)){award(st,g,'E');ev.push({type:'final',kind:f.k,root:r,tiles:[...f.tiles],counts:c,value:v,gains:g});}}
 for(const P of st.pyrs){if(P.done)continue;const tl=pyrTiles(st,P),c=counts(st,tl),g=split(c,tl.length);
  if(g.some(Boolean)){award(st,g,'E');ev.push({type:'final',kind:'P',pyr:P,tiles:tl,counts:c,value:tl.length,gains:g});}}
 ev.push({type:'over',scores:st.scores.slice()});
}
function replay(lv,seed,opt,moves){const st=newMatch(lv,seed,opt);for(const m of moves){if(st.over)break;play(st,m[0],m[1],m[2],m[3]);}return st;}

/* ---- info for a placed tile (what the player sees on tap) ---- */
function tileInfo(st,ti){const tile=st.tiles[ti],out=[],seen=new Set();
 for(const n of tile.nodes){const r=find(st,n);if(seen.has(r))continue;seen.add(r);const f=st.F[r];
  out.push({kind:f.k,root:r,tiles:[...f.tiles],counts:counts(st,f.tiles),open:f.open,closed:f.closed,goods:f.goods.slice(),dock:f.dock,lm:f.lm,value:featValue(st,f),endValue:f.k==='G'?f.goods[0]+f.goods[1]+f.goods[2]:f.tiles.size});}
 for(const P of st.pyrs){if(Math.abs(P.x-tile.x)>1||Math.abs(P.y-tile.y)>1)continue;const tl=pyrTiles(st,P);
  out.push({kind:'P',pyr:P,tiles:tl,counts:counts(st,tl),open:9-tl.length,closed:P.done,value:RULES.pyrVal,endValue:tl.length});}
 return out;}

/* ---- hypothetical placement (no mutation) — used for preview and the rival ---- */
function hypo(st,inst,x,y,rot,p){
 const def=T[inst.t],e=edgesOf(inst,rot),segs=def.segs.map((sg,i)=>({k:sg.k,sides:sg.s.map(s=>(s+rot)%4),open:sg.s.length,goods:goodsCount(inst.g[i]),dock:inst.d[i]?1:0,lm:(sg.end==='pyr'||sg.end==='market')?1:0}));
 const gp=segs.map((_,i)=>i),gf=a=>{while(gp[a]!==a)a=gp[a];return a;};
 const rootsOf=segs.map(()=>new Set()),match=segs.map(()=>0),sideSeg=[-1,-1,-1,-1];
 segs.forEach((s,i)=>s.sides.forEach(sd=>sideSeg[sd]=i));
 const rootOwner=new Map(),sealN=new Map(),selfSeal=segs.map(()=>0);
 for(let s=0;s<4;s++){if(shore(st,x+DX[s],y+DY[s])){if(e[s]==='G'||e[s]==='C')selfSeal[sideSeg[s]]++;continue;}const nb=st.grid.get(K(x+DX[s],y+DY[s]));if(nb===undefined)continue;const ne=st.tiles[nb].e[(s+2)%4];
  if(e[s]==='X'){if(ne==='G'||ne==='C'){const r=find(st,st.tiles[nb].side[(s+2)%4]);sealN.set(r,(sealN.get(r)||0)+1);}continue;}
  if(e[s]==='W')continue;
  if(ne==='X'){selfSeal[sideSeg[s]]++;continue;}
  const i=sideSeg[s],r=find(st,st.tiles[nb].side[(s+2)%4]);let gi=gf(i);
  if(rootOwner.has(r)){const gj=gf(rootOwner.get(r));if(gj!==gi){gp[gj]=gi;}}
  rootOwner.set(r,gi);match[i]++;}
 const groups=new Map();
 segs.forEach((s,i)=>{const g=gf(i);if(!groups.has(g))groups.set(g,{k:s.k,segs:[],roots:new Set(),m:0,ss:0});const G=groups.get(g);G.segs.push(s);G.m+=match[i];G.ss+=selfSeal[i];});
 for(const [r,gi] of rootOwner)groups.get(gf(gi)).roots.add(r);
 const out=[];
 for(const G of groups.values()){
  const tiles=new Set([-1]);let open=0,lm=0,dock=0;const goods=[0,0,0];
  for(const r of G.roots){const f=st.F[r];for(const t of f.tiles)tiles.add(t);open+=f.open;lm+=f.lm;dock+=f.dock;for(let i=0;i<3;i++)goods[i]+=f.goods[i];}
  for(const s of G.segs){open+=s.open;lm+=s.lm;dock+=s.dock;for(let i=0;i<3;i++)goods[i]+=s.goods[i];}
  open-=2*G.m+G.ss;
  const c=new Array(st.np).fill(0);for(const t of tiles){const o=t<0?p:st.tiles[t].owner;if(o>=0)c[o]++;}
  out.push({k:G.k,roots:[...G.roots],open,tiles:tiles.size,lm,dock,goods,counts:c});}
 for(const[r,n]of sealN){const f=st.F[r];out.push({k:f.k,roots:[r],open:f.open-n,tiles:f.tiles.size,lm:f.lm,dock:f.dock,goods:f.goods.slice(),counts:counts(st,f.tiles)});}
 // pyramid districts touched
 const pyr=[];
 for(const P of st.pyrs){if(P.done||Math.abs(P.x-x)>1||Math.abs(P.y-y)>1)continue;const tl=pyrTiles(st,P),c=counts(st,tl);c[p]++;pyr.push({P,n:tl.length+1,c,before:counts(st,tl),nb:tl.length});}
 if(def.ctr==='pyr'){let n=1;const c=new Array(st.np).fill(0);c[p]++;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const t=st.grid.get(K(x+dx,y+dy));if(t!==undefined){n++;const o=st.tiles[t].owner;if(o>=0)c[o]++;}}pyr.push({P:null,n,c,before:null,nb:0});}
 return {groups:out,pyr};
}
/* what a confirmed placement would score right now (shown to the player as values, never as advice) */
function preview(st,inst,x,y,rot,p){
 const h=hypo(st,inst,x,y,rot,p),res=[];
 for(const g of h.groups){if(g.open!==0)continue;const v=g.k==='G'?gardenValue(st,g,st.prices):g.tiles+RULES.lmBonus*g.lm;res.push({kind:g.k,value:v,gains:split(g.counts,v),counts:g.counts,goods:g.goods});}
 for(const q of h.pyr)if(q.n===9)res.push({kind:'P',value:RULES.pyrVal,gains:split(q.c,RULES.pyrVal),counts:q.c});
 return res;
}

/* ---- the rival ---- */
const PROF={
 calm:{noise:6,timing:false,oppW:.35,deny:0,top:4,look:.6,snug:.35},
 fair:{noise:1.2,timing:true,oppW:.85,deny:.25,top:1,look:1,snug:.35},
 sharp:{noise:.25,timing:true,oppW:1.05,deny:.5,top:1,look:1.15,snug:.35}
};
function shares(c){const s=c.map(()=>0),mx=Math.max(...c);if(mx<=0)return s;let sec=0;c.forEach((n,i)=>{if(n===mx)s[i]=1;else if(n>sec)sec=n;});if(sec>0)c.forEach((n,i)=>{if(n===sec)s[i]=.5;});return s;}
function util(g,p,w){let o=0,n=0;g.forEach((v,i)=>{if(i!==p){o+=v;n++;}});return g[p]-w*(n?o/n:0);}
function expVal(st,f,prof,left,isGroup){ // expected value of an open or closed feature
 const k=f.k,open=f.open,nT=isGroup?f.tiles:f.tiles.size,goods=f.goods,lm=f.lm,dock=f.dock;
 if(k==='G'){let n=goods[0]+goods[1]+goods[2];
  const pr=st.prices.map((v,i)=>prof.timing?(.25*v+.75*RULES.start[i]):v);let full=0;for(let i=0;i<3;i++)full+=goods[i]*pr[i];if(dock)full+=n;
  if(open===0){let v=0;for(let i=0;i<3;i++)v+=goods[i]*st.prices[i];if(dock)v+=n;return v;}
  const pc=Math.min(1,left/8)/(1+.42*open);return pc*full+(1-pc)*n;}
 const full=nT+RULES.lmBonus*lm;if(open===0)return full;
 const pc=Math.min(1,left/8)/(1+.5*open);return pc*(full+.6*prof.look)+(1-pc)*nT;
}
function featU(st,f,p,prof,left,isGroup){const v=expVal(st,f,prof,left,isGroup),c=isGroup?f.counts:counts(st,f.tiles);const s=shares(c);return util(s.map(x=>x*v),p,prof.oppW);}
function evalMove(st,inst,x,y,rot,p,prof,w){
 const h=hypo(st,inst,x,y,rot,p),left=st.offer.length+st.deck.length-st.di-1;let u=0;
 for(const g of h.groups){let before=0;for(const r of g.roots){const f=st.F[r];before+=featU(st,f,p,prof,left,false);}
  const after=featU(st,g,p,prof,left,true);const wk=w&&w[g.k]||1;u+=(after-before)*wk;}
 for(const q of h.pyr){const sb=q.before?shares(q.before):null;
  const val=n=>n>=9?RULES.pyrVal:(Math.min(1,left/8)*(RULES.pyrVal*(.4+.06*n))+(1-Math.min(1,left/8))*n);
  const aft=util(shares(q.c).map(x=>x*val(q.n)),p,prof.oppW),bef=sb?util(sb.map(x=>x*val(q.nb)),p,prof.oppW):0;u+=(aft-bef)*(w&&w.P||1);}
 let nbs=0;for(let s=0;s<4;s++)if(st.grid.has(K(x+DX[s],y+DY[s])))nbs++;u+=(prof.snug!=null?prof.snug:.08)*nbs;
 return u;
}
function bestFor(st,inst,p,prof,w){let best=null;for(const L of legal(st,inst))for(const r of L.rots){const u=evalMove(st,inst,L.x,L.y,r,p,prof,w);if(!best||u>best.u)best={x:L.x,y:L.y,r,u};}return best;}
function aiChoose(st,diff,rnd,w){
 const prof=PROF[diff]||PROF.fair,p=st.turn,cands=[];
 const gauss=()=>{let a=0;for(let i=0;i<4;i++)a+=rnd();return (a-2)*1.73;};
 st.offer.forEach((inst,oi)=>{for(const L of legal(st,inst))for(const r of L.rots){cands.push({oi,x:L.x,y:L.y,r,u:evalMove(st,inst,L.x,L.y,r,p,prof,w)+gauss()*prof.noise});}});
 if(!cands.length)return null;
 if(prof.deny&&st.offer.length>1){const nxt=(p+1)%st.np,opp={};
  st.offer.forEach((inst,oi)=>{const b=bestFor(st,inst,nxt,PROF.fair);opp[oi]=b?b.u:0;});
  for(const c of cands){let m=0;for(const oi in opp)if(+oi!==c.oi)m=Math.max(m,opp[oi]);c.u-=prof.deny*m;}}
 cands.sort((a,b)=>b.u-a.u);
 const k=Math.min(prof.top,cands.length),pick=cands[Math.floor(rnd()*k)];
 return {oi:pick.oi,x:pick.x,y:pick.y,r:pick.r};
}

return {T,LEVELS,RULES,GOODS,DX,DY,K,mulberry,newMatch,play,replay,legal,canPlace,edgesOf,find,tileInfo,preview,aiChoose,bagSize,PROF,split,starTh,starsFor,hypo,headStart,DIRECTOR,CLOSER,inFrame,shore,ISLAND};
})();

  for(const t of st.tiles){const[sx,sy]=w2s(t.x,t.y);for(let d=0;d<4;d++){if(st.grid.has(AC.K(t.x+AC.DX[d],t.y+AC.DY[d])))continue;
   const o=pass?0:0;if(d===0){ctx.moveTo(sx,sy+o);ctx.lineTo(sx+s,sy+o);}else if(d===1){ctx.moveTo(sx+s,sy);ctx.lineTo(sx+s,sy+s);}else if(d===2){ctx.moveTo(sx,sy+s);ctx.lineTo(sx+s,sy+s);}else{ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+s);}}}
  ctx.stroke();}ctx.restore();}

/* ---------- fx ---------- */
const FX={pops:[],glows:[],drops:new Map()};
function pop(wx,wy,text,col,delay){FX.pops.push({wx,wy,text,col,t:-(delay||0)});}
function glow(tiles,col){FX.glows.push({tiles,col,t:0});}

/* ---------- timers that stop while paused ---------- */
let paused=false,FAST=false;const TIMERS=[];
function wait(ms){if(FAST)return Promise.resolve();return new Promise(r=>TIMERS.push({t:ms/1000*(M&&M.fast?.3:1),r}));}

/* ---------- match ---------- */
let M=null,DEMO=null,mid=0,homeY=0;
function names(lv){const L=CITY.levels[lv];return ['You'].concat(L.rivals||[L.rival]);}
function startMatch(lv,how,cur,tut){$('tray').hidden=false;$('bRes').hidden=true;
 const seed=cur?cur.seed:((Math.random()*2147483647)>>>0)||7,diff=tut?'calm':cur?cur.diff:S.diff,isl=cur&&cur.island||(typeof how==='object'?how.island:null)||S.island||'M',opt={island:isl,head:!tut&&diff==='calm'?AC.headStart(lv,isl):0};
 if(cur&&!cur.island)opt.lim=null; // a round saved before islands existed finishes as it began
 if(typeof how==='object')how=how.how;
 if(tut){opt.lead=TUT_LEAD;opt.size=10;}
 let st;try{st=cur?AC.replay(lv,seed,opt,cur.moves):AC.newMatch(lv,seed,opt);}catch(e){st=AC.newMatch(lv,seed,opt);}
 if(cur&&st.over){S.cur=null;save();return home();}   // a saved round that had already finished: nothing to continue, and nothing to report twice
 M={id:++mid,lv,diff,seed,opt,st,sel:-1,ghost:null,legal:null,busy:false,info:null,lastRv:null,rvSlot:null,ai:AC.mulberry(seed^0x5bd1e995),fast:false,ended:false,
  names:names(lv),shown:st.scores.slice(),hint:!tut&&S.tut<1?0:-1,tut:tut?{i:0}:null,tutorial:!!tut};
 TIMERS.length=0;FX.pops=[];FX.glows=[];FX.drops.clear();
 if(!tut){saveCur();rndArm(how);}else rnd={armed:false,open:false,secs:0,how:'new'};
 $('home').hidden=true;$('game').hidden=false;closeModal();hideInfo();
 viewRect();buildScore();if(tut){hideBanner();coach();}else{hideCoach();showBanner();}
 requestAnimationFrame(()=>{viewRect();$('bFit').style.top=(VR.y+6)+'px';fitCam(true);});viewRect();fitCam(true);
 refresh();
 if(st.over)finish();else if(st.turn!==0)rivalTurn();
}
/* a finished round is never saved as one to continue */
function saveCur(){if(!M||M.tutorial||M.ended||M.st.over)return;S.cur={city:CITY.id,lv:M.lv,diff:M.diff,seed:M.seed,island:M.st.lim?M.st.island:undefined,moves:M.st.moves};save();}
function myTurn(){return M&&!M.busy&&!M.st.over&&M.st.turn===0&&!M.ended;}
function selSlot(i){if(!myTurn()||!M.st.offer[i])return;if(M.tut){const T=TUT[M.tut.i];if(!T.slot||i!==M.tut.slot){nudge('.slot[data-i="'+i+'"]');return;}}rndStart();hideBanner();hideInfo();
 if(M.sel===i){return;}
 M.sel=i;const inst=M.st.offer[i];M.legal=new Map();for(const L of AC.legal(M.st,inst))if(!M.tut||!M.tut.cell||(L.x===M.tut.cell[0]&&L.y===M.tut.cell[1]))M.legal.set(AC.K(L.x,L.y),L.rots);
 if(M.ghost){const r=M.legal.get(AC.K(M.ghost.x,M.ghost.y));if(r){if(!r.includes(M.ghost.r))M.ghost.r=r[0];}else M.ghost=null;}
 if(M.hint===0)M.hint=1;sfx('sel');refresh();if(M.tut&&M.tut.i===1)tutGo(2);}
function rotate(){if(!myTurn()||!M.ghost)return;const r=M.legal.get(AC.K(M.ghost.x,M.ghost.y));if(!r||r.length<2){M.ghost.wob=1;sfx('tap');return;}
 M.ghost.r=r[(r.indexOf(M.ghost.r)+1)%r.length];M.ghost.spin=1;sfx('tap');if(M.hint===2)M.hint=3;refresh();}
function boardTap(sx,sy){
 if(!M)return;rndStart();hideBanner();
 if(M.busy){M.fast=true;return;}
 const[wx,wy]=s2w(sx,sy),x=Math.floor(wx),y=Math.floor(wy);
 if(myTurn()&&M.sel>=0){const rots=M.legal.get(AC.K(x,y));
  if(rots){if(M.ghost&&M.ghost.x===x&&M.ghost.y===y)rotate();else{const r=M.ghost&&rots.includes(M.ghost.r)?M.ghost.r:rots[0];M.ghost={x,y,r,t:0};sfx('tap');if(M.hint===1)M.hint=2;if(M.tut&&M.tut.i===2)tutGo(3);}
   hideInfo();refresh();return;}}
 const ti=M.st.grid.get(AC.K(x,y));if(ti!==undefined){showInfo(ti);return;}
 hideInfo();
}
async function confirmMove(){if(!myTurn()||!M.ghost||M.sel<0)return;if(M.tut&&M.tut.i!==3&&M.tut.i!==5)return;const id=M.id,{x,y,r}=M.ghost,oi=M.sel;
 M.sel=-1;M.ghost=null;M.legal=null;M.lastRv=null;hideInfo();
 const before=M.st.scores.slice();let ev;try{ev=AC.play(M.st,oi,x,y,r);}catch(e){refresh();return;}
 M.shown=before;if(S.tut<1){S.tut=1;}M.hint=-1;saveCur();sfx('place');buzz(12);M.busy=true;refresh();setPrev('&nbsp;');
 await runEvents(ev,0);if(!M||M.id!==id)return;
 M.busy=false;if(M.tut){tutAfter(ev);return;}if(M.st.over)return finish();if(M.st.turn!==0)rivalTurn();else refresh();}
async function rivalTurn(){const id=M.id;M.busy=true;refresh();
 while(M&&M.id===id&&!M.st.over&&M.st.turn!==0){const p=M.st.turn;setPrev(`<span class="${p===1?'r':'r2'}">${esc(M.names[p])}</span> is choosing a tile…`);
  await wait(650);if(!M||M.id!==id)return;
  const L=CITY.levels[M.lv],mv=AC.aiChoose(M.st,M.diff,M.ai,L.w);if(!mv)break;
  M.rvSlot={i:mv.oi,p};refreshTray();await wait(520);if(!M||M.id!==id)return;M.rvSlot=null;
  const before=M.st.scores.slice();const ev=AC.play(M.st,mv.oi,mv.x,mv.y,mv.r);M.shown=before;saveCur();sfx('rival');
  M.lastRv={ti:ev[0].ti,p};await runEvents(ev,p);if(!M||M.id!==id)return;}
 if(!M||M.id!==id)return;M.busy=false;M.fast=false;if(M.st.over)return finish();sfx('turn');refresh();}
async function runEvents(ev,p){const id=M.id,st=M.st;
 for(const e of ev){if(!M||M.id!==id)return;
  if(e.type==='place'){FX.drops.set(e.ti,0);ensureVisible(e.x,e.y);refresh();await wait(260);}
  else if(e.type==='close'||e.type==='final'){const fin=e.type==='final';glow(e.tiles,fin?'rgba(255,255,255,':'rgba(255,214,110,');
   let cx=0,cy=0;for(const t of e.tiles){cx+=st.tiles[t].x+.5;cy+=st.tiles[t].y+.5;}cx/=e.tiles.length;cy/=e.tiles.length;
   let k=0;e.gains.forEach((g,i)=>{if(g>0){pop(cx,cy-k*.42,'+'+g,COLS[i],k*.12);k++;M.shown[i]+=g;}});
   if(!fin){sfx(e.kind==='G'?'sale':e.kind==='C'?'road':'temple',e.value);if(e.kind==='G'&&e.dock)toast('Dock: +1 per crop');}
   refreshScores();await wait(fin?360:640);}
  else if(e.type==='market'){marketAnim(e);if(!e.drift){await wait(240);if(!M.tutorial&&!S.mkTip&&!FAST){S.mkTip=1;save();await tip(marketTip(e));if(!M||M.id!==id)return;}}}
  else if(e.type==='discard'){toast('A tile that fitted nowhere was set aside');await wait(380);}
  else if(e.type==='toward'){toast('No space fitted a tile, so it was rebuilt as a walled ward');await wait(500);}
  else if(e.type==='shore'){toast(e.axis?'The city is full height: the shore is set top and bottom':'The city is full width: the shore is set left and right');sfx('road');await wait(600);}
  else if(e.type==='over'){await wait(500);}}
 if(M&&M.id===id){M.shown=M.st.scores.slice();refresh();}}
function finish(forced){if(!M||M.ended)return;if(M.tutorial){M.ended=true;M.busy=false;S.tut=2;save();sfx('win');refresh();return setTimeout(()=>{if(M&&M.ended)showTutEnd();},FAST?0:500);}
 M.ended=true;M.busy=false;const st=M.st;
 const opp=Math.max(...st.scores.slice(1)),margin=st.scores[0]-opp,win=margin>0,stars=win?AC.starsFor(M.lv,M.diff,margin,M.st.island):0;
 const P=prog();const prev=P.st[M.lv];if(stars>P.st[M.lv])P.st[M.lv]=stars;let best=false;if(win&&(P.best[M.lv]==null||margin>P.best[M.lv])){best=P.best[M.lv]!=null;P.best[M.lv]=margin;}
 S.cur=null;save();
 rndEnd(win,{score:st.scores[0],stars,mode:M.diff,city:CITY.id,size:M.st.island,margin:clamp(margin,-999,999)});
 sfx(win?'win':'lose');refresh();
 setTimeout(()=>{if(M&&M.ended)showEnd({win,margin,stars,prev,best,draw:margin===0});},forced||FAST?0:500);}
function forceEnd(win){ // test hook: finish the round through finish()
 if(!M||M.tutorial)startMatch(0,'new');if(M.ended)return;rndStart();const st=M.st,o=Math.max(...st.scores.slice(1));
 if(win){if(st.scores[0]<=o)st.scores[0]=o+1;}else if(st.scores[0]>=o)st.scores[1]=st.scores[0]+1;st.over=true;finish(true);}

/* ---------- guided tutorial (teaching, not a tracked round: site contract §5.2) ---------- */
const TUT_LEAD=[{t:'cap',g:[['m']]},{t:'lake'},{t:'lake'},{t:'cap',g:[['m']]}];
const TUT=[
 {t:()=>`This is ${esc(CITY.market)} of ${esc(CITY.name)}. Your city grows out from here, one tile at a time.`,next:'Next'},
 {t:()=>'Your turn. Pick the garden tile from the tray.',slot:true},
 {t:()=>'Glowing spaces show where a tile fits: every touching edge must match. Tap the glowing space.',cell:true},
 {t:()=>'Tap the tile (or ⟳) to turn it. Point the garden away from the market, then tap <b>✓</b> to set it. Once set, it stays.',hi:'#bOk'},
 {t:()=>`${esc(M.names[1])} takes a turn. Her houses have <b style="color:#2f62d4">blue roofs</b>; yours are <b style="color:#c65a33">terracotta</b>.`,next:'Next'},
 {t:()=>'A garden is finished when water surrounds it. Take the other garden tile and close yours off.',slot:true,cell:true},
 {t:()=>M.tut.sold||'Sold!',hi:'#mkt',next:'Next'},
 {t:()=>'Every garden, causeway and pyramid pays <b>whoever laid the most of its tiles</b>. The runner-up gets half, and if you’ve laid the same number, you both get it all. So building onto a rival’s garden earns you a share.',next:'Next'},
 {t:()=>`That’s the game. Sell more, and better, than ${esc(M.names[1])} before the bag runs out. Over to you!`,next:'Play on'}];
function coach(){const c=$('coach');if(!M||!M.tut){c.hidden=true;return;}const T=TUT[M.tut.i];
 c.innerHTML=`<div class="step">Learn to play · ${M.tut.i+1} of ${TUT.length}</div><p>${T.t()}</p><div class="cb"><button class="skip" id="cSkip">Skip tutorial</button>${T.next?`<button class="nx" id="cNext">${T.next}</button>`:''}</div>`;
 c.hidden=false;$('cSkip').onclick=()=>{S.tut=2;save();goFS();startMatch(0,'new');};if($('cNext'))$('cNext').onclick=()=>{sfx('tap');tutNext();};
 document.querySelectorAll('.hi').forEach(e=>e.classList.remove('hi'));
 const sel=T.slot&&M.tut.slot!=null?'.slot[data-i="'+M.tut.slot+'"]':T.hi;if(sel){const e=document.querySelector(sel);if(e)e.classList.add('hi');}
 setPrev('&nbsp;');refreshTray();viewRect();fitCam(false);}
function hideCoach(){const was=!$('coach').hidden;$('coach').hidden=true;document.querySelectorAll('.hi').forEach(e=>e.classList.remove('hi'));if(was&&M){viewRect();fitCam(false);}}
function tutGo(i){M.tut.i=i;clearMarketMarks();if(i===1){M.tut.slot=0;M.tut.cell=[0,-1];}if(i===5)tutTarget();if(M.tut)coach();}
function tutNext(){const i=M.tut.i;if(i===TUT.length-1){M.tut=null;hideCoach();refresh();if(M.st.over)finish();else if(M.st.turn!==0)rivalTurn();return;}tutGo(i+1);}
function tutTarget(){const st=M.st,t=st.tiles.find(x=>x.owner===0);M.tut.cell=null;M.tut.slot=null;
 if(t)for(let d=0;d<4;d++){if(t.e[d]!=='G')continue;const x=t.x+AC.DX[d],y=t.y+AC.DY[d];if(st.grid.has(AC.K(x,y)))continue;M.tut.cell=[x,y];break;}
 const oi=M.tut.cell?st.offer.findIndex(o=>o.t==='cap'&&AC.legal(st,o).some(L=>L.x===M.tut.cell[0]&&L.y===M.tut.cell[1])):-1;M.tut.slot=oi>=0?oi:null;
 if(M.tut.slot==null){M.tut=null;hideCoach();refresh();}}
async function tutAfter(ev){const id=M.id;
 if(M.tut.i===3){M.busy=true;refresh();await wait(500);if(!M||M.id!==id)return;   // the rival's set reply: a lily tile well away from your garden
  const st=M.st,oi=st.offer.findIndex(o=>o.t==='lake'),t0=st.tiles.find(x=>x.owner===0);let best=null;
  if(oi>=0)for(const L of AC.legal(st,st.offer[oi])){const d=Math.abs(L.x-t0.x)+Math.abs(L.y-t0.y);if(!best||d>best.d)best={x:L.x,y:L.y,r:L.rots[0],d};}
  if(best){M.rvSlot={i:oi,p:1};refreshTray();await wait(450);if(!M||M.id!==id)return;M.rvSlot=null;const b=st.scores.slice(),e2=AC.play(st,oi,best.x,best.y,best.r);M.shown=b;sfx('rival');M.lastRv={ti:e2[0].ti,p:1};await runEvents(e2,1);}
  if(!M||M.id!==id)return;M.busy=false;tutGo(4);return;}
 if(M.tut.i===5){const cl=ev.find(e=>e.type==='close'&&e.kind==='G'),mk=ev.find(e=>e.type==='market'&&!e.drift);
  if(cl){const g=CITY.goods,parts=cl.goods.map((n,i)=>n?`${n} ${g[i].n} at ${cl.prices[i]}`:'').filter(Boolean).join(' and ');
   M.tut.sold=`Sold! Your ${parts} each makes <b>${cl.value}</b> points, all yours because you laid both tiles. Crop prices are shown at the top. Here they stay fixed; from Market Day they move.`;M.tut.mk=mk;}
  tutGo(6);return;}
 refresh();}

 openModal(`<h2>Tutorial done</h2><p class="lead">You ${me} · ${esc(M.names[1])} ${op}</p><p class="th" style="font-size:14px">Level 1 is a short match against ${esc(CITY.levels[0].rival)}. Win it to unlock ${esc(CITY.levels[1].name)}.</p>

 $('hlpOk').onclick=()=>{if(fromPause)pause();else closeModal();};if($('hlpTut'))$('hlpTut').onclick=()=>{goFS();startMatch(0,'new',null,true);};}

 const hasNext=M.lv<GRAND()&&unlocked(M.lv+1);const rows=[['Gardens','G'],['Causeways','C'],['Pyramids','P'],['Unfinished','E'],['Head start','H']].filter(([,k])=>st.br.some(b=>b[k]));
 openModal(`<h2>${winner}</h2><p class="lead">${lvLabel(M.lv)}${esc(L.name)} · ${DIFFS[M.diff].n}</p>
 <div class="bigstars">${stars(r.stars)}</div><div class="th">★ win · ★★ by ${th[1]} · ★★★ by ${th[2]}${r.win?` · you won by ${r.margin}${r.best?' (best yet)':''}`:''}</div>
 <div class="res">${M.names.map((n,i)=>`<div class="pl p${i}"><i></i><b>${esc(n)}</b><span>${st.scores[i]}</span></div>`).join('')}</div>
 <table class="bd"><tr><th></th>${M.names.map((n,i)=>`<th style="color:${COLS[i]}">${esc(n)}</th>`).join('')}</tr>${rows.map(([lab,k])=>`<tr><td>${lab}</td>${st.br.map(b=>`<td>${b[k]}</td>`).join('')}</tr>`).join('')}</table>
 ${!r.win&&M.diff!=='calm'?'<p class="th">Calm gives you a head start and a gentler rival.</p>':''}
 <button class="mbtn jd" id="eView">See your city</button>
 <div class="mrow"><button class="mbtn pri" id="eAgain">Again</button>${hasNext?'<button class="mbtn jd" id="eNext">Next level</button>':''}</div>
 <button class="mbtn" id="eLv">Levels</button><a class="mbtn" href="../games.html">← Digi Games</a>`);
 $('eView').onclick=()=>viewCity(true);$('eAgain').onclick=()=>{goFS();viewCity(false);startMatch(M.lv,{how:'retry',island:M.st.island});};if($('eNext'))$('eNext').onclick=()=>{goFS();startMatch(M.lv+1,'new');};$('eLv').onclick=()=>home();}

/* ---------- lifecycle ---------- */
let rsT=0;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{resize();if(M&&!$('banner').hidden)$('banner').style.top=(VR.y+6)+'px';},60);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveCur();if(M&&!M.ended&&$('modal').hidden)pause();}});
addEventListener('pagehide',()=>{saveCur();});

$('home').addEventListener('scroll',()=>{homeY=$('home').scrollTop;viewRect();},{passive:true});
load();resize();home();requestAnimationFrame(frame);

/* ---------- test hook (site contract §5.5) ---------- */
if(TEST)window.__dg={
 end:win=>forceEnd(win),
 fast:v=>{FAST=v!==false;},
 state:()=>M&&{lv:M.lv,diff:M.diff,turn:M.st.turn,over:M.st.over,ended:M.ended,busy:M.busy,scores:M.st.scores.slice(),shown:M.shown.slice(),offer:M.st.offer.length,bag:M.st.deck.length-M.st.di,sel:M.sel,ghost:M.ghost,prices:M.st.prices.slice(),tiles:M.st.tiles.length,moves:M.st.moves.length,secs:rnd.secs},
 save:()=>JSON.parse(JSON.stringify(S)),
 start:(lv,diff,seed,isl)=>{if(diff)S.diff=diff;lv=lv||0;startMatch(lv,'new',seed?{seed,diff:S.diff,moves:[],island:isl||AC.LEVELS[lv].size}:null);},
 legal:i=>M&&AC.legal(M.st,M.st.offer[i]),
 cellXY:(x,y)=>w2s(x+.5,y+.5),
 auto:async n=>{for(let k=0;k<(n||1e9)&&M&&!M.ended;k++){while(M&&M.busy)await new Promise(r=>setTimeout(r,20));if(!M||M.ended||M.st.over)break;
  const m=AC.aiChoose(M.st,'fair',AC.mulberry(k+1));selSlot(m.oi);M.ghost={x:m.x,y:m.y,r:m.r,t:0};await confirmMove();}},
 tut:()=>M&&M.tut&&{i:M.tut.i,cell:M.tut.cell,slot:M.tut.slot},home:()=>home(),zoom:k=>{cam.s=cam.ts=k;cam.man=true;}};

</script>
