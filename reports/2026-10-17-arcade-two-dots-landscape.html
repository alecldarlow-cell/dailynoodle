<style>
:root{--gold:#FFD046;--amber:#FFB13B;--ice:#7FE5E8;--label:#e8d4c8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07070f;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#root{position:fixed;inset:0;touch-action:none;background:#07070f;overflow:hidden}
#game{position:absolute;overflow:hidden}
#game canvas{position:absolute;left:0;top:0;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}
.full{position:absolute;inset:0;pointer-events:none}
.ov{display:flex;flex-direction:column;align-items:center;justify-content:center}
.orb{font-family:Orbitron,Inter,sans-serif;font-weight:700;line-height:normal;white-space:nowrap}
.hide{display:none!important}
/* band edges when the wide view is letterboxed (phone held upright) */
#edgeT,#edgeB{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,208,70,.35),transparent);pointer-events:none}
/* transition card */
#xfer{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#xName{color:#fff;text-align:center;display:flex;justify-content:center;width:100%}
#xStats{display:flex;flex-direction:row;align-items:baseline;flex-wrap:wrap;justify-content:center}
.xRow{display:flex;flex-direction:row;align-items:baseline}
.xL{font-weight:600;color:rgba(232,212,200,.7)}
.xV{font-weight:700;color:var(--label)}
#xName,.xRow{text-shadow:0 1px 10px rgba(0,0,0,.55)}
/* HUD */
#score{position:absolute;left:0;right:0;display:flex;justify-content:center;padding-bottom:8px}
#scoreT{font-size:42px;letter-spacing:4px;text-align:center;text-shadow:0 1px 2px rgba(7,7,15,.45),0 0 12px rgba(7,7,15,.3)}
#pdots{position:absolute;left:0;right:0;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:7px}
#pdots i{width:8px;height:8px;border-radius:4px;background:var(--gold);box-shadow:0 1px 3px rgba(7,7,15,.4)}
#mile{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
#mileT{color:var(--gold);font-size:14px;letter-spacing:2px;text-shadow:0 1px 2px rgba(7,7,15,.5)}
#mileN{color:var(--gold);font-size:28px;letter-spacing:4px;margin-top:6px}
#pbtn{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:none;border:0;cursor:pointer}
#pbtn span{display:flex;gap:5px;align-items:center}
#pbtn i{width:4px;height:18px;border-radius:2px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(7,7,15,.18),0 1px 4px rgba(7,7,15,.45)}
/* pause: a column when there's height, two columns on a landscape phone */
#pause{background:#07070fb8;gap:0}
#pA,#pB{display:flex;flex-direction:column;align-items:center}
#pTitle{color:#fff;font-size:28px;letter-spacing:8px}
#pInfo{display:flex;flex-direction:column;align-items:center;margin-top:20px;margin-bottom:6px}
#pWorld{color:var(--gold);font-size:14px;letter-spacing:3px;text-align:center}
#pDet{display:flex;flex-direction:column;align-items:center;margin-top:6px;gap:4px}
#pDet div{color:rgba(255,255,255,.5);font-size:12px;letter-spacing:1px;text-align:center;margin-top:2px}
#pSub{color:#fff;font-weight:400;font-size:14px;letter-spacing:2px;margin-top:12px}
.ui{pointer-events:auto}
#pSet{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:24px;width:min(250px,72vw)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);font:600 12px Inter,sans-serif;letter-spacing:2px;cursor:pointer;white-space:nowrap}
.tg b{font-weight:700;color:var(--gold);letter-spacing:2px}
.tg[aria-pressed="false"] b{color:rgba(255,255,255,.4)}
.back{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;color:rgba(232,212,200,.75);font:600 13px Inter,sans-serif;letter-spacing:2px;text-decoration:none}
#pBack{margin-top:8px}
#root.short #pause{flex-direction:row;align-items:center;gap:clamp(28px,7vw,72px)}
#root.short #pSet{display:grid;grid-template-columns:1fr 1fr;width:auto;margin-top:0}
#root.short #pSet .tg:last-child{grid-column:1/-1}
#root.short #pB{justify-content:center}
#dBack{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}
#iTop{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 max(6px,env(safe-area-inset-right)) 0 max(6px,env(safe-area-inset-left))}
#iMute{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:rgba(255,255,255,.6);cursor:pointer}
/* idle */
.iw{position:absolute;display:flex;letter-spacing:2px}
#iTwo{justify-content:flex-end}
#iDots{justify-content:flex-start}
#iIns{position:absolute;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-weight:400;letter-spacing:1px;line-height:normal}
.thumb{position:absolute;border-style:solid;border-width:2px;display:flex;align-items:center;justify-content:center}
.thumb span{font-weight:700;letter-spacing:2px;line-height:normal}
/* turn-sideways card (held upright only) */
#turn{position:absolute;left:50%;transform:translateX(-50%);width:min(320px,88vw);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 16px 10px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center}
#turn svg{color:var(--ice);opacity:.85}
#turnT{font:600 14px Inter,sans-serif;letter-spacing:1px;color:#fff}
#turnS{font:400 12px Inter,sans-serif;letter-spacing:.5px;color:rgba(255,255,255,.55);line-height:1.4}
#turnUp{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:none;color:rgba(232,212,200,.85);font:600 12px Inter,sans-serif;letter-spacing:2px;cursor:pointer}
/* death */
#death{background:rgba(0,0,0,.5)}
.dl{font-weight:600;color:var(--label);letter-spacing:3px;line-height:normal}
#dScore{color:var(--gold);letter-spacing:2px;text-align:center;line-height:1}
#dTap{color:#fff;font-weight:400;font-size:14px;letter-spacing:2px;margin-top:14px;visibility:hidden}
@media (prefers-reduced-motion: reduce){#turn svg{animation:none}}
</style>
</head>

<div id="root" role="application" aria-label="Two Dots. Hold your phone sideways. Tap the left half to lift the amber dot and the right half to lift the blue dot. Keep both alive.">
  <div id="game">

    <div id="xfer" class="layer hide">
      <div id="xName" class="orb"><span id="xNameT"></span></div>

    <canvas id="fg"></canvas>

      <button id="pbtn" class="ui" aria-label="Pause"><span><i></i><i></i></span></button>

  </div>
  <div id="edgeT" class="hide"></div><div id="edgeB" class="hide"></div>

  <div id="idle" class="full">

    <div id="thL" class="thumb" style="border-color:#FFB13B99"><span style="color:#FFB13B">TAP</span></div>
    <div id="thR" class="thumb" style="border-color:#7FE5E899"><span style="color:#7FE5E8">TAP</span></div>
    <div id="iTop">
      <a class="back ui" href="../games.html">← Digi Games</a>
      <button id="iMute" class="ui" aria-label="Sound on"></button>

    <div id="turn" class="hide">

  <div id="pause" class="ov full hide">
    <div id="pA">

      </div>
      <a id="pBack" class="back ui" href="../games.html">← Digi Games</a>
    </div>
  </div>

  <div id="death" class="ov full hide">
